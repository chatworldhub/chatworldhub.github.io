// =====================================================================
//  NICKNAMES + BLOCKING  (both are private: only you can see them)
// =====================================================================
const notFromBlocked = (m) => m.sender_id === state.user.id || !state.blocked.has(m.sender_id);
const isBlockedDm = () => state.chat.type === 'dm' && state.blocked.has(state.chat.id);

function friendsErrorText(error) {
  const msg = (error && error.message) || '';
  if (/relation .*(nicknames|blocks)|schema cache|could not find/i.test(msg)) {
    return 'Nicknames and blocking need a one-time database update. Run supabase-friends.sql in Supabase (see README.md).';
  }
  return msg || 'Something went wrong. Please try again.';
}

async function loadFriends() {
  const n = await db.from('nicknames').select('target_id, nickname');
  const b = await db.from('blocks').select('blocked_id');
  const error = n.error || b.error;
  if (error) { state.friendsReady = false; state.friendsError = friendsErrorText(error); return; }
  state.friendsReady = true;
  state.friendsError = '';
  state.nicknames = new Map((n.data || []).map((r) => [r.target_id, r.nickname]));
  state.blocked = new Set((b.data || []).map((r) => r.blocked_id));
}

/** Greys out the message box in a private chat with someone I blocked. */
function updateComposerLock() {
  const locked = isBlockedDm();
  const input = $('#message-input');
  input.disabled = locked;
  $('#send-btn').disabled = locked;
  if (locked) input.placeholder = 'You blocked ' + nameOf(profileOf(state.chat.id)) + '. Unblock them in their profile to chat.';
}

/** Gives someone a nickname that only I can see. An empty name removes it. Returns an error text, or '' when fine. */
async function setNickname(id, value) {
  if (!state.friendsReady) return state.friendsError || 'Nicknames are not ready yet.';
  const nick = value.trim().replace(/\s+/g, ' ');
  if (nick.length > 30) return 'A nickname can be up to 30 characters.';
  let res;
  if (!nick) res = await db.from('nicknames').delete().eq('owner_id', state.user.id).eq('target_id', id);
  else res = await db.from('nicknames').upsert({ owner_id: state.user.id, target_id: id, nickname: nick, updated_at: new Date().toISOString() }, { onConflict: 'owner_id,target_id' });
  if (res.error) return friendsErrorText(res.error);
  if (nick) state.nicknames.set(id, nick); else state.nicknames.delete(id);
  renderUsers(); renderHeader(); renderMessages(); renderMe();
  if (state.chat.type !== 'global') $('#message-input').placeholder = 'Message ' + (state.chat.type === 'group' ? ((state.groups.get(state.chat.id) || {}).name || 'group') : nameOf(profileOf(state.chat.id)));
  updateComposerLock();
  if (call) renderCallPanel();
  return '';
}

/** Blocks or unblocks someone. Returns an error text, or '' when fine. */
async function setBlocked(id, block) {
  if (!state.friendsReady) return state.friendsError || 'Blocking is not ready yet.';
  const res = block
    ? await db.from('blocks').insert({ blocker_id: state.user.id, blocked_id: id })
    : await db.from('blocks').delete().eq('blocker_id', state.user.id).eq('blocked_id', id);
  if (res.error && !/duplicate key/i.test(res.error.message || '')) return friendsErrorText(res.error);

  if (block) {
    state.blocked.add(id);
    // Hang up / hide anything that is happening with them right now.
    if (incoming && incoming.from === id) dismissIncoming();
    if (call && call.kind === 'private' && call.with === id) endPrivate('Call ended.');
    else if (call && call.kind === 'global') closePeer(id);
  } else {
    state.blocked.delete(id);
    if (call && call.kind === 'global') syncPeers();
  }
  toast(block ? 'Blocked. They cannot message or call you.' : 'Unblocked. They can message and call you again.', 'success');
  renderUsers();
  await openChat(state.chat.type, state.chat.id);   // reload the open chat so their messages disappear / come back
  return '';
}

// =====================================================================
//  PRESENCE  (who is online right now)
// =====================================================================
function joinPresence() {
  const channel = db.channel('chatworld-presence', {
    config: { presence: { key: state.user.id } },
  });

  channel
    .on('presence', { event: 'sync' }, () => {
      state.online = new Set(Object.keys(channel.presenceState()));
      state.online.add(state.user.id);
      renderUsers();
      updateHeaderSub();
    })
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        await channel.track({ username: state.profile.username, at: new Date().toISOString() });
      }
    });

  state.presenceChannel = channel;
}


// =====================================================================
//  TYPING INDICATOR  ("... is typing", sent over a free Supabase broadcast channel; nothing is saved)
// =====================================================================
const TYPING_SEND_GAP_MS = 2500;   // while you type we say "still typing" this often
const TYPING_EXPIRE_MS = 5000;     // no news for this long = they stopped
const typers = new Map();          // chat key -> Map(user id -> expiry timer)
let typingChannel = null, typingReady = false;
let typingLastSent = 0, typingTarget = null;

function currentTypingTarget() {
  const c = state.chat;
  if (c.type === 'global') return { scope: 'global', key: 'global' };
  if (c.type === 'group') return { scope: 'group', gid: c.id, key: c.id };
  if (c.type === 'dm') return { scope: 'dm', to: c.id, key: c.id };
  return null;
}

function joinTypingChannel() {
  typingReady = false;
  typingChannel = db.channel('chatworld-typing', { config: { broadcast: { self: false } } });
  typingChannel
    .on('broadcast', { event: 'typing' }, ({ payload }) => onTypingSignal(payload))
    .subscribe((status) => { typingReady = status === 'SUBSCRIBED'; });
}

function leaveTypingChannel() {
  if (typingChannel && db) db.removeChannel(typingChannel);
  typingChannel = null; typingReady = false; typingTarget = null; typingLastSent = 0;
  typers.forEach((m) => m.forEach((t) => clearTimeout(t)));
  typers.clear();
}

function sendTypingSignal(target, on) {
  if (!typingChannel || !typingReady || !target || !state.user) return;
  typingChannel.send({ type: 'broadcast', event: 'typing', payload: {
    from: state.user.id, on, scope: target.scope, to: target.to || null, gid: target.gid || null,
  } });
}

/** Called whenever the message box changes. */
function noticeTyping() {
  const hasText = $('#message-input').value.trim() !== '';
  if (!hasText || isBlockedDm()) { stopTyping(); return; }
  const target = currentTypingTarget();
  if (!target) return;
  const changed = !typingTarget || typingTarget.key !== target.key;
  if (changed && typingTarget) sendTypingSignal(typingTarget, false);   // moved to another chat
  if (changed || Date.now() - typingLastSent >= TYPING_SEND_GAP_MS) {
    typingTarget = target;
    typingLastSent = Date.now();
    sendTypingSignal(target, true);
  }
}

/** Tell the chat we are no longer typing (sent a message, emptied the box, or left the chat). */
function stopTyping() {
  if (typingTarget) sendTypingSignal(typingTarget, false);
  typingTarget = null;
  typingLastSent = 0;
}

function removeTyper(key, uid) {
  const m = typers.get(key);
  if (!m || !m.has(uid)) return;
  clearTimeout(m.get(uid));
  m.delete(uid);
  if (!m.size) typers.delete(key);
  if (key === chatKey()) renderTyping();
}

function onTypingSignal(d) {
  if (!d || typeof d.from !== 'string' || !state.user || d.from === state.user.id) return;
  if (state.blocked.has(d.from)) return;
  let key = null;
  if (d.scope === 'global') key = 'global';
  else if (d.scope === 'dm' && d.to === state.user.id) key = d.from;
  else if (d.scope === 'group' && typeof d.gid === 'string' && state.groups.has(d.gid)) key = d.gid;
  if (!key) return;
  if (!d.on) { removeTyper(key, d.from); return; }
  if (!typers.has(key)) typers.set(key, new Map());
  const m = typers.get(key);
  clearTimeout(m.get(d.from));
  m.set(d.from, setTimeout(() => removeTyper(key, d.from), TYPING_EXPIRE_MS));
  if (key === chatKey()) {
    ensureProfiles([d.from]).then(() => { if (typers.get(key) && typers.get(key).has(d.from)) renderTyping(); });
  }
}

/** Shows (or hides) the animated "typing" row at the bottom of the open chat. */
function renderTyping() {
  const box = $('#messages');
  const old = box.querySelector('.typing-row');
  const ids = state.chat.type === 'shop' ? [] : Array.from((typers.get(chatKey()) || new Map()).keys());
  if (!ids.length) { if (old) old.remove(); return; }
  const people = ids.slice(0, 3).map(profileOf);
  const names = ids.map((id) => nameOf(profileOf(id)));
  const label = names.length === 1 ? names[0] + ' is typing' : names.length === 2 ? names.join(' and ') + ' are typing' : 'Several people are typing';
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  const row = el('div', { class: 'msg typing-row', attrs: { role: 'status', 'aria-label': label, title: label } },
    el('div', { class: 'typing-avatars' }, ...people.map((p) => el('span', { class: 'msg-avatar' }, makeAvatar(p)))),
    el('div', { class: 'typing-bubble' }, el('i'), el('i'), el('i')));
  if (old) old.remove();
  box.append(row);
  if (nearBottom) scrollToBottom();
}


// =====================================================================
//  UNDO  (take back a message you just sent, within 15 seconds)
// =====================================================================
const UNDO_SECONDS = 15;

function undoLeft(id) {
  const until = state.undoUntil.get(id);
  return until ? Math.ceil((until - Date.now()) / 1000) : 0;
}

function makeUndoSlot(id) {
  const slot = el('div', { class: 'undo-slot', attrs: { 'data-mid': String(id) } });
  showUndoButton(slot, id);
  return slot;
}

/** Adds the Undo button to a message that is already on screen. */
function attachUndoSlot(id) {
  if (undoLeft(id) <= 0) return;
  const row = $('#messages').querySelector('.msg[data-mid="' + id + '"]');
  if (row && !row.querySelector('.undo-slot')) row.append(makeUndoSlot(id));
}

function showUndoButton(slot, id) {
  const left = Math.max(0, undoLeft(id));
  const btn = el('button', {
    class: 'undo-btn', attrs: { type: 'button', 'aria-label': 'Undo this message', title: 'Undo this message (' + left + 's left)' },
    on: { click: () => askUndo(slot, id) },
  });
  btn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>';
  btn.append(el('span', { class: 'undo-left', text: left + 's' }));
  slot.replaceChildren(btn);
  slot.dataset.mode = 'button';
}

/** "Are you sure?" step. */
function askUndo(slot, id) {
  slot.dataset.mode = 'ask';
  slot.replaceChildren(
    el('span', { class: 'undo-ask', text: 'Delete this message?' }),
    el('button', { class: 'undo-yes', text: 'Yes, undo', attrs: { type: 'button' }, on: { click: (e) => confirmUndo(slot, id, e.currentTarget) } }),
    el('button', { class: 'undo-no', text: 'Keep', attrs: { type: 'button' }, on: { click: () => showUndoButton(slot, id) } }),
  );
}

function friendlyUndoError(error) {
  const msg = (error && error.message) || '';
  if (/too late|already gone|limit reached|only undo your own|sign in again/i.test(msg)) return msg;
  if (/undo_message|schema cache|could not find the function|PGRST202/i.test(msg)) return 'Undo needs a one-time database update. Run supabase-undo.sql in Supabase (see README.md).';
  return 'Could not undo that message. Please try again.';
}

async function confirmUndo(slot, id, yesBtn) {
  if (undoLeft(id) <= 0) { slot.remove(); toast('Too late to undo: messages can only be undone in the first ' + UNDO_SECONDS + ' seconds.', 'error'); return; }
  yesBtn.disabled = true; yesBtn.textContent = 'Undoing…';
  slot.dataset.busy = '1';
  const { data, error } = await db.rpc('undo_message', { mid: id });
  delete slot.dataset.busy;
  if (error) {
    toast(friendlyUndoError(error), 'error');
    if (/too late|already gone/i.test(error.message || '')) { state.undoUntil.delete(id); slot.remove(); }
    else if (slot.isConnected) showUndoButton(slot, id);
    return;
  }
  state.undoUntil.delete(id);
  removeMessageLocally(id);
  // Clean up the photo/video file too (best effort; the message itself is already gone).
  if (data && data.image_path) db.storage.from('chat-images').remove([data.image_path]).catch(() => {});
  if (data && data.video_path) db.storage.from('chat-videos').remove([data.video_path]).catch(() => {});
  toast('Message undone.', 'success');
}

/** Takes a message off the screen (used when I undo, and when someone else undoes in a chat I am looking at). */
function removeMessageLocally(id) {
  const idx = state.messages.findIndex((m) => String(m.id) === String(id));
  if (idx < 0) return;
  state.messages.splice(idx, 1);
  state.seen.delete(id);
  const box = $('#messages');
  const keep = box.scrollTop, stick = state.stick;
  renderMessages();
  if (stick) scrollToBottom(); else box.scrollTop = keep;
}

/** Runs twice a second: counts the seconds down and removes Undo buttons that ran out of time. */
function tickUndo() {
  document.querySelectorAll('.undo-slot').forEach((slot) => {
    if (slot.dataset.busy) return;
    const id = Number(slot.dataset.mid);
    const left = undoLeft(id);
    if (left <= 0) { slot.remove(); state.undoUntil.delete(id); return; }
    const t = slot.querySelector('.undo-left');
    if (t) { t.textContent = left + 's'; const b = slot.querySelector('.undo-btn'); if (b) b.title = 'Undo this message (' + left + 's left)'; }
  });
}
setInterval(tickUndo, 500);

// =====================================================================
//  REAL-TIME DATABASE EVENTS  (new messages, new people, profile changes)
// =====================================================================
function subscribeRealtime() {
  const channel = db.channel('chatworld-db');

  channel
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' },
      (payload) => onNewMessage(payload.new))
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' },
      (payload) => { if (payload.old && payload.old.id != null) removeMessageLocally(payload.old.id); })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'profiles' },
      (payload) => { state.profiles.set(payload.new.id, payload.new); renderUsers(); })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles' },
      (payload) => {
        state.profiles.set(payload.new.id, payload.new);
        if (payload.new.id === state.user.id) { state.profile = payload.new; renderMe(); }
        renderUsers(); renderHeader(); renderMessages();
      })
    .subscribe((status) => {
      if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
        state.rtWasDown = true;
        toast('Live connection lost. Reconnecting…', 'error');
      } else if (status === 'SUBSCRIBED' && state.rtWasDown) {
        state.rtWasDown = false;
        toast('Back online.', 'success');
        loadMessages(); // catch up on anything we missed
      }
    });

  state.dbChannel = channel;
}

function onNewMessage(m) {
  if (!notFromBlocked(m)) return;   // I blocked this person
  if (m.group_id && !state.groups.has(m.group_id)) { scheduleGroupsRefresh(); return; }   // a group I was just added to
  const key = messageKey(m);
  if (!key) return;
  const mine = m.sender_id === state.user.id;
  if (!mine) removeTyper(key, m.sender_id);

  if (key === chatKey()) {
    addMessage(m);
    if (document.hidden && !mine) { state.awayCount += 1; updateTitle(); }
  } else if (!mine) {
    state.unread.set(key, (state.unread.get(key) || 0) + 1);
    renderUsers();
    updateTitle();
  }
}

function updateTitle() {
  let total = state.awayCount;
  state.unread.forEach((n) => { total += n; });
  document.title = (total > 0 ? '(' + total + ') ' : '') + 'ChatWorld';
}

// =====================================================================
//  OPENING A CHAT + MESSAGE HISTORY
// =====================================================================
async function openChat(type, id = null) {
  if (type === 'shop') { openShop(); return; }
  stopTyping();            // tell the chat we just left that we stopped typing
  showView('chat');
  state.chat = { type, id };
  clearPendingImage();   // a photo chosen for one chat is not carried over to another
  if (!state.uploadingVideo) clearPendingVideo();
  state.stick = true;
  state.unread.delete(type === 'global' ? 'global' : id);
  state.messages = [];
  state.seen = new Set();
  state.hasMore = false;
  closeSidebar();
  renderHeader();
  renderUsers();
  updateTitle();

  const name = type === 'global' ? 'Global Chat' : type === 'group' ? ((state.groups.get(id) || {}).name || 'group') : nameOf(profileOf(id));
  $('#message-input').placeholder = 'Message ' + name;
  updateComposerLock();

  $('#messages').replaceChildren(el('div', { class: 'empty' }, el('span', { class: 'big', text: '⏳' }), el('span', { text: 'Loading messages…' })));
  await loadMessages();

  if (window.matchMedia('(pointer: fine)').matches) $('#message-input').focus();
}

function fetchMessages(before = null) {
  let q = db.from('messages')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(PAGE_SIZE);
  if (before) q = q.lt('created_at', before);

  if (state.chat.type === 'global') {
    q = q.is('recipient_id', null).is('group_id', null);
  } else if (state.chat.type === 'group') {
    q = q.eq('group_id', state.chat.id);
  } else {
    const me = state.user.id;
    const other = state.chat.id;
    q = q.or(`and(sender_id.eq.${me},recipient_id.eq.${other}),and(sender_id.eq.${other},recipient_id.eq.${me})`);
  }
  return q;
}

async function loadMessages() {
  const token = ++state.loadToken;
  const { data, error } = await fetchMessages();
  if (token !== state.loadToken) return; // the user already opened another chat

  if (error) {
    $('#messages').replaceChildren(el('div', { class: 'empty' }, el('span', { class: 'big', text: '⚠️' }),
      el('span', { text: 'Could not load messages: ' + withPhotoHint(error.message) })));
    return;
  }

  await ensureProfiles(data.map((m) => m.sender_id));
  if (token !== state.loadToken) return;

  state.messages = data.slice().reverse().filter(notFromBlocked);
  state.seen = new Set(state.messages.map((m) => m.id));
  state.hasMore = data.length === PAGE_SIZE;
  renderMessages();
  scrollToBottom();
}

async function loadOlder() {
  const oldest = state.messages[0];
  if (!oldest) return;
  const token = state.loadToken;
  const { data, error } = await fetchMessages(oldest.created_at);
  if (token !== state.loadToken) return;
  if (error) { toast('Could not load older messages.', 'error'); return; }

  await ensureProfiles(data.map((m) => m.sender_id));
  const box = $('#messages');
  const oldHeight = box.scrollHeight;
  const oldTop = box.scrollTop;

  const older = data.slice().reverse().filter((m) => !state.seen.has(m.id) && notFromBlocked(m));
  older.forEach((m) => state.seen.add(m.id));
  state.messages = [...older, ...state.messages];
  state.hasMore = data.length === PAGE_SIZE;
  renderMessages();
  box.scrollTop = box.scrollHeight - oldHeight + oldTop;
}

function updateHeaderSub() {

  const sub = $('#chat-sub');

  } else if (state.chat.type === 'shop') {

function emptyState() {
  if (state.chat.type === 'group') {
    const g = state.groups.get(state.chat.id) || { name: 'this group' };
    return el('div', { class: 'empty' },
      el('span', { class: 'big', text: '👥' }),
      el('strong', { text: 'Welcome to ' + g.name }),
      el('span', { text: 'Only the people in this group can see these messages.' }));
  }
  const isGlobal = state.chat.type === 'global';
  return el('div', { class: 'empty' },
    el('span', { class: 'big', text: isGlobal ? '💬' : '👋' }),
    el('strong', { text: isGlobal ? 'Welcome to ChatWorld!' : 'Say hello to ' + nameOf(profileOf(state.chat.id)) }),
    el('span', { text: isGlobal ? 'Be the first to say something to the world.' : 'This is the start of your private conversation.' }),
  );
}

function buildMessageNodes(m, prev) {
  const nodes = [];
  const when = new Date(m.created_at);

  const newDay = !prev || dayKey(new Date(prev.created_at)) !== dayKey(when);
  if (newDay) nodes.push(el('div', { class: 'day-divider', text: formatDay(when) }));

  const grouped = !newDay && prev && prev.sender_id === m.sender_id &&
    (when - new Date(prev.created_at)) < 5 * 60 * 1000;

  const p = profileOf(m.sender_id);
  const mine = m.sender_id === state.user.id;
  const row = el('div', { class: 'msg' + (grouped ? ' grouped' : '') + (mine ? ' mine' : ''), attrs: { 'data-mid': String(m.id) } });

  if (grouped) {
    row.append(el('span', { class: 'msg-gutter', text: formatTime(m.created_at) }));
  } else {
    row.append(el('button', {
      class: 'msg-avatar', attrs: { type: 'button', 'aria-label': 'View profile of ' + nameOf(p) },
      on: { click: () => openProfile(p.id) },
    }, makeAvatar(p)));
  }

  const body = el('div', { class: 'msg-body ' + styleClass(cosOf(m.sender_id).style) });
  if (!grouped) {
    body.append(el('div', { class: 'msg-head' },
      el('button', { class: 'msg-author ' + fxClass(cosOf(p.id).name_effect), text: nameOf(p), attrs: { type: 'button' }, on: { click: () => openProfile(p.id) } }),
      tagEl(cosOf(p.id).tag),
      p.display_name ? el('span', { class: 'msg-handle', text: '@' + p.username }) : null,
      el('span', { class: 'msg-time', text: formatTime(m.created_at) }),
    ));
  }
  if (m.content) body.append(renderContent(m.content)); // text is added as plain text => safe from HTML injection
  if (m.image_path) body.append(renderImage(m.image_path));
  if (m.video_path) body.append(renderVideo(m.video_path));
  row.append(body);
  if (mine && undoLeft(m.id) > 0) row.append(makeUndoSlot(m.id));

  nodes.push(row);
  return nodes;
}

function renderMessages() {
  const box = $('#messages');
  box.replaceChildren();

  if (state.hasMore) {
    box.append(el('button', { class: 'load-more', text: 'Load older messages', attrs: { type: 'button' }, on: { click: loadOlder } }));
  }
  if (!state.messages.length) { box.append(emptyState()); renderTyping(); return; }

  let prev = null;
  for (const m of state.messages) {
    box.append(...buildMessageNodes(m, prev));
    prev = m;
  }
  renderTyping();
}

function scrollToBottom() {
  const box = $('#messages');
  box.scrollTop = box.scrollHeight;
}

async function addMessage(m) {
  if (state.seen.has(m.id)) return;
  await ensureProfiles([m.sender_id]);
  if (state.seen.has(m.id)) return;            // may have arrived while we waited
  if (messageKey(m) !== chatKey()) return;     // user switched chats meanwhile
  state.seen.add(m.id);

  const box = $('#messages');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  const prev = state.messages[state.messages.length - 1] || null;
  state.messages.push(m);

  const empty = box.querySelector('.empty');
  if (empty) empty.remove();
  const typingRow = box.querySelector('.typing-row');
  box.append(...buildMessageNodes(m, prev));
  if (typingRow) box.append(typingRow);   // keep the typing dots below the newest message

  if (nearBottom || m.sender_id === state.user.id) scrollToBottom();
}

function clearPendingImage(keepUrl = false) {
  if (state.pendingImage && !keepUrl) URL.revokeObjectURL(state.pendingImage.url);
  state.pendingImage = null;
  $('#attach-preview').hidden = true;
  $('#attach-thumb').removeAttribute('src');
}

async function choosePhotoForChat(file) {
  if (!file) return;
  try {
    const prepared = await prepareImage(file, { maxSide: CHAT_IMG_MAX });
    clearPendingImage();
    if (!state.uploadingVideo) clearPendingVideo();
    state.pendingImage = prepared;
    $('#attach-thumb').src = prepared.url;
    $('#attach-preview').hidden = false;
    $('#message-input').focus();
  } catch (err) {
    toast(err.message || 'That picture could not be used.', 'error');
  }
}

function clearPendingVideo(keepUrl = false) {
  const v = state.pendingVideo;
  if (v && !keepUrl) URL.revokeObjectURL(v.url);
  state.pendingVideo = null;
  $('#video-preview').hidden = true;
  $('#video-bar').hidden = true;
  $('#video-bar-fill').style.width = '0';
  const t = $('#video-thumb'); t.removeAttribute('src'); try { t.load(); } catch (e) {}
}

async function chooseVideoForChat(file) {
  if (!file) return;
  if (state.uploadingVideo) { toast('Please wait for the current video to finish uploading.'); return; }
  try {
    const prepared = await prepareVideo(file);
    clearPendingVideo();
    clearPendingImage();                       // one attachment per message
    state.pendingVideo = prepared;
    $('#video-thumb').src = prepared.url + '#t=0.001';
    $('#video-name').textContent = prepared.name;
    $('#video-status').textContent = formatDuration(prepared.duration) + ' · ' + formatSize(prepared.size) + ' · ready. Add a caption if you like, then send.';
    $('#video-preview').hidden = false;
    $('#message-input').focus();
  } catch (err) {
    toast(err.message || 'That video could not be used.', 'error');
  }
}

function friendlyUploadError(error) {
  const msg = (error && error.message) || '';
  if (/row-level security|violates|unauthorized|not allowed/i.test(msg)) return 'Photo not sent. You may be sending too many photos. Wait a minute and try again.';
  if (/size|too large|exceed/i.test(msg)) return 'That photo is too big to send.';
  if (/bucket/i.test(msg)) return 'Photos are not set up yet. Run supabase-photos.sql in Supabase (see README.md).';
  return 'Photo upload failed. Please try again.';
}

async function sendMessage(textOverride) {
  const input = $('#message-input');
  const usingImage = typeof textOverride !== 'string' && state.pendingImage ? state.pendingImage : null;
  const usingVideo = typeof textOverride !== 'string' && state.pendingVideo ? state.pendingVideo : null;
  const text = (typeof textOverride === 'string' ? textOverride : input.value).trim();
  if ((!text && !usingImage && !usingVideo) || state.sending) return;
  if (isBlockedDm()) { toast('You blocked this person. Unblock them in their profile to chat.', 'error'); return; }

  if (text.length > MAX_LEN) { toast('Messages can be up to ' + MAX_LEN + ' characters.', 'error'); return; }

  if (Date.now() - state.lastSendAt < MIN_SEND_GAP_MS) {
    toast('Easy there! Wait a moment before sending again.');
    return;
  }

  state.sending = true;
  $('#send-btn').disabled = true;

  // Remember where this message is going, in case the person switches chats while a photo uploads.
  const recipient = state.chat.type === 'dm' ? state.chat.id : null;
  const groupId = state.chat.type === 'group' ? state.chat.id : null;

  let imagePath = null;
  if (usingImage) {
    const me = state.user.id;
    imagePath = (groupId ? 'group/' + groupId + '/' + me : recipient ? 'dm/' + me + '/' + recipient : 'global/' + me) + '/' + randomFileName();
    const up = await db.storage.from('chat-images')
      .upload(imagePath, usingImage.blob, { contentType: 'image/jpeg', cacheControl: '3600', upsert: false });
    if (up.error) {
      state.sending = false;
      $('#send-btn').disabled = false;
      toast(friendlyUploadError(up.error), 'error');
      return;
    }
  }

  let videoPath = null;
  if (usingVideo) {
    const me = state.user.id;
    videoPath = (groupId ? 'group/' + groupId + '/' + me : recipient ? 'dm/' + me + '/' + recipient : 'global/' + me) + '/' + randomVideoName(usingVideo.ext);
    const holder = {};
    state.uploadingVideo = true;
    state.videoHolder = holder;
    const bar = $('#video-bar'), fill = $('#video-bar-fill'), status = $('#video-status');
    bar.hidden = false; fill.style.width = '0';
    $('#video-remove').title = 'Cancel upload';
    try {
      await uploadVideoWithProgress(videoPath, usingVideo, (f) => {
        fill.style.width = Math.round(f * 100) + '%';
        status.textContent = f >= 1 ? 'Finishing up…' : 'Uploading… ' + Math.round(f * 100) + '%';
      }, holder);
    } catch (err) {
      state.uploadingVideo = false; state.videoHolder = null;
      state.sending = false;
      $('#send-btn').disabled = false;
      $('#video-remove').title = 'Remove video';
      bar.hidden = true; fill.style.width = '0';
      status.textContent = formatDuration(usingVideo.duration) + ' · ' + formatSize(usingVideo.size) + ' · ready. Add a caption if you like, then send.';
      if (!err.cancelled) toast(friendlyVideoError(err), 'error');
      return;
    }
    state.uploadingVideo = false; state.videoHolder = null;
    $('#video-remove').title = 'Remove video';
  }

  const row = {
    sender_id: state.user.id,
    recipient_id: recipient,
    content: text,
  };
  if (groupId) row.group_id = groupId;
  if (imagePath) row.image_path = imagePath;
  if (videoPath) row.video_path = videoPath;
  const { data, error } = await db.from('messages').insert(row).select().single();

  state.sending = false;
  $('#send-btn').disabled = false;

  if (error) {
    if (usingVideo) {
      $('#video-bar').hidden = true;
      $('#video-status').textContent = 'Not sent yet. Press send to try again.';
    }
    toast(friendlySendError(error), 'error');
    return;
  }

  state.lastSendAt = Date.now();
  if (typeof textOverride !== 'string') { input.value = ''; autosize(); }
  if (usingImage) {
    // Show our own photo straight away from this device (no need to download it again).
    signedLinks.set(imagePath, { url: usingImage.url, until: Date.now() + 50 * 60 * 1000 });
    if (state.pendingImage === usingImage) clearPendingImage(true);
  }
  if (usingVideo) {
    signedLinks.set('v:' + videoPath, { url: usingVideo.url, until: Date.now() + 50 * 60 * 1000 });
    if (state.pendingVideo === usingVideo) clearPendingVideo(true);
  }
  if (data && data.id != null) state.undoUntil.set(data.id, Date.now() + UNDO_SECONDS * 1000);
  await addMessage(data); // the real-time event for the same message is ignored (already seen)
  attachUndoSlot(data.id);   // (the live update may have shown the message before this point)
}

function autosize() {
  noticeTyping();
  const ta = $('#message-input');
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';

  const left = MAX_LEN - ta.value.length;
  const counter = $('#char-count');
  if (left <= 150) {
    counter.textContent = left + ' characters left';
    counter.className = left <= 30 ? 'warn' : '';
  } else {
    counter.textContent = '';
  }
}

function openProfile(id) {
  const mine = id === state.user.id;
  const p = mine ? state.profile : state.profiles.get(id);
  if (!p) return;

  const card = $('#modal-card');
  card.replaceChildren();
  card.className = 'modal-card ' + (mine ? '' : bgClass(cosOf(id).background));
  const closeBtn = el('button', {
    class: 'icon-btn modal-close', text: '✕',
    attrs: { type: 'button', 'aria-label': 'Close' }, on: { click: closeModal },
  });

  if (!mine) {
    const nick = state.nicknames.get(p.id) || '';
    const isBlocked = state.blocked.has(p.id);
    const realName = (p.display_name && p.display_name.trim()) || p.username;
    const nickInput = el('input', { attrs: { type: 'text', maxlength: '30', autocomplete: 'off', placeholder: realName } });
    nickInput.value = nick;
    const nickErr = el('p', { class: 'form-error', attrs: { role: 'alert' } });
    const saveNick = async (value) => {
      nickErr.textContent = '';
      const err = await setNickname(p.id, value);
      if (err) { nickErr.textContent = err; return; }
      toast(value.trim() ? 'Renamed. Only you can see this name.' : 'Name reset.', 'success');
      openProfile(p.id);
    };
    card.append(
      closeBtn,
      profileAvatar(p),
      el('h3', {}, fxSpan(nameOf(p), cosOf(p.id).name_effect), ...(cosOf(p.id).tag ? [document.createTextNode(' '), tagEl(cosOf(p.id).tag)] : [])),
      ...(nick ? [el('p', { class: 'muted', text: 'Their name: ' + realName })] : []),
      el('p', { class: 'muted', text: '@' + p.username }),
      ...(validCos(cosOf(p.id).theme) ? [el('p', { class: 'muted', text: 'Chat theme: ' + itemName(cosOf(p.id).theme) })] : []),
      isBlocked ? el('p', { class: 'blocked-note', text: '🚫 You blocked this person' })
                : el('p', { class: 'muted', text: state.online.has(p.id) ? '🟢 Online now' : '⚪ Offline' }),
      el('p', { class: 'bio', text: p.bio || 'This person has not written a bio yet.' }),
      el('label', { class: 'rename-label', text: 'Rename (only you can see this)' }),
      el('div', { class: 'inline-form' }, nickInput,
        el('button', { class: 'btn btn-ghost small', text: 'Save', attrs: { type: 'button' }, on: { click: () => saveNick(nickInput.value) } }),
        nick ? el('button', { class: 'btn btn-ghost small', text: 'Reset', attrs: { type: 'button' }, on: { click: () => saveNick('') } }) : null),
      nickErr,
      el('button', {
        class: 'btn btn-primary', text: 'Send a private message', attrs: { type: 'button' },
        on: { click: () => { closeModal(); openChat('dm', p.id); } },
      }),
      isBlocked
        ? el('button', { class: 'btn btn-ghost', text: 'Unblock', attrs: { type: 'button' }, on: { click: async () => {
            const err = await setBlocked(p.id, false);
            if (err) toast(err, 'error'); else openProfile(p.id);
          } } })
        : el('button', { class: 'btn btn-block', text: 'Block', attrs: { type: 'button' }, on: { click: async () => {
            if (!confirm('Block ' + nameOf(p) + '?\n\nThey will not be able to message or call you, and you will not see their messages. You can unblock them any time.')) return;
            const err = await setBlocked(p.id, true);
            if (err) toast(err, 'error'); else openProfile(p.id);
          } } }),
      el('p', { class: 'field-note', text: 'Blocked people cannot message or call you. You will not see their messages anywhere.' }),
    );
  } else {
    let chosen = safeColor(p.avatar_color);
    let newPhoto = null;        // a photo picked now, saved when "Save profile" is pressed
    let removePhoto = false;    // true = the person pressed "Remove photo"
    const hadPhoto = !!p.avatar_path;
    const shownProfile = () => ({
      username: (nameInput.value.trim() || p.username || '?'),
      display_name: displayInput.value.trim() || null,
      avatar_color: chosen,
      avatar_path: removePhoto ? null : p.avatar_path,
      avatar_preview: newPhoto ? newPhoto.url : null,
    });
    const preview = el('span', { id: 'edit-avatar-slot' }, makeAvatar({ username: p.username, display_name: p.display_name, avatar_color: chosen, avatar_path: p.avatar_path }, 'xl'));

    const nameInput = el('input', { attrs: { type: 'text', id: 'edit-username', maxlength: '20', autocomplete: 'off' } });
    nameInput.value = p.username;
    restrictInput(nameInput, NOT_USERNAME_CHAR);

    // Username can only be changed once every 5 days (the database enforces this too).
    const LOCK_MS = 5 * 24 * 60 * 60 * 1000;
    const lockUntil = p.username_changed_at ? new Date(p.username_changed_at).getTime() + LOCK_MS : 0;
    const usernameLocked = lockUntil > Date.now();
    if (usernameLocked) nameInput.disabled = true;
    const usernameNote = el('p', {
      class: 'field-note' + (usernameLocked ? ' lock' : ''),
      text: usernameLocked
        ? '🔒 You can change your username again on ' + new Date(lockUntil).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) + '.'
        : 'This is the name you log in with. You can change it once every 5 days.',
    });

    const displayInput = el('input', { attrs: { type: 'text', id: 'edit-display', maxlength: '30', autocomplete: 'off', placeholder: 'How your name appears in chat (optional)' } });
    displayInput.value = p.display_name || '';
    displayInput.addEventListener('input', () => refreshPreview());
    const bioInput = el('textarea', { attrs: { id: 'edit-bio', rows: '3', maxlength: '160', placeholder: 'Tell people about yourself (160 characters)' } });
    bioInput.value = p.bio || '';
    const errorP = el('p', { class: 'form-error', attrs: { role: 'alert' } });

    const photoInput = el('input', { attrs: { type: 'file', accept: 'image/jpeg,image/png,image/webp,image/gif', hidden: '' } });
    const photoBtn = el('button', { class: 'btn btn-ghost', attrs: { type: 'button' }, on: { click: () => photoInput.click() } });
    const removeBtn = el('button', { class: 'btn btn-ghost', text: 'Remove photo', attrs: { type: 'button' } });
    const refreshPreview = () => {
      preview.replaceChildren(makeAvatar(shownProfile(), 'xl'));
      const hasPhoto = !!newPhoto || (hadPhoto && !removePhoto);
      photoBtn.textContent = hasPhoto ? 'Change photo' : 'Upload photo';
      removeBtn.hidden = !hasPhoto;
    };
    photoInput.addEventListener('change', async () => {
      const file = photoInput.files[0];
      photoInput.value = '';
      if (!file) return;
      errorP.textContent = '';
      try {
        const prepared = await prepareImage(file, { square: true });
        if (newPhoto) URL.revokeObjectURL(newPhoto.url);
        newPhoto = prepared; removePhoto = false;
        refreshPreview();
      } catch (err) { errorP.textContent = err.message || 'That picture could not be used.'; }
    });
    removeBtn.addEventListener('click', () => {
      if (newPhoto) { URL.revokeObjectURL(newPhoto.url); newPhoto = null; }
      removePhoto = hadPhoto;
      refreshPreview();
    });
    nameInput.addEventListener('input', refreshPreview);

    const swatches = el('div', { class: 'swatches' });
    COLORS.forEach((c) => {
      const s = el('button', {
        class: 'swatch' + (c === chosen ? ' selected' : ''),
        style: { background: c }, attrs: { type: 'button', 'aria-label': 'Colour ' + c },
        on: {
          click: () => {
            chosen = c;
            swatches.querySelectorAll('.swatch').forEach((x) => x.classList.remove('selected'));
            s.classList.add('selected');
            refreshPreview();
          },
        },
      });
      swatches.append(s);
    });

    const saveBtn = el('button', { class: 'btn btn-primary', text: 'Save profile', attrs: { type: 'submit' } });
    const form = el('form', { class: 'form', attrs: { novalidate: '' } },
      el('label', { text: 'Profile photo' }),
      el('div', { class: 'photo-actions' }, photoBtn, removeBtn, photoInput),
      el('label', { text: 'Display name', attrs: { for: 'edit-display' } }), displayInput,
      el('p', { class: 'field-note', text: 'Shown in chat instead of your username. Change it any time.' }),
      el('label', { text: 'Username', attrs: { for: 'edit-username' } }), nameInput, usernameNote,
      el('label', { text: 'Bio', attrs: { for: 'edit-bio' } }), bioInput,
      el('label', { text: 'Avatar colour' }), swatches,
      errorP, saveBtn,
    );

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorP.textContent = '';
      const username = nameInput.value.trim();
      const display = displayInput.value.trim();
      const bio = bioInput.value.trim();
      const usernameChanged = !usernameLocked && username !== p.username;

      if (!USERNAME_RE.test(username)) {
        errorP.textContent = 'Username must be 3-20 characters: letters, numbers and _ only.'; return;
      }
      if (display.length > 30) { errorP.textContent = 'Display name can be up to 30 characters.'; return; }

      if (usernameChanged) {
        const sure = window.confirm('Change your username to "' + username + '"?\n\nThis is the name you log in with. ' +
          'You will not be able to change it again for 5 days.');
        if (!sure) return;
      }
      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';

      if (usernameChanged && username.toLowerCase() !== p.username.toLowerCase()) {
        const check = await db.rpc('username_available', { check_name: username });
        if (check.data === false) {
          errorP.textContent = 'That username is taken.';
          saveBtn.disabled = false; saveBtn.textContent = 'Save profile';
          return;
        }
      }

      // Only send what actually changed (this also keeps the 5-day rule from being triggered by accident).
      const changes = { bio, avatar_color: chosen };
      if (usernameChanged) changes.username = username;
      if (display !== (p.display_name || '')) changes.display_name = display || null;
      let uploadedPath = null;
      if (newPhoto) {
        uploadedPath = state.user.id + '/avatar-' + randomFileName();
        const up = await db.storage.from('avatars')
          .upload(uploadedPath, newPhoto.blob, { contentType: 'image/jpeg', cacheControl: '31536000', upsert: false });
        if (up.error) {
          errorP.textContent = /bucket/i.test(up.error.message || '')
            ? 'Photos are not set up yet. Run supabase-photos.sql in Supabase (see README.md).'
            : 'Could not upload the photo. Please try again.';
          saveBtn.disabled = false; saveBtn.textContent = 'Save profile';
          return;
        }
        changes.avatar_path = uploadedPath;
      } else if (removePhoto) {
        changes.avatar_path = null;
      }

      const { data, error } = await db.from('profiles')
        .update(changes)
        .eq('id', state.user.id).select().single();

      saveBtn.disabled = false; saveBtn.textContent = 'Save profile';
      if (error) {
        if (uploadedPath) db.storage.from('avatars').remove([uploadedPath]);   // tidy up the unused upload
        errorP.textContent = error.code === '23505' ? 'That username is taken.'
          : /once every 5 days/i.test(error.message || '') ? error.message
          : /display_name_format/i.test(error.message || '') ? 'Display name must be 1-30 characters with no special control characters.'
          : 'Could not save: ' + withPhotoHint(error.message);
        return;
      }
      // The old photo is no longer used: delete its file (if this fails it does not matter).
      if (p.avatar_path && p.avatar_path !== data.avatar_path) db.storage.from('avatars').remove([p.avatar_path]);

      state.profile = data;
      state.profiles.set(data.id, data);
      renderMe(); renderUsers(); renderHeader(); renderMessages();
      closeModal();
      toast('Profile saved!', 'success');
    });

    refreshPreview();
    card.append(closeBtn, preview, el('h3', { text: 'Your profile' }), form);
  }

  $('#modal').hidden = false;
}

function closeModal() {
  state.openGroupInfo = null;
  $('#modal').hidden = true;
  $('#modal-card').replaceChildren();
  $('#modal-card').className = 'modal-card';
}

// =====================================================================
//  GLOBAL CALL  (group voice call: WebRTC for the audio, Supabase Realtime for signalling)
//  Everyone who joins talks directly to everyone else (peer to peer), so no server
//  handles your voice. Supabase only passes the small "hello, here is how to reach me"
//  notes that let the browsers find each other.
// =====================================================================
const CALL_MAX = 8;   // everyone connects to everyone, so keep the group small
const ICE_SERVERS = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }];
let callChannel = null;          // the Supabase channel used for call notes + "who is in the call"
let call = null;                 // filled in only while I am in the call
let callPeople = new Map();      // everyone in the call right now (id -> info)

function phoneSvg(size) {
  return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>';
}
/** The Global Call icon: a white phone on a purple circle. */
function phoneIcon(size = 20) {
  const icon = el('span', { class: 'phone-icon', attrs: { 'aria-hidden': 'true' } });
  icon.innerHTML = phoneSvg(size);
  return icon;
}

function joinCallChannel() {
  callChannel = db.channel('chatworld-call', { config: { presence: { key: state.user.id } } });
  callChannel
    .on('presence', { event: 'sync' }, onCallPresence)
    .on('broadcast', { event: 'signal' }, ({ payload }) => onSignal(payload))
    .subscribe();
}

function onCallPresence() {
  if (!callChannel || !state.user) return;
  callPeople = new Map(Object.entries(callChannel.presenceState()).map(([id, metas]) => [id, metas[0] || {}]));
  renderUsers();
  if (call) { syncPeers(); renderCallPanel(); }
}

const callMeta = () => ({ username: state.profile.username, muted: !!(call && call.muted) });

function sendSignal(to, kind, data) {
  if (!callChannel) return;
  callChannel.send({ type: 'broadcast', event: 'signal', payload: { from: state.user.id, to, kind, data } });
}

// ----- Opening / leaving -----
function openCallConfirm() {
  const n = callPeople.size;
  const card = $('#modal-card');
  card.replaceChildren(
    phoneIcon(26),
    el('h3', { text: 'Start Global Call?' }),
    el('p', { class: 'muted', text: n
      ? n + (n === 1 ? ' person is' : ' people are') + ' in the call right now. Starting joins you to it.'
      : 'A voice call that anyone on ChatWorld can join. Your browser will ask to use your microphone.' }),
    el('div', { class: 'call-actions' },
      el('button', { class: 'btn btn-ghost', text: 'Cancel', attrs: { type: 'button' }, on: { click: closeModal } }),
      el('button', { class: 'btn btn-call', text: 'Start Call', attrs: { type: 'button' }, on: { click: () => { closeModal(); joinCall(); } } }),
    ),
  );
  card.querySelector('.phone-icon').classList.add('big');
  $('#modal').hidden = false;
}

/** Asks the browser for the microphone. Returns the stream, or null (after telling the person why). */
async function getMic() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.RTCPeerConnection) {
    toast('This browser cannot do voice calls. Try Chrome, Edge, Firefox or Safari.', 'error'); return null;
  }
  try {
    return await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false });
  } catch (e) {
    toast(e && e.name === 'NotAllowedError'
      ? 'Microphone is blocked. Allow the microphone for this site in your browser, then try again.'
      : 'Could not use a microphone. Is one plugged in?', 'error');
    return null;
  }
}

/** Sets up the "I am in a call" state. kind is 'global' or 'private'. */
function makeCall(stream, kind) {
  call = { kind, stream, peers: new Map(), early: new Map(), muted: false, ctx: null, meters: new Map(), speaking: new Set(), timer: null,
           with: null, phase: 'connecting', otherMuted: false, ringTimer: null };
  watchSpeaking(state.user.id, stream);
  call.timer = setInterval(checkSpeaking, 200);
  return call;
}

async function joinCall() {
  if (call || !callChannel) return;
  if (callPeople.size >= CALL_MAX) { toast('The call is full (' + CALL_MAX + ' people). Try again soon.', 'error'); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.RTCPeerConnection) {
    toast('This browser cannot do voice calls. Try Chrome, Edge, Firefox or Safari.', 'error'); return;
  }
  const stream = await getMic();
  if (!stream) return;
  makeCall(stream, 'global');
  try { await callChannel.track(callMeta()); } catch (e) { /* the sync event will still arrive */ }
  renderCallPanel();
  renderUsers();
  toast('You joined the Global Call.');
}

async function leaveCall(quiet, remoteEnded) {
  if (!call) return;
  const c = call;
  call = null;
  clearInterval(c.timer);
  clearTimeout(c.ringTimer);
  if (c.kind === 'private') {
    if (!remoteEnded) sendSignal(c.with, c.phase === 'calling' ? 'cancel' : 'hangup');
  }
  for (const id of [...c.peers.keys()]) closePeer(id, c);
  c.meters.forEach((m) => { try { m.src.disconnect(); } catch (e) { /* ignore */ } });
  c.stream.getTracks().forEach((t) => t.stop());
  if (c.ctx) c.ctx.close().catch(() => {});
  const panel = $('#call-panel'); if (panel) panel.remove();
  if (c.kind === 'global' && callChannel) { try { await callChannel.untrack(); } catch (e) { /* ignore */ } }
  if (state.user) renderUsers();
  if (!quiet) toast(c.kind === 'private' ? 'Call ended.' : 'You left the Global Call.');
}

function toggleMute() {
  if (!call) return;
  call.muted = !call.muted;
  call.stream.getAudioTracks().forEach((t) => { t.enabled = !call.muted; });
  if (call.muted) call.speaking.delete(state.user.id);
  if (call.kind === 'private') sendSignal(call.with, 'mute', { muted: call.muted });
  else if (callChannel) callChannel.track(callMeta()).catch(() => {});
  renderCallPanel();
}

// ----- Connecting to the other people (peer to peer) -----
function syncPeers() {
  if (!call || call.kind === 'private') return;
  for (const id of callPeople.keys()) {
    if (id === state.user.id || call.peers.has(id) || state.blocked.has(id)) continue;
    // To avoid two people calling each other at the same moment, the smaller id always makes the first call.
    if (state.user.id < id) startPeer(id, true);
  }
  for (const id of [...call.peers.keys()]) if (!callPeople.has(id)) closePeer(id);
}

function startPeer(id, initiator) {
  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  const peer = { pc, queue: call.early.get(id) || [], hasRemote: false, audio: null, state: 'connecting' };
  call.early.delete(id);
  call.peers.set(id, peer);
  call.stream.getTracks().forEach((t) => pc.addTrack(t, call.stream));

  pc.onicecandidate = (e) => { if (e.candidate) sendSignal(id, 'ice', e.candidate.toJSON()); };
  pc.ontrack = (e) => {
    if (!peer.audio) { peer.audio = new Audio(); peer.audio.autoplay = true; }
    peer.audio.srcObject = e.streams[0];
    peer.audio.play().catch(() => {});
    watchSpeaking(id, e.streams[0]);
  };
  pc.onconnectionstatechange = () => {
    peer.state = pc.connectionState;
    if (call && call.kind === 'private' && call.peers.get(id) === peer) {
      if (pc.connectionState === 'connected') call.phase = 'connected';
      if (pc.connectionState === 'failed') { endPrivate('The call lost its connection.'); return; }
    }
    if (pc.connectionState === 'failed' && call && call.peers.get(id) === peer) {
      closePeer(id);
      toast('Lost connection to someone in the call. Trying again…', 'error');
      setTimeout(syncPeers, 1500);
    }
    renderCallPanel();
  };

  if (initiator) {
    pc.createOffer()
      .then((o) => pc.setLocalDescription(o))
      .then(() => sendSignal(id, 'offer', pc.localDescription.toJSON()))
      .catch((e) => console.warn('Call offer failed', e));
  }
  return peer;
}

function closePeer(id, c = call) {
  const peer = c && c.peers.get(id);
  if (!peer) return;
  c.peers.delete(id);
  try { peer.pc.onconnectionstatechange = null; peer.pc.close(); } catch (e) { /* ignore */ }
  if (peer.audio) { peer.audio.srcObject = null; peer.audio = null; }
  const m = c.meters.get(id);
  if (m) { try { m.src.disconnect(); } catch (e) { /* ignore */ } c.meters.delete(id); }
  c.speaking.delete(id);
  if (c === call) renderCallPanel();
}

async function flushIce(peer) {
  const waiting = peer.queue.splice(0);
  for (const cand of waiting) { try { await peer.pc.addIceCandidate(cand); } catch (e) { /* ignore */ } }
}

function onSignal(m) {
  if (!m || m.to !== state.user.id || typeof m.from !== 'string' || m.from === state.user.id) return;
  if (!/^[0-9a-f-]{36}$/.test(m.from)) return;
  if (state.blocked.has(m.from)) return;      // I blocked them: ignore their calls completely (they are not told)
  if (m.kind === 'offer' || m.kind === 'answer' || m.kind === 'ice') onCallSignal(m);
  else onPrivateSignal(m);
}

async function onCallSignal(m) {
  if (call && call.kind === 'private' && m.from !== call.with) return;
  if (!call || !m || m.to !== state.user.id || typeof m.from !== 'string' || m.from === state.user.id) return;
  if (!/^[0-9a-f-]{36}$/.test(m.from) || !m.data || typeof m.data !== 'object') return;
  const from = m.from;
  try {
    if (m.kind === 'offer') {
      if (call.peers.has(from)) closePeer(from);
      const peer = startPeer(from, false);
      await peer.pc.setRemoteDescription(m.data);
      peer.hasRemote = true;
      await flushIce(peer);
      const answer = await peer.pc.createAnswer();
      await peer.pc.setLocalDescription(answer);
      sendSignal(from, 'answer', peer.pc.localDescription.toJSON());
    } else if (m.kind === 'answer') {
      const peer = call.peers.get(from);
      if (!peer || peer.hasRemote) return;
      await peer.pc.setRemoteDescription(m.data);
      peer.hasRemote = true;
      await flushIce(peer);
    } else if (m.kind === 'ice') {
      const peer = call.peers.get(from);
      if (!peer) {                                   // arrived before the offer: keep it for later
        const list = call.early.get(from) || [];
        if (list.length < 50) { list.push(m.data); call.early.set(from, list); }
      } else if (peer.hasRemote) {
        await peer.pc.addIceCandidate(m.data).catch(() => {});
      } else {
        peer.queue.push(m.data);
      }
    }
  } catch (e) {
    console.warn('Call signal problem', e);
  }
}

// ----- Who is talking (green ring) -----
function watchSpeaking(id, stream) {
  if (!call) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    call.ctx = call.ctx || new Ctx();
    if (call.ctx.state === 'suspended') call.ctx.resume().catch(() => {});
    if (call.meters.has(id)) { try { call.meters.get(id).src.disconnect(); } catch (e) { /* ignore */ } }
    const src = call.ctx.createMediaStreamSource(stream);
    const an = call.ctx.createAnalyser();
    an.fftSize = 512;
    src.connect(an);
    call.meters.set(id, { src, an, data: new Uint8Array(an.fftSize) });
  } catch (e) { /* the call still works without the green rings */ }
}

function checkSpeaking() {
  if (!call) return;
  let changed = false;
  call.meters.forEach((m, id) => {
    m.an.getByteTimeDomainData(m.data);
    let peak = 0;
    for (let i = 0; i < m.data.length; i++) peak = Math.max(peak, Math.abs(m.data[i] - 128));
    const talking = peak > 14 && !(id === state.user.id && call.muted);
    if (talking !== call.speaking.has(id)) { talking ? call.speaking.add(id) : call.speaking.delete(id); changed = true; }
  });
  if (changed) document.querySelectorAll('#call-panel .call-row').forEach((row) => {
    row.classList.toggle('speaking', call.speaking.has(row.dataset.id));
  });
}

// ----- The call window -----
function renderCallPanel() {
  if (!call) return;
  let panel = $('#call-panel');
  if (!panel) { panel = el('div', { id: 'call-panel', class: 'call-panel', attrs: { role: 'region', 'aria-label': 'Global Call' } }); document.body.append(panel); }

  const isPrivate = call.kind === 'private';
  const ids = isPrivate ? [call.with] : [...callPeople.keys()].filter((id) => id !== state.user.id).sort();
  ids.unshift(state.user.id);
  const rows = ids.map((id) => {
    const meta = callPeople.get(id) || {};
    const isMe = id === state.user.id;
    const p = state.profiles.get(id) || (isMe ? state.profile : { username: meta.username || '?' });
    const peer = call.peers.get(id);
    const status = isMe ? '' : (isPrivate && call.phase === 'calling' ? ' · calling…' : (peer && peer.state === 'connected' ? '' : ' · connecting…'));
    return el('div', { class: 'call-row' + (call.speaking.has(id) ? ' speaking' : ''), attrs: { 'data-id': id } },
      makeAvatar(p, 'sm'),
      el('span', { class: 'call-name', text: nameOf(p) + (isMe ? ' (you)' : '') + status }),
      (isMe ? call.muted : (isPrivate ? call.otherMuted : meta.muted)) ? el('span', { class: 'call-muted', text: '🔇', attrs: { title: 'Muted' } }) : null,
    );
  });

  panel.replaceChildren(
    el('div', { class: 'call-head' }, phoneIcon(16),
      el('strong', { text: isPrivate ? 'Private call' : 'Global Call' }),
      el('span', { class: 'muted', text: isPrivate
        ? (call.phase === 'calling' ? 'Ringing…' : call.phase === 'connected' ? 'Connected' : 'Connecting…')
        : ids.length + (ids.length === 1 ? ' person' : ' people') })),
    el('div', { class: 'call-list' }, rows),
    el('div', { class: 'call-actions' },
      el('button', { class: 'btn btn-ghost', text: call.muted ? 'Unmute' : 'Mute', attrs: { type: 'button' }, on: { click: toggleMute } }),
      el('button', { class: 'btn btn-leave', text: isPrivate ? (call.phase === 'calling' ? 'Cancel' : 'End call') : 'Leave', attrs: { type: 'button' }, on: { click: () => leaveCall() } }),
    ),
  );
}

// =====================================================================
//  PRIVATE CALLS  (a one-to-one voice call from the button at the top right of a private chat)
//  Uses the same WebRTC + Supabase signalling as the Global Call, plus "ringing".
// =====================================================================
const RING_MS = 30000;      // how long the phone rings before giving up
let incoming = null;        // an incoming call that is ringing right now

async function startPrivateCall(id) {
  if (call || incoming) { toast('Finish your current call first.', 'error'); return; }
  if (!callChannel) { toast('Calls are not ready yet. Try again in a moment.', 'error'); return; }
  const p = profileOf(id);
  if (state.blocked.has(id)) { toast('You blocked ' + nameOf(p) + '. Unblock them in their profile to call.', 'error'); return; }
  if (!state.online.has(id)) { toast(nameOf(p) + ' is offline right now, so they cannot get a call.', 'error'); return; }
  const stream = await getMic();
  if (!stream) return;
  if (call || incoming) { stream.getTracks().forEach((t) => t.stop()); return; }
  makeCall(stream, 'private');
  call.with = id;
  call.phase = 'calling';
  call.ringTimer = setTimeout(() => { if (call && call.phase === 'calling') endPrivate(nameOf(p) + ' did not answer.'); }, RING_MS);
  sendSignal(id, 'invite');
  renderCallPanel();
  renderUsers();
}

/** Ends a private call. remoteEnded = the other person already hung up, so there is nothing to tell them. */
function endPrivate(message, remoteEnded) {
  leaveCall(true, remoteEnded);
  if (message) toast(message);
}

function onPrivateSignal(m) {
  const from = m.from;
  const name = nameOf(profileOf(from));
  const mine = call && call.kind === 'private' && call.with === from;
  switch (m.kind) {
    case 'invite':
      if (call || incoming) { sendSignal(from, 'busy'); return; }
      showIncoming(from);
      break;
    case 'cancel':
      if (incoming && incoming.from === from) { dismissIncoming(); toast('Missed call from ' + name + '.'); }
      break;
    case 'accept':
      if (mine && call.phase === 'calling') {
        clearTimeout(call.ringTimer);
        call.phase = 'connecting';
        startPeer(from, true);
        renderCallPanel();
      }
      break;
    case 'decline': if (mine && call.phase === 'calling') endPrivate(name + ' declined the call.', true); break;
    case 'busy':    if (mine && call.phase === 'calling') endPrivate(name + ' is on another call.', true); break;
    case 'hangup':  if (mine) endPrivate(name + ' ended the call.', true); break;
    case 'mute':    if (mine) { call.otherMuted = !!(m.data && m.data.muted); renderCallPanel(); } break;
  }
}

function startRing() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const beep = () => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 523; g.gain.value = 0.05;
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.25);
    };
    beep();
    return { ctx, timer: setInterval(beep, 1800) };
  } catch (e) { return null; }
}

function showIncoming(from) {
  const p = profileOf(from);
  const box = el('div', { id: 'incoming-call', class: 'incoming-call', attrs: { role: 'alertdialog', 'aria-label': 'Incoming call' } },
    makeAvatar(p, 'sm'),
    el('div', { class: 'inc-text' }, el('strong', { text: nameOf(p) }), el('span', { text: 'is calling you…' })),
    el('button', { class: 'btn btn-leave', text: 'Decline', attrs: { type: 'button' }, on: { click: declineIncoming } }),
    el('button', { class: 'btn btn-accept', text: 'Accept', attrs: { type: 'button' }, on: { click: acceptIncoming } }),
  );
  document.body.append(box);
  incoming = { from, ring: startRing(), timer: setTimeout(dismissIncoming, RING_MS + 5000) };
}

function dismissIncoming() {
  if (!incoming) return;
  clearTimeout(incoming.timer);
  if (incoming.ring) { clearInterval(incoming.ring.timer); incoming.ring.ctx.close().catch(() => {}); }
  incoming = null;
  const box = $('#incoming-call'); if (box) box.remove();
}

function declineIncoming() {
  if (!incoming) return;
  sendSignal(incoming.from, 'decline');
  dismissIncoming();
}

async function acceptIncoming() {
  if (!incoming) return;
  const from = incoming.from;
  dismissIncoming();
  if (call) { sendSignal(from, 'busy'); return; }
  const stream = await getMic();
  if (!stream) { sendSignal(from, 'decline'); return; }
  makeCall(stream, 'private');
  call.with = from;
  call.phase = 'connecting';
  sendSignal(from, 'accept');
  renderCallPanel();
  renderUsers();
}

// =====================================================================
//  MOBILE SIDEBAR
// =====================================================================
function openSidebar() { $('#app').classList.add('sidebar-open'); }
function closeSidebar() { $('#app').classList.remove('sidebar-open'); }

// =====================================================================
//  WIRING EVERYTHING UP
// =====================================================================
function bindUI() {
  $('#orb-pill').addEventListener('click', () => openShop());
  // Call button (top right of a private chat)
  $('#call-btn').innerHTML = phoneSvg(20);
  $('#call-btn').addEventListener('click', () => { if (state.chat.type === 'dm') startPrivateCall(state.chat.id); });
  window.addEventListener('pagehide', () => {
    stopTyping();
    orbBeat(false);
    if (call && call.kind === 'private') sendSignal(call.with, call.phase === 'calling' ? 'cancel' : 'hangup');
  });
  // Photos in chat
  $('#attach-btn').addEventListener('click', () => $('#image-input').click());
  $('#image-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    choosePhotoForChat(file);
  });
  $('#attach-remove').addEventListener('click', () => clearPendingImage());
  // Videos in chat
  $('#video-btn').addEventListener('click', () => $('#video-input').click());
  $('#video-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    chooseVideoForChat(file);
  });
  $('#video-remove').addEventListener('click', () => {
    if (state.uploadingVideo && state.videoHolder && state.videoHolder.xhr) { state.videoHolder.xhr.abort(); return; }
    clearPendingVideo();
  });
  $('#messages').addEventListener('scroll', (e) => {
    const box = e.currentTarget;
    state.stick = box.scrollHeight - box.scrollTop - box.clientHeight < 160;
  }, { passive: true });
  $('#emoji-btn').addEventListener('click', (e) => { e.stopPropagation(); toggleEmojiPanel(); });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#emoji-panel') && !e.target.closest('#emoji-btn')) closeEmojiPanel();
  });

  // Typing rules: usernames = letters, numbers and _ only. No spaces in emails or passwords.
  restrictInput($('#signup-username'), NOT_USERNAME_CHAR);
  restrictInput($('#login-username'), NOT_USERNAME_CHAR);
  restrictInput($('#signup-password'), ANY_SPACE);
  restrictInput($('#login-password'), ANY_SPACE);

  document.querySelectorAll('.pw-toggle').forEach((btn) => {
    btn.addEventListener('click', () => {
      const input = btn.parentElement.querySelector('input');
      setPwVisible(btn, input.type === 'password');
      input.focus();
    });
  });

  $('#tab-login').addEventListener('click', () => switchTab('login'));
  $('#tab-signup').addEventListener('click', () => switchTab('signup'));

  if (db) {
    $('#login-form').addEventListener('submit', handleLogin);
    $('#signup-form').addEventListener('submit', handleSignup);
  } else {
    $('#login-form').addEventListener('submit', (e) => e.preventDefault());
    $('#signup-form').addEventListener('submit', (e) => e.preventDefault());
  }

  $('#logout-btn').addEventListener('click', logout);
  $('#me-btn').addEventListener('click', () => { if (state.user) openProfile(state.user.id); });
  $('#menu-btn').addEventListener('click', openSidebar);
  $('#sidebar-close').addEventListener('click', closeSidebar);
  $('#overlay').addEventListener('click', closeSidebar);

  $('#user-search').addEventListener('input', (e) => {
    state.search = e.target.value;
    if (state.user) renderUsers();
  });

  // Composer
  const input = $('#message-input');
  $('#composer').addEventListener('submit', (e) => { e.preventDefault(); sendMessage(); });
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', (e) => {
    const isTouch = window.matchMedia('(pointer: coarse)').matches;
    // Enter sends on computers (Shift+Enter = new line). On phones Enter = new line.
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !isTouch) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Modal
  $('#modal').addEventListener('mousedown', (e) => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeModal(); closeSidebar(); closeEmojiPanel();
      document.querySelectorAll('.lightbox').forEach((x) => x.remove());
    }
  });

  // Catch up on messages after the tab was hidden for a while
  document.addEventListener('visibilitychange', () => {
    if (state.user) orbBeat(!document.hidden);   // Orbs only count while the tab is visible
    if (document.hidden) { state.hiddenAt = Date.now(); return; }
    state.awayCount = 0;
    updateTitle();
    if (state.user && state.profile && state.hiddenAt && Date.now() - state.hiddenAt > 30000) {
      loadMessages();
    }
  });
}

async function init() {
  bindUI();

  if (!db) {
    showAuth();
    showConfigProblem();
    return;
  }

  // Fallback: if the first auth event is slow or missing, check the session directly.
  setTimeout(async () => {
    if (!$('#splash').hidden) {
      const { data } = await db.auth.getSession();
      if (data && data.session) startApp(data.session.user);
      else showAuth();
    }
  }, 2500);

  // Runs whenever someone logs in or out (also when the page first opens).
  db.auth.onAuthStateChange((event, session) => {
    // setTimeout avoids a known Supabase deadlock when calling the database from inside this callback.
    setTimeout(() => {
      if (session && session.user) {
        startApp(session.user);
      } else if (event === 'SIGNED_OUT' || event === 'INITIAL_SESSION') {
        stopApp();
        showAuth();
      }
    }, 0);
  });
}

init();

</script>

<!-- Safety net: if the app has not started after 4 seconds, explain why -->
<script>
  setTimeout(function () {
    var s = document.getElementById('splash');
    if (s && !s.hidden && !s.querySelector('.startup-problem')) {
      s.innerHTML = '<div style="text-align:center;padding:24px;max-width:430px;line-height:1.55">' +
        '<p style="font-size:18px;font-weight:700;margin:10px 0">ChatWorld could not start</p>' +
        '<p style="color:#9aa1ad;font-size:15px">Most likely the two Supabase lines near the top of the code in <b>index.html</b> were edited incorrectly ' +
        '(the quote marks and the ; must stay). ' +
        'Press <b>F12</b>, open the <b>Console</b> tab and look for the red error message.</p></div>';
    }
  }, 4000);
</script>
