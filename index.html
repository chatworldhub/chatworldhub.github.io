/* =====================================================================
   ChatWorld - style.css
   Dark, modern look inspired by Discord and ChatGPT.
   Tip: change the colours in the ":root" block below to re-theme the site.
   ===================================================================== */

:root {
  --bg-0: #121317;
  --bg-1: #17181c;
  --bg-2: #1e1f25;
  --bg-3: #272932;
  --bg-4: #323543;
  --line: rgba(255, 255, 255, 0.07);

  --text: #e8eaee;
  --muted: #9aa1ad;

  --accent: #5865f2;
  --accent-2: #8b5cf6;
  --accent-grad: linear-gradient(135deg, #5865f2 0%, #8b5cf6 100%);

  --green: #23a55a;
  --red: #f23f43;
  --amber: #f0b232;

  --radius: 14px;
  --sidebar-w: 300px;

  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
    "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  color-scheme: dark;
}

*,
*::before,
*::after { box-sizing: border-box; }

[hidden] { display: none !important; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg-1);
  color: var(--text);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }

::selection { background: rgba(88, 101, 242, 0.45); }

/* nice thin scroll bars */
* { scrollbar-width: thin; scrollbar-color: var(--bg-4) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 8px; }

/* ---------- Splash ---------- */
.splash {
  position: fixed; inset: 0; z-index: 50;
  display: grid; place-items: center;
  background: var(--bg-1);
  font-size: 56px;
}
.spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--bg-4); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.12); opacity: 1; } }

/* ---------- Buttons & inputs ---------- */
.btn {
  border: 0; border-radius: 10px;
  padding: 11px 16px; font-weight: 600;
  transition: transform .06s ease, filter .15s ease, background .15s ease;
}
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .6; cursor: not-allowed; }
.btn-primary { background: var(--accent-grad); color: #fff; }
.btn-primary:hover:not(:disabled) { filter: brightness(1.1); }
.btn-ghost { background: var(--bg-3); }
.btn-ghost:hover:not(:disabled) { background: var(--bg-4); }

.icon-btn {
  display: inline-grid; place-items: center;
  width: 38px; height: 38px; flex: none;
  border: 0; border-radius: 10px;
  background: transparent; color: var(--muted);
  transition: background .15s, color .15s;
}
.icon-btn:hover { background: var(--bg-3); color: var(--text); }

input[type="text"], input[type="email"], input[type="password"], input[type="search"], textarea {
  width: 100%;
  background: var(--bg-0);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 13px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.25);
}
::placeholder { color: #6b7280; }

/* ---------- Show / hide password (eye button) ---------- */
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 48px; }
.pw-toggle {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 36px; height: 36px; display: grid; place-items: center;
  border: 0; border-radius: 8px; background: transparent; color: var(--muted);
}
.pw-toggle:hover { color: var(--text); background: var(--bg-3); }

.logo-img { display: block; background: var(--logo) center / contain no-repeat; aspect-ratio: 1394 / 1239; flex: none; }
.logo-lg { width: min(230px, 62%); margin: 0 auto 6px; }
.logo-sm { height: 54px; }
.auth-card .brand { justify-content: center; }
.auth-tagline { text-align: center; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Brand ---------- */
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font-size: 26px; letter-spacing: -0.02em; }
.brand-logo { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-grad); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 22px; flex: none; }
.brand-sm h1 { font-size: 18px; }
.brand-sm .brand-logo { width: 30px; height: 30px; border-radius: 9px; font-size: 16px; }

/* ---------- Login / sign-up ---------- */
.auth-screen {
  min-height: 100dvh;
  display: grid; place-items: center;
  padding: 20px;
  background:
    radial-gradient(900px 500px at 15% 10%, rgba(88, 101, 242, 0.28), transparent 60%),
    radial-gradient(800px 500px at 90% 90%, rgba(139, 92, 246, 0.22), transparent 60%),
    var(--bg-0);
}
.auth-card {
  width: 100%; max-width: 420px;
  background: rgba(30, 31, 37, 0.85);
  backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 30px 26px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
}
.auth-tagline { color: var(--muted); margin: 8px 0 20px; }

.tabs {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
  background: var(--bg-0); padding: 4px; border-radius: 12px; margin-bottom: 18px;
}
.tab {
  border: 0; background: transparent; color: var(--muted);
  padding: 9px; border-radius: 9px; font-weight: 600;
}
.tab.active { background: var(--bg-3); color: var(--text); }

.form { display: flex; flex-direction: column; gap: 8px; }
.form label { font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 6px; }
.form .btn { margin-top: 14px; }
.form-error { color: #ff7b7e; font-size: 13px; min-height: 0; }
.form-error:empty { display: none; }
.form-error:not(:empty) { margin-top: 6px; }

.notice { border-radius: 10px; padding: 11px 13px; font-size: 14px; margin-bottom: 14px; }
.notice-warn { background: rgba(240, 178, 50, 0.12); border: 1px solid rgba(240, 178, 50, 0.4); color: #ffd98a; }
.notice-ok { background: rgba(35, 165, 90, 0.12); border: 1px solid rgba(35, 165, 90, 0.4); color: #7ee2a8; margin: 8px 0 0; }

/* spam-bot trap: kept off-screen, not display:none (bots notice that) */
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

/* ---------- App layout ---------- */
.app { display: flex; height: 100dvh; width: 100%; overflow: hidden; }

.sidebar {
  width: var(--sidebar-w); flex: none;
  display: flex; flex-direction: column;
  background: var(--bg-2);
  border-right: 1px solid var(--line);
  min-height: 0;
}
.sidebar-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 16px 10px;
}
.search-wrap { padding: 4px 14px 10px; }
.search-wrap input { background: var(--bg-0); padding: 9px 12px; }

.user-list { flex: 1; overflow-y: auto; padding: 4px 8px 10px; min-height: 0; }

.section-label {
  font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); padding: 14px 10px 6px;
}
.empty-note { color: var(--muted); font-size: 13px; padding: 8px 10px; }

.chat-item {
  display: flex; align-items: center; gap: 11px;
  width: 100%; padding: 8px 10px; margin: 1px 0;
  border: 0; border-radius: 10px; background: transparent; text-align: left;
  color: var(--muted);
  transition: background .12s, color .12s;
}
.chat-item:hover { background: var(--bg-3); color: var(--text); }
.chat-item.active { background: var(--bg-4); color: #fff; }
.chat-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.chat-item.offline .avatar { opacity: .55; }

.hash-icon {
  width: 36px; height: 36px; flex: none; border-radius: 50%;
  display: grid; place-items: center; font-size: 18px; font-weight: 700;
  background: var(--accent-grad); color: #fff;
}

.badge {
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
  background: var(--red); color: #fff; font-size: 12px; font-weight: 700;
  display: grid; place-items: center;
}

/* Avatars */
.avatar-wrap { position: relative; flex: none; display: inline-block; }
.avatar {
  width: 36px; height: 36px; flex: none; border-radius: 50%;
  display: inline-grid; place-items: center;
  font-weight: 700; color: #fff; user-select: none;
}
.avatar.sm { width: 34px; height: 34px; font-size: 14px; }
.avatar.xl { width: 84px; height: 84px; font-size: 36px; }
.status-dot {
  position: absolute; right: -1px; bottom: -1px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--green); border: 3px solid var(--bg-2);
  box-sizing: content-box; width: 9px; height: 9px;
}
.chat-item:hover .status-dot { border-color: var(--bg-3); }
.chat-item.active .status-dot { border-color: var(--bg-4); }

/* "Me" box at the bottom of the sidebar */
.me {
  display: flex; align-items: center; gap: 6px;
  padding: 10px; border-top: 1px solid var(--line);
  background: var(--bg-1);
  padding-bottom: max(10px, env(safe-area-inset-bottom));
}
.me-info {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;
  border: 0; background: transparent; text-align: left; padding: 6px; border-radius: 10px;
}
.me-info:hover { background: var(--bg-3); }
.me-text { display: flex; flex-direction: column; min-width: 0; }
.me-text strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-text small { color: var(--muted); }

/* ---------- Main chat area ---------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-1); }

.chat-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; min-height: 62px;
  border-bottom: 1px solid var(--line);
  background: rgba(23, 24, 28, 0.9); backdrop-filter: blur(8px);
}
.chat-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
.chat-title.clickable { cursor: pointer; }
.title-text { min-width: 0; }
.title-text h2 { font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.title-text p { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.pill {
  display: inline-flex; align-items: center; gap: 7px; flex: none;
  padding: 6px 12px; border-radius: 999px;
  background: var(--bg-3); font-size: 13px; color: var(--muted);
}
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }

/* Messages */
.messages {
  flex: 1; overflow-y: auto; min-height: 0;
  padding: 18px max(14px, calc((100% - 920px) / 2)) 10px;
  overscroll-behavior: contain;
}
.load-more {
  display: block; margin: 0 auto 14px;
  border: 1px solid var(--line); background: var(--bg-2); color: var(--muted);
  padding: 7px 14px; border-radius: 999px; font-size: 13px;
}
.load-more:hover { color: var(--text); background: var(--bg-3); }

.day-divider {
  display: flex; align-items: center; gap: 12px;
  color: var(--muted); font-size: 12px; font-weight: 600; margin: 18px 0 8px;
}
.day-divider::before, .day-divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.msg {
  display: flex; gap: 12px;
  padding: 4px 10px; margin: 0 -10px; border-radius: 10px;
  animation: pop .18s ease-out;
}
.msg:hover { background: rgba(255, 255, 255, 0.03); }
.msg:not(.grouped) { margin-top: 12px; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.msg-avatar { flex: none; width: 38px; border: 0; background: none; padding: 0; height: 38px; }
.msg-avatar .avatar { width: 38px; height: 38px; }
.msg-gutter { flex: none; width: 38px; font-size: 10px; color: transparent; text-align: center; padding-top: 5px; }
.msg:hover .msg-gutter { color: var(--muted); }

.msg-body { min-width: 0; flex: 1; }
.msg-head { display: flex; align-items: baseline; gap: 8px; }
.msg-author { border: 0; background: none; padding: 0; font-weight: 700; }
.msg-author:hover { text-decoration: underline; }
.msg.mine .msg-author { color: #aab2ff; }
.msg-time { color: var(--muted); font-size: 12px; }
/* =====================================================================
   SHOP + COSMETICS  (everything below only applies to people who equip items)
   ===================================================================== */

/* ---- Orb balance (top bar) ---- */
.orb-pill { border: 0; cursor: pointer; position: relative; color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; transition: background .15s, transform .15s; }
.orb-pill[hidden] { display: none; }
.orb-pill:hover { background: var(--bg-4); }
.orb {
  width: 14px; height: 14px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 32% 28%, #fff7c2 0%, #fbbf24 38%, #d97706 100%);
  box-shadow: 0 0 8px rgba(251, 191, 36, .55);
}
.orb-pill.orb-gain { animation: orb-pop .6s ease-out; }
.orb-pill.orb-gain .orb { animation: orb-glow .6s ease-out; }
.orb-pill.orb-spend { animation: orb-shake .45s ease-out; }
@keyframes orb-pop { 0% { transform: scale(1); } 30% { transform: scale(1.18); background: rgba(251,191,36,.25); } 100% { transform: scale(1); } }
@keyframes orb-glow { 0% { box-shadow: 0 0 8px rgba(251,191,36,.55); } 35% { box-shadow: 0 0 18px 5px rgba(251,191,36,.9); } 100% { box-shadow: 0 0 8px rgba(251,191,36,.55); } }
@keyframes orb-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.orb-float {
  position: absolute; right: 8px; top: 100%; font-size: 13px; font-weight: 800; pointer-events: none; z-index: 5;
  animation: orb-float 1.1s ease-out forwards;
}
.orb-float.up { color: #fbbf24; }
.orb-float.down { color: #f87171; }
@keyframes orb-float { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-22px); } }

/* ---- Shop page ---- */
.shop-page { overflow-y: auto; padding: 18px max(14px, calc((100% - 980px) / 2)) 28px; }
.shop-top { display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch; margin-bottom: 14px; }
.shop-balance { flex: 1 1 220px; display: flex; flex-direction: column; justify-content: center; gap: 4px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
.shop-balance .big { display: flex; align-items: center; gap: 10px; font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
.shop-balance .big .orb { width: 24px; height: 24px; }
.shop-balance small { color: var(--muted); font-size: 13px; }
.shop-preview {
  flex: 2 1 360px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  display: flex; flex-direction: column; min-width: 0;
}
.sp-title { display: flex; align-items: center; gap: 8px; padding: 9px 14px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--line); }
.sp-title button { margin-left: auto; border: 0; background: var(--bg-3); color: var(--text); border-radius: 999px; padding: 3px 10px; font-size: 12px; text-transform: none; letter-spacing: 0; }
.sp-stage { background: var(--bg-1); color: var(--text); display: flex; flex-direction: column; }
.sp-card { display: flex; align-items: center; gap: 16px; padding: 22px 20px 16px; background: var(--bg-2); }
.sp-name { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; flex-wrap: wrap; }
.sp-card small { color: var(--muted); display: block; margin-top: 2px; }
.sp-chat { padding: 14px 20px 18px; display: flex; gap: 12px; align-items: flex-start; }
.sp-chat .msg-head { align-items: center; }
.shop-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: none; }
.shop-tabs::-webkit-scrollbar { display: none; }
.shop-tab { flex: none; border: 1px solid var(--line); background: var(--bg-2); color: var(--muted); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; }
.shop-tab:hover { color: var(--text); background: var(--bg-3); }
.shop-tab.active { color: #fff; background: var(--accent-grad); border-color: transparent; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.shop-card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.shop-card.equipped { border-color: #22c55e; box-shadow: 0 0 0 1px rgba(34, 197, 94, .35); }
.shop-card.previewing { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.shop-swatch { height: 84px; border-radius: 12px; background: var(--bg-1); display: grid; place-items: center; overflow: hidden; position: relative; padding: 6px; text-align: center; }
.shop-swatch .avatar { width: 52px; height: 52px; font-size: 22px; }
.shop-swatch.is-bg { padding: 0; }
.shop-swatch.is-theme { padding: 0; align-items: stretch; }
.theme-mini { width: 100%; height: 100%; background: var(--bg-1); color: var(--text); padding: 10px; display: flex; flex-direction: column; gap: 6px; justify-content: center; border-radius: 12px; }
.theme-mini i { display: block; height: 10px; border-radius: 6px; background: var(--bg-3); }
.theme-mini i:nth-child(1) { width: 70%; } .theme-mini i:nth-child(2) { width: 48%; align-self: flex-end; background: var(--accent-grad); }
.shop-name { font-weight: 700; font-size: 15px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.shop-price { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 13px; color: #fbbf24; font-variant-numeric: tabular-nums; }
.shop-price .orb { width: 11px; height: 11px; box-shadow: none; }
.shop-owned { font-size: 12px; font-weight: 700; color: #4ade80; }
.shop-actions { display: flex; gap: 8px; }
.shop-actions button { flex: 1; border: 0; border-radius: 10px; padding: 8px 6px; font-size: 13px; font-weight: 700; background: var(--bg-3); color: var(--text); }
.shop-actions button:hover:not(:disabled) { background: var(--bg-4); }
.shop-actions .buy { background: var(--accent-grad); color: #fff; }
.shop-actions .buy:hover:not(:disabled) { filter: brightness(1.1); background: var(--accent-grad); }
.shop-actions .buy.poor { opacity: .5; }
.shop-actions .equip { background: #16a34a; color: #fff; }
.shop-actions .equip:hover { background: #15803d; }
.shop-actions .unequip { background: var(--bg-4); }
.shop-note { color: var(--muted); font-size: 14px; padding: 30px 10px; text-align: center; }

/* ---- Username tags: small, rectangular, slightly raised ---- */
.utag {
  display: inline-block; flex: none; font-size: 10px; font-weight: 800; letter-spacing: .07em; line-height: 1;
  padding: 3px 6px 3px; border-radius: 4px; border: 1px solid; vertical-align: middle; text-transform: uppercase;
  -webkit-text-fill-color: currentColor; font-family: inherit;
  box-shadow: 0 1px 0 rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .22);
  transform: translateY(-1px); user-select: none;
}
.i-tag-vip    { color: #fbbf24; background: #3a2a06; border-color: #b7791f; }
.i-tag-pro    { color: #93c5fd; background: #10264a; border-color: #3b82f6; }
.i-tag-og     { color: #86efac; background: #0d2f1b; border-color: #22a24f; }
.i-tag-king   { color: #fde047; background: #3d3204; border-color: #ca9a04; }
.i-tag-angel  { color: #e0f2fe; background: #1b3550; border-color: #7dd3fc; }
.i-tag-diva   { color: #f9a8d4; background: #4a1230; border-color: #ec4899; }
.i-tag-queen  { color: #e9d5ff; background: #3a1559; border-color: #a855f7; }
.i-tag-cutie  { color: #fbcfe8; background: #4d1f3a; border-color: #f472b6; }
.i-tag-royal  { color: #c7d2fe; background: #1e1b5c; border-color: #6366f1; }
.i-tag-star   { color: #fef08a; background: #3a3306; border-color: #eab308; }

/* ---- Animated avatar frames (a ring drawn inside the picture's edge) ---- */
.avatar[class*="i-frame-"]::after {
  content: ''; position: absolute; inset: 0; border-radius: 50%; padding: 3px; pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
.avatar.sm[class*="i-frame-"]::after { padding: 2.5px; }
.avatar.xl[class*="i-frame-"]::after { padding: 5px; }
.i-frame-neon::after    { background: conic-gradient(from 0deg, #22c55e, #06b6d4, #a3e635, #22c55e); animation: ring-spin 3s linear infinite; filter: drop-shadow(0 0 3px #22c55e); }
.i-frame-ice::after     { background: conic-gradient(from 0deg, #e0f2fe, #38bdf8, #ffffff, #7dd3fc, #e0f2fe); animation: ring-spin 4s linear infinite; }
.i-frame-fire::after    { background: conic-gradient(from 0deg, #ef4444, #f97316, #facc15, #f97316, #ef4444); animation: ring-spin 1.6s linear infinite, ring-flicker .5s ease-in-out infinite alternate; }
.i-frame-rainbow::after { background: conic-gradient(from 0deg, #ff4d6d, #ffb703, #80ed99, #4cc9f0, #b5179e, #ff4d6d); animation: ring-spin 2.2s linear infinite; }
.i-frame-gold::after    { background: conic-gradient(from 0deg, #b7791f, #fde68a, #f59e0b, #fff7d6, #b7791f); animation: ring-spin 3.5s linear infinite; }
@keyframes ring-spin { to { transform: rotate(360deg); } }
@keyframes ring-flicker { from { opacity: .8; } to { opacity: 1; } }

/* ---- Name effects ---- */
.fx { -webkit-background-clip: text; background-clip: text; }
.fx.i-fx-glow    { color: #bae6fd !important; text-shadow: 0 0 6px #38bdf8, 0 0 14px rgba(56, 189, 248, .7); animation: fx-pulse 2.2s ease-in-out infinite; }
.fx.i-fx-frost   { background-image: linear-gradient(90deg, #7dd3fc, #ffffff, #a5f3fc, #7dd3fc); background-size: 250% 100%; -webkit-text-fill-color: transparent; animation: fx-slide 3s linear infinite; }
.fx.i-fx-fire    { background-image: linear-gradient(90deg, #ef4444, #f97316, #facc15, #f97316, #ef4444); background-size: 250% 100%; -webkit-text-fill-color: transparent; animation: fx-slide 1.8s linear infinite; }
.fx.i-fx-gold    { background-image: linear-gradient(90deg, #b7791f, #fde68a, #f59e0b, #fff7d6, #b7791f); background-size: 250% 100%; -webkit-text-fill-color: transparent; animation: fx-slide 3s linear infinite; }
.fx.i-fx-rainbow { background-image: linear-gradient(90deg, #ff4d6d, #ffb703, #80ed99, #4cc9f0, #b5179e, #ff4d6d); background-size: 250% 100%; -webkit-text-fill-color: transparent; animation: fx-slide 3s linear infinite; }
@keyframes fx-slide { to { background-position: -250% 0; } }
@keyframes fx-pulse { 50% { text-shadow: 0 0 3px #38bdf8, 0 0 8px rgba(56, 189, 248, .5); } }

/* ---- Message styles (shown to everyone) ---- */
.msg-body[class*="i-style-"] > .msg-text { display: block; width: fit-content; max-width: 100%; padding: 6px 12px; border-radius: 14px; margin-top: 3px; }
.msg-body.i-style-glass > .msg-text  { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); backdrop-filter: blur(6px); }
.msg-body.i-style-candy > .msg-text  { background: linear-gradient(135deg, #ff9ec7, #ffc27a); color: #3b1030; font-weight: 600; }
.msg-body.i-style-neon > .msg-text   { background: rgba(6, 182, 212, .08); border: 1px solid #22d3ee; color: #cffafe; box-shadow: 0 0 10px rgba(34, 211, 238, .45), inset 0 0 8px rgba(34, 211, 238, .15); }
.msg-body.i-style-retro > .msg-text  { background: #04130a; border: 1px solid #166534; color: #4ade80; font-family: ui-monospace, Menlo, Consolas, monospace; border-radius: 6px; text-shadow: 0 0 6px rgba(74, 222, 128, .6); }

/* ---- Profile backgrounds (the profile window of that person) ---- */
.modal-card[class*="i-bg-"] { background-size: 300% 300%; animation: pop .18s ease-out, bg-shift 12s ease-in-out infinite; color: #fff; }
.modal-card[class*="i-bg-"] .muted, .modal-card[class*="i-bg-"] .field-note, .modal-card[class*="i-bg-"] .rename-label { color: rgba(255,255,255,.75); }
.modal-card.i-bg-aurora { background-image: linear-gradient(135deg, #0b3d3a, #1d2b64 35%, #5b2a86 65%, #0f766e); }
.modal-card.i-bg-sunset { background-image: linear-gradient(135deg, #3b1c4a, #8a2f5a 40%, #c2503a 75%, #5a2a4d); }

@keyframes bg-shift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
.sp-card[class*="i-bg-"] { background-size: 300% 300%; animation: bg-shift 12s ease-in-out infinite; color: #fff; }
.sp-card.i-bg-aurora { background-image: linear-gradient(135deg, #0b3d3a, #1d2b64 35%, #5b2a86 65%, #0f766e); }
.sp-card.i-bg-sunset { background-image: linear-gradient(135deg, #3b1c4a, #8a2f5a 40%, #c2503a 75%, #5a2a4d); }
.sp-card.i-bg-ocean  { background-image: linear-gradient(135deg, #021b3a, #0a4a7a 45%, #06647e 70%, #03254a); }
.sp-card.i-bg-sakura { background-image: linear-gradient(135deg, #3d1534, #8a3b6a 45%, #b5527f 70%, #4a1a3d); }
.sp-card.i-bg-matrix { background-color: #020a04; background-image: repeating-linear-gradient(0deg, rgba(34,197,94,.10) 0 2px, transparent 2px 6px), linear-gradient(135deg, #020a04, #063d1a 50%, #020a04); }
.shop-swatch.is-bg > div { width: 100%; height: 100%; }
.shop-swatch.is-bg .i-bg-aurora { background: linear-gradient(135deg, #0b3d3a, #1d2b64 35%, #5b2a86 65%, #0f766e); background-size: 300% 300%; animation: bg-shift 8s ease-in-out infinite; }
.shop-swatch.is-bg .i-bg-sunset { background: linear-gradient(135deg, #3b1c4a, #8a2f5a 40%, #c2503a 75%, #5a2a4d); background-size: 300% 300%; animation: bg-shift 8s ease-in-out infinite; }
.shop-swatch.is-bg .i-bg-ocean  { background: linear-gradient(135deg, #021b3a, #0a4a7a 45%, #06647e 70%, #03254a); background-size: 300% 300%; animation: bg-shift 8s ease-in-out infinite; }
.shop-swatch.is-bg .i-bg-sakura { background: linear-gradient(135deg, #3d1534, #8a3b6a 45%, #b5527f 70%, #4a1a3d); background-size: 300% 300%; animation: bg-shift 8s ease-in-out infinite; }
.shop-swatch.is-bg .i-bg-matrix { background: repeating-linear-gradient(0deg, rgba(34,197,94,.14) 0 2px, transparent 2px 6px), linear-gradient(135deg, #020a04, #063d1a 50%, #020a04); }

/* ---- Profile decorations (around the big picture in a profile window) ---- */
.deco-wrap { position: relative; display: inline-block; flex: none; }
.deco { position: absolute; inset: 0; pointer-events: none; }
.deco span { position: absolute; line-height: 1; }
.deco-crown span { left: 50%; top: -24px; font-size: 30px; transform: translateX(-50%) rotate(-8deg); animation: deco-bob 2.4s ease-in-out infinite; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
.deco-halo span { left: 18%; right: 18%; top: -14px; height: 14px; border: 4px solid #fde68a; border-radius: 50%; box-shadow: 0 0 12px #fde68a, inset 0 0 6px #fde68a; animation: deco-bob 2.8s ease-in-out infinite; }
.deco-sparkles span { font-size: 16px; animation: deco-twinkle 1.8s ease-in-out infinite; }
.deco-sparkles span:nth-child(1) { left: -10px; top: 4px; } .deco-sparkles span:nth-child(2) { right: -8px; top: 14px; animation-delay: .5s; }
.deco-sparkles span:nth-child(3) { left: 2px; bottom: -6px; animation-delay: 1s; } .deco-sparkles span:nth-child(4) { right: 4px; bottom: -4px; animation-delay: 1.4s; font-size: 12px; }
.deco-hearts span { font-size: 15px; opacity: 0; animation: deco-rise 3s ease-in infinite; bottom: 10%; }
.deco-hearts span:nth-child(1) { left: -8px; } .deco-hearts span:nth-child(2) { left: 45%; animation-delay: -1s; } .deco-hearts span:nth-child(3) { right: -8px; animation-delay: -2s; }
.deco-stars { animation: ring-spin 7s linear infinite; inset: -8px; }
.deco-stars span { font-size: 15px; }
.deco-stars span:nth-child(1) { left: 50%; top: -4px; } .deco-stars span:nth-child(2) { right: -4px; top: 50%; }
.deco-stars span:nth-child(3) { left: 50%; bottom: -4px; } .deco-stars span:nth-child(4) { left: -4px; top: 50%; }
@keyframes deco-bob { 0%, 100% { margin-top: 0; } 50% { margin-top: -4px; } }
@keyframes deco-twinkle { 0%, 100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.15); } }
@keyframes deco-rise { 0% { opacity: 0; transform: translateY(8px) scale(.7); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(-46px) scale(1.1); } }
.shop-swatch .deco-wrap { transform: scale(.7); }

/* ---- Chat themes (change how the chat area looks for the person wearing them) ---- */
.i-theme-cyberpunk { --bg-0: #08040f; --bg-1: #0c0716; --bg-2: #140b26; --bg-3: #1e1236; --bg-4: #2e1a52; --line: rgba(255, 43, 214, .22); --text: #f6ecff; --muted: #b79bd9; --accent: #ff2bd6; --accent-2: #00e5ff; --accent-grad: linear-gradient(135deg, #ff2bd6, #00e5ff); }

.main[class*="i-theme-"] { color: var(--text); }
.i-theme-cyberpunk .chat-header { background: rgba(12, 7, 22, .92); }
.i-theme-galaxy .chat-header { background: rgba(10, 10, 34, .92); }
.i-theme-royal .chat-header { background: rgba(20, 16, 10, .92); }
.i-theme-pastel .chat-header { background: rgba(253, 242, 248, .92); }

.i-theme-pastel .pill, .i-theme-pastel .icon-btn { color: var(--muted); }

.undo-slot { flex: none; align-self: flex-start; margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.undo-btn {
  display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--bg-3); color: var(--muted);
  border-radius: 999px; padding: 3px 9px 3px 7px; font-size: 12px; font-variant-numeric: tabular-nums;
}
.undo-btn:hover { color: var(--text); background: var(--bg-4); }
.undo-ask { color: var(--text); }
.undo-yes, .undo-no { border: 0; border-radius: 999px; padding: 4px 11px; font-size: 12px; font-weight: 600; }
.undo-yes { background: #ef4444; color: #fff; }

/* ---------- Toasts ---------- */
.toasts {

.overlay { display: none; }

function el(tag, opts = {}, ...kids) {

  if (opts.class) node.className = opts.class;
  if (opts.id) node.id = opts.id;
  if (opts.text !== undefined) node.textContent = opts.text;
  if (opts.style) Object.assign(node.style, opts.style);
  if (opts.attrs) for (const [k, v] of Object.entries(opts.attrs)) node.setAttribute(k, v);
  if (opts.on) for (const [k, v] of Object.entries(opts.on)) node.addEventListener(k, v);
  kids.flat().forEach((kid) => { if (kid) node.append(kid); });
  return node;
}

/** Shrinks a picture from the person's device and turns it into a JPEG (this also removes hidden location data). */
async function prepareImage(file, { square = false, maxSide = CHAT_IMG_MAX } = {}) {
  if (!ALLOWED_IMG.includes(file.type)) throw new Error('Please choose a JPG, PNG, WebP or GIF picture.');
  if (file.size > MAX_INPUT_BYTES) throw new Error('That picture is too big. The limit is 15 MB.');

  let source;
  try {
    source = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch (e1) {
    try {
      const tmpUrl = URL.createObjectURL(file);
      source = new Image();
      source.src = tmpUrl;
      await source.decode();
      URL.revokeObjectURL(tmpUrl);
    } catch (e2) { throw new Error('That picture could not be opened. Try a different one.'); }
  }
  const sw = source.width, sh = source.height;
  if (!sw || !sh) throw new Error('That picture could not be opened. Try a different one.');

  const draw = (limit, quality) => new Promise((resolve, reject) => {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    if (square) {
      const side = Math.min(sw, sh);
      canvas.width = canvas.height = AVATAR_PX;
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, AVATAR_PX, AVATAR_PX);
      ctx.drawImage(source, (sw - side) / 2, (sh - side) / 2, side, side, 0, 0, AVATAR_PX, AVATAR_PX);
    } else {
      const scale = Math.min(1, limit / Math.max(sw, sh));
      canvas.width = Math.max(1, Math.round(sw * scale));
      canvas.height = Math.max(1, Math.round(sh * scale));
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
    }
    canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('That picture could not be prepared.'))), 'image/jpeg', quality);
  });

  let blob = await draw(maxSide, 0.86);
  if (blob.size > 4.5 * 1024 * 1024) blob = await draw(Math.min(maxSide, 1280), 0.65); // keep under the 5 MB storage limit
  if (source.close) source.close();
  return { blob, url: URL.createObjectURL(blob) };
}

const VIDEO_MAX_BYTES = 50 * 1024 * 1024;   // 50 MB
const VIDEO_MAX_SECONDS = 120;              // 2 minutes
const VIDEO_TYPES = { mp4: 'video/mp4', webm: 'video/webm' };

function videoExt(file) {
  const m = /\.([a-z0-9]+)$/i.exec(file.name || '');
  const ext = m ? m[1].toLowerCase() : '';
  if (VIDEO_TYPES[ext]) return ext;
  if (file.type === 'video/mp4') return 'mp4';
  if (file.type === 'video/webm') return 'webm';
  return '';
}

function formatSize(bytes) { return bytes >= 1048576 ? (bytes / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(bytes / 1024)) + ' KB'; }
function formatDuration(sec) { sec = Math.round(sec); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }

/** Reads how long a video is, without uploading anything. */
function readVideoDuration(url) {
  return new Promise((resolve, reject) => {
    const v = document.createElement('video');
    v.preload = 'metadata'; v.muted = true; v.playsInline = true;
    const done = (fn, val) => { clearTimeout(timer); v.removeAttribute('src'); v.load(); fn(val); };
    const timer = setTimeout(() => done(reject, new Error('timeout')), 15000);
    v.onerror = () => done(reject, new Error('unreadable'));
    v.onloadedmetadata = () => {
      if (v.duration === Infinity) {            // some WebM files do not store their length: seek to the end to find it
        v.onseeked = () => done(resolve, v.duration);
        v.currentTime = 1e101;
      } else {
        done(resolve, v.duration);
      }
    };
    v.src = url;
  });
}

async function prepareVideo(file) {
  const ext = videoExt(file);
  if (!ext) throw new Error('Only MP4 and WebM videos can be sent. (iPhone .mov files: choose "Most Compatible" in camera settings, or share them as MP4.)');
  if (file.size > VIDEO_MAX_BYTES) throw new Error('That video is ' + formatSize(file.size) + '. Videos can be up to 50 MB.');
  if (file.size < 1) throw new Error('That video file is empty.');
  const url = URL.createObjectURL(file);
  let duration;
  try { duration = await readVideoDuration(url); }
  catch (e) { URL.revokeObjectURL(url); throw new Error('That video could not be read. Try an MP4 (H.264) or WebM file.'); }
  if (!isFinite(duration) || duration <= 0) { URL.revokeObjectURL(url); throw new Error('That video could not be read.'); }
  if (duration > VIDEO_MAX_SECONDS + 0.5) {
    URL.revokeObjectURL(url);
    throw new Error('That video is ' + formatDuration(duration) + ' long. Videos can be up to 2 minutes.');
  }
  return { file, url, duration, name: file.name || ('video.' + ext), size: file.size, ext, type: VIDEO_TYPES[ext] };
}

/** Uploads a video to Supabase Storage with a progress callback (the normal upload call cannot report progress). */
async function uploadVideoWithProgress(path, prepared, onProgress, holder) {
  const { data: sess } = await db.auth.getSession();

    xhr.setRequestHeader('x-upsert', 'false');
    xhr.setRequestHeader('cache-control', 'max-age=3600');
    xhr.setRequestHeader('Content-Type', prepared.type);
    xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) { onProgress(1); resolve(); return; }
      let msg = ''; try { msg = (JSON.parse(xhr.responseText) || {}).message || ''; } catch (e) { msg = xhr.responseText || ''; }
      reject(Object.assign(new Error(msg || ('HTTP ' + xhr.status)), { status: xhr.status }));
    };
    xhr.onerror = () => reject(Object.assign(new Error('network'), { network: true }));
    xhr.onabort = () => reject(Object.assign(new Error('cancelled'), { cancelled: true }));
    xhr.send(prepared.file);
  });
}

function friendlyVideoError(error) {
  const msg = (error && error.message) || '';
  const status = error && error.status;
  if (error && error.network) return 'Video upload failed: check your internet connection and try again.';
  if (status === 413 || /too large|exceed|maximum allowed size/i.test(msg)) return 'That video is too big. Videos can be up to 50 MB.';
  if (/bucket not found/i.test(msg) || status === 404) return 'Videos are not set up yet. Run supabase-videos.sql in Supabase (see README.md).';
  if (/mime|not supported|invalid/i.test(msg) && status !== 403) return 'Only MP4 and WebM videos can be sent.';
  if (status === 401) return 'Please sign in again, then retry.';
  if (status === 403 || /row-level security|violates|unauthorized|not allowed/i.test(msg)) return 'Video not sent. You may be sending too many videos (limit: 5 every 10 minutes). Wait a bit and try again.';
  return 'Video upload failed. Please try again.';
}

/** Turns message text into text + animated emoticon images. Only known emoticon names are accepted. */
function renderContent(content) {
  const box = el('div', { class: 'msg-text' });
  const leftover = content.replace(MINICON_TOKEN, (all, id) => (MINICON_NAMES.has(id) ? '' : all)).trim();
  const onlyEmoticons = leftover === '';
  let last = 0;
  for (const match of content.matchAll(MINICON_TOKEN)) {
    const id = match[1];
    if (!MINICON_NAMES.has(id)) continue;
    if (match.index > last) box.append(document.createTextNode(content.slice(last, match.index)));
    box.append(el('img', {
      class: 'mc' + (onlyEmoticons ? ' mc-big' : ''),
      attrs: { src: MINICONS_BASE + id + '.svg', alt: MINICON_NAMES.get(id), title: MINICON_NAMES.get(id), loading: 'lazy', draggable: 'false' },
    }));
    last = match.index + match[0].length;
  }
  if (last < content.length) box.append(document.createTextNode(content.slice(last)));
  return box;
}

function formatTime(iso) {

function dayKey(d) { return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
function formatDay(d) {
  const today = new Date();
  const yesterday = new Date(); yesterday.setDate(today.getDate() - 1);
  if (dayKey(d) === dayKey(today)) return 'Today';
  if (dayKey(d) === dayKey(yesterday)) return 'Yesterday';
  return d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}

// ---------- Safety check on the settings ----------
function keyLooksSecret(key) {
  if (key.startsWith('sb_secret_')) return true;
  try {
    const part = key.split('.')[1];
    if (part) {
      const json = JSON.parse(atob(part.replace(/-/g, '+').replace(/_/g, '/')));
      return json.role === 'service_role';
    }
  } catch (e) { /* not a JWT-style key, that is fine */ }
  return false;
}

// ---------- Friendly error messages ----------
function friendlyAuthError(error) {
  const msg = (error && error.message) || '';
  if (/invalid login credentials/i.test(msg)) return 'Wrong username or password.';
  if (/email not confirmed/i.test(msg)) return 'Your account still needs confirming. The site owner must turn off "Confirm email" in Supabase (Authentication, Sign In / Providers, Email).';
  if (/already registered|already been registered/i.test(msg)) return 'That username is taken. Please pick another one.';
  if (/rate limit|too many/i.test(msg)) {
    state.lockUntil = Date.now() + 60000;   // pause the buttons for a minute so repeated clicks do not extend the limit
    return 'Too many attempts. Please wait a minute and try again.';
  }
  if (/password/i.test(msg) && /(short|least|weak)/i.test(msg)) return 'Please choose a longer, stronger password (8+ characters).';
  if (/invalid.*email|email.*invalid|not authorized/i.test(msg)) return 'Supabase did not accept the sign-up address. Tell the site owner: change LOGIN_DOMAIN in index.html. (' + msg + ')';
  if (/network|fetch/i.test(msg)) return 'Could not reach the server. Check your internet connection.';
  return msg || 'Something went wrong. Please try again.';
}

function friendlySendError(error) {
  const msg = (error && error.message) || '';
  if (/slow down|limit reached|repeat the same|invalid photo|invalid attachment/i.test(msg)) return msg;
  if (/row-level security/i.test(msg)) return 'You are not allowed to send that message.';
  if (/video_path/i.test(msg)) return 'Videos need a one-time database update. Run supabase-videos.sql in Supabase (see README.md).';
  if (/content_length/i.test(msg)) return 'Messages must be between 1 and ' + MAX_LEN + ' characters.';
  return 'Message not sent. Please try again.';
}

function setBusy(form, busy, busyText = 'Please wait…') {
  const btn = form.querySelector('button[type="submit"]');
  if (!btn) return;
  if (busy) { btn.dataset.label = btn.textContent; btn.textContent = busyText; }
  else if (btn.dataset.label) { btn.textContent = btn.dataset.label; }
  btn.disabled = busy;
}

/** Removes unwanted characters while the person types or pastes (bad = a pattern of forbidden characters). */
function restrictInput(input, bad) {
  const clean = () => {
    const cleaned = input.value.replace(bad, '');
    if (cleaned === input.value) return;
    let pos = null;
    try { pos = input.selectionStart; } catch (e) { /* some input types do not allow this */ }
    const removed = input.value.length - cleaned.length;
    input.value = cleaned;
    if (pos !== null) {
      try { input.setSelectionRange(Math.max(pos - removed, 0), Math.max(pos - removed, 0)); } catch (e) { /* ignore */ }
    }
  };
  input.addEventListener('input', (e) => { if (!e.isComposing) clean(); });
  input.addEventListener('compositionend', clean);
}

async function handleLogin(e) {
  e.preventDefault();
  const form = e.currentTarget;
  const err = $('#login-error');
  err.textContent = '';

  const wait = Math.ceil((state.lockUntil - Date.now()) / 1000);
  if (wait > 0) { err.textContent = 'Too many tries. Please wait ' + wait + ' seconds.'; return; }

  const username = $('#login-username').value.trim();
  const password = $('#login-password').value;
  if (!username || !password) { err.textContent = 'Please enter your username and password.'; return; }
  if (!USERNAME_RE.test(username)) { err.textContent = 'Wrong username or password.'; return; }

  setBusy(form, true, 'Logging in…');
  // Find the private sign-in address for this username (it keeps working even after a username change).
  let loginEmail = toLoginEmail(username);
  try {
    const found = await db.rpc('login_email', { check_name: username });
    if (found && typeof found.data === 'string' && found.data) loginEmail = found.data;
  } catch (e) { /* if the lookup is not available, fall back to the original address */ }
  const { error } = await db.auth.signInWithPassword({ email: loginEmail, password });
  setBusy(form, false);

  if (error) {
    state.failCount += 1;
    if (state.failCount >= 5) { state.lockUntil = Date.now() + 30000; state.failCount = 0; }
    err.textContent = friendlyAuthError(error);
    return;
  }
  state.failCount = 0;
  form.reset();
  // The onAuthStateChange listener below starts the app.
}

async function handleSignup(e) {
  e.preventDefault();
  const form = e.currentTarget;
  const err = $('#signup-error');
  const info = $('#signup-info');
  err.textContent = '';
  info.hidden = true;

  // Bot trap: real people never fill this hidden box.
  if ($('#signup-website').value) return;

  const pause = Math.ceil((state.lockUntil - Date.now()) / 1000);
  if (pause > 0) { err.textContent = 'Too many attempts. Please wait ' + pause + ' seconds.'; return; }

  const username = $('#signup-username').value.trim();
  const display = $('#signup-display').value.trim().slice(0, 30);
  const password = $('#signup-password').value;

  if (!USERNAME_RE.test(username)) {
    err.textContent = 'Username must be 3-20 characters: letters, numbers and _ only.'; return;
  }
  if (password.length < 8) { err.textContent = 'Password must be at least 8 characters.'; return; }

  setBusy(form, true, 'Creating account…');

  const check = await db.rpc('username_available', { check_name: username });
  if (check.error) {
    setBusy(form, false);
    err.textContent = 'Could not check the username. Did you run supabase.sql? (' + check.error.message + ')';
    return;
  }
  if (check.data === false) {
    setBusy(form, false);
    err.textContent = 'That username is taken. Please pick another one.';
    return;
  }

  const { data, error } = await db.auth.signUp({
    email: toLoginEmail(username),
    password,
    options: { data: display ? { username, display_name: display } : { username } },
  });
  setBusy(form, false);

  if (error) { err.textContent = friendlyAuthError(error); return; }

  // Supabase returns a user with no identities when the account already exists.
  if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
    err.textContent = 'That username is taken. Please pick another one.';
    return;
  }

  if (!data.session) {
    info.hidden = false;
    info.textContent = '✅ Account created! You can log in now.';
    form.reset();
  } else {
    form.reset(); // logged in straight away -> listener starts the app
  }
}

async function fetchOwnProfile(userId) {
  // The profile is created by a database trigger a moment after sign-up, so retry briefly.
  for (let i = 0; i < 6; i++) {
    const { data } = await db.from('profiles').select('*').eq('id', userId).maybeSingle();
    if (data) return data;
    await new Promise((r) => setTimeout(r, 450));
  }
  return null;
}

function showStartupProblem(user) {
  $('#app').hidden = true;
  $('#auth-screen').hidden = true;
  const splash = $('#splash');
  splash.hidden = false;
  splash.replaceChildren(el('div', { class: 'startup-problem' },
    el('h3', { text: 'ChatWorld could not load your profile' }),
    el('p', { text: 'You are still logged in. This usually fixes itself in a moment, or once the site owner has finished a database update.' }),
    el('button', { class: 'btn btn-primary', text: 'Try again', attrs: { type: 'button' }, on: { click: () => {
      splash.replaceChildren(el('span', { class: 'spinner' }));
      startApp(user);
    } } }),
    el('button', { class: 'btn btn-ghost', text: 'Log out', attrs: { type: 'button' }, on: { click: () => db.auth.signOut() } }),
  ));
}

async function startApp(user) {
  if (state.user && state.user.id === user.id) return;
  state = freshState();
  state.user = user;
  showApp();

  const profile = await fetchOwnProfile(user.id);
  if (!profile) {
    // Do NOT log the person out (a temporary problem or a half-finished update should not cost them their login).
    state = freshState();
    showStartupProblem(user);
    return;
  }
  state.profile = profile;
  state.profiles.set(profile.id, profile);
  renderMe();

  await loadUsers();
  await loadFriends();
  subscribeRealtime();
  subscribeGroupsRealtime();
  await loadGroups();
  joinPresence();
  joinCallChannel();
  joinTypingChannel();
  try { await loadShop(); } catch (e) { /* the Shop is optional: chat keeps working without it */ }
  await openChat('global');
}

function stopApp() {
  dismissIncoming();
  leaveCall(true);
  if (db) {
    if (callChannel) db.removeChannel(callChannel);
    callChannel = null;
    callPeople = new Map();
    if (state.dbChannel) db.removeChannel(state.dbChannel);
    if (state.presenceChannel) db.removeChannel(state.presenceChannel);
    leaveTypingChannel();
    if (state.shopChannel) db.removeChannel(state.shopChannel);
    if (state.groupsChannel) db.removeChannel(state.groupsChannel);
  }
  clearPendingImage();
  if (state.videoHolder && state.videoHolder.xhr) state.videoHolder.xhr.abort();
  clearPendingVideo();
  signedLinks.clear();
  stopEarning();
  state = freshState();
  applyTheme();
  renderOrbPill();
  $('#messages').replaceChildren();
  $('#user-list').replaceChildren();
  $('#app').classList.remove('sidebar-open');
  closeModal();
  document.title = 'ChatWorld';
}

async function logout() {
  await db.auth.signOut();
  stopApp();
  showAuth();
}

}

function openShop() {

// =====================================================================
//  ORBS, THE SHOP AND COSMETICS
//  - Orbs are counted and stored by Supabase (the server), never by the browser.
//  - What people buy/equip is stored in Supabase too, and everybody can see what others wear.
// =====================================================================
const COSMETIC_SLOTS = [
  { slot: 'frame', label: 'Avatar frames' },
  { slot: 'background', label: 'Profile backgrounds' },
  { slot: 'decoration', label: 'Profile decorations' },
  { slot: 'theme', label: 'Chat themes' },
  { slot: 'style', label: 'Message styles' },
  { slot: 'name_effect', label: 'Name effects' },
  { slot: 'tag', label: 'Tags' },
];
// Only ids on this list are ever turned into CSS classes (so nobody can inject anything through the database).
const COSMETIC_IDS = new Set([
  'frame_neon', 'frame_ice', 'frame_fire', 'frame_rainbow', 'frame_gold',
  'bg_aurora', 'bg_sunset', 'bg_ocean', 'bg_sakura', 'bg_matrix',
  'deco_sparkles', 'deco_hearts', 'deco_stars', 'deco_halo', 'deco_crown',
  'theme_pastel', 'theme_cyberpunk', 'theme_galaxy', 'theme_royal',
  'style_glass', 'style_candy', 'style_neon', 'style_retro',
  'fx_glow', 'fx_frost', 'fx_fire', 'fx_gold', 'fx_rainbow',
  'tag_cutie', 'tag_star', 'tag_vip', 'tag_pro', 'tag_og', 'tag_angel', 'tag_diva', 'tag_queen', 'tag_king', 'tag_royal',
]);
const COSMETIC_FIELDS = COSMETIC_SLOTS.map((s) => s.slot);
const validCos = (id, prefix) => typeof id === 'string' && COSMETIC_IDS.has(id) && (!prefix || id.startsWith(prefix));
const cosClass = (id) => (validCos(id) ? 'i-' + id.replace(/_/g, '-') : '');
const cosOf = (uid) => (state && state.cosmetics && state.cosmetics.get(uid)) || {};

/** A small rectangular tag such as VIP or KING (or nothing). */
function tagEl(id) {
  if (!validCos(id, 'tag_')) return null;
  return el('span', { class: 'utag ' + cosClass(id), text: id.slice(4).toUpperCase() });
}
const fxClass = (id) => (validCos(id, 'fx_') ? 'fx ' + cosClass(id) : '');
const fxSpan = (text, id) => el('span', { class: fxClass(id), text });
const styleClass = (id) => (validCos(id, 'style_') ? cosClass(id) : '');
const bgClass = (id) => (validCos(id, 'bg_') ? cosClass(id) : '');

/** Animated things around a big profile picture. */
function decoEl(id) {
  if (!validCos(id, 'deco_')) return null;
  const glyphs = { deco_crown: ['👑'], deco_halo: [''], deco_sparkles: ['✨', '✨', '✨', '✨'], deco_hearts: ['💖', '💗', '💖'], deco_stars: ['⭐', '⭐', '⭐', '⭐'] }[id] || [];
  return el('div', { class: 'deco ' + id.replace(/_/g, '-'), attrs: { 'aria-hidden': 'true' } }, ...glyphs.map((g) => el('span', { text: g })));
}
function withDeco(avatarNode, id) {
  const d = decoEl(id);
  return d ? el('span', { class: 'deco-wrap' }, avatarNode, d) : avatarNode;
}
/** The big picture in someone's profile window (with their decoration). */
function profileAvatar(p) {
  return withDeco(makeAvatar(p, 'xl'), cosOf(p.id).decoration);
}
/** An avatar that wears a chosen frame (used for previews: it ignores what the person really wears). */
function frameAvatar(p, size, frameId) {
  const a = makeAvatar({ ...p, id: null }, size);
  if (validCos(frameId, 'frame_')) a.classList.add(cosClass(frameId));
  return a;
}

const itemById = (id) => (state.shop && state.shop.catalog || []).find((i) => i.id === id);
const itemName = (id) => { const it = itemById(id); return it ? it.name : String(id || '').replace(/^[a-z]+_/, ''); };

/** Re-draws things that show other people's cosmetics, keeping the scroll position. */
function refreshCosmeticViews() {
  if (!state.user) return;
  renderHeader();
  if (state.chat.type === 'shop') { renderShop(); return; }
  const box = $('#messages');
  const keep = box.scrollTop, stick = state.stick;
  renderMessages();
  if (stick) scrollToBottom(); else box.scrollTop = keep;
}

/** Puts my chat theme on the chat area. */
function applyTheme() {
  const main = document.querySelector('.main');
  if (!main) return;
  Array.from(main.classList).filter((c) => c.startsWith('i-theme-')).forEach((c) => main.classList.remove(c));
  const t = state.user ? cosOf(state.user.id).theme : null;
  if (validCos(t, 'theme_')) main.classList.add(cosClass(t));
}

function pickCos(row) {
  const out = {};
  COSMETIC_FIELDS.forEach((f) => { out[f] = row && validCos(row[f]) ? row[f] : null; });
  return out;
}

async function loadCosmetics() {
  const { data, error } = await db.from('player_equipped').select('*').limit(5000);
  if (error || !data) return;
  data.forEach((r) => state.cosmetics.set(r.user_id, pickCos(r)));
}

function subscribeShopRealtime() {
  const s = state;
  s.shopChannel = db.channel('chatworld-shop')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'player_equipped' }, (payload) => {
      if (state !== s || !payload.new || !payload.new.user_id) return;
      const uid = payload.new.user_id;
      state.cosmetics.set(uid, pickCos(payload.new));
      if (uid === state.user.id && state.shop) { state.shop.equipped = pickCos(payload.new); applyTheme(); }
      refreshCosmeticViews();
    })
    .subscribe();
}

async function loadShop() {
  const s = state;
  const [cat, st] = await Promise.all([
    db.from('shop_items').select('id, slot, name, price, sort').order('sort', { ascending: true }),
    db.rpc('shop_state'),
  ]);
  if (state !== s) return;
  if (cat.error || st.error || !st.data) {
    state.shop = { error: (cat.error || st.error || { message: 'no answer' }).message };
    renderOrbPill();
    return;
  }
  const equipped = pickCos(st.data.equipped);
  state.shop = {
    catalog: cat.data || [], balance: Number(st.data.balance) || 0,
    owned: new Set(st.data.owned || []), equipped, tab: 'frame', preview: {}, error: null,
  };
  state.cosmetics.set(state.user.id, { ...equipped });
  await loadCosmetics();
  if (state !== s) return;
  subscribeShopRealtime();
  applyTheme();
  renderOrbPill();
  startEarning();
  if (state.chat.type === 'shop') renderShop();
}

// ---------- The Orb balance at the top ----------
let orbCountToken = 0;
function renderOrbPill() {
  const pill = $('#orb-pill');
  const ok = !!(state.user && state.shop && !state.shop.error);
  pill.hidden = !ok;
  if (ok) $('#orb-count').textContent = state.shop.balance.toLocaleString();
}

function floatOrb(text, up) {
  const pill = $('#orb-pill');
  const tag = el('span', { class: 'orb-float ' + (up ? 'up' : 'down'), text });
  pill.append(tag);
  setTimeout(() => tag.remove(), 1200);
}

/** Changes the balance everywhere, with a small animation. */
function setBalance(n) {
  const s = state.shop;
  if (!s) return;
  const old = s.balance;
  s.balance = n;
  const pill = $('#orb-pill'), count = $('#orb-count');
  const token = ++orbCountToken;
  if (Math.abs(n - old) > 3) {
    const t0 = performance.now();
    const step = (t) => {
      if (token !== orbCountToken) return;
      const k = Math.min(1, (t - t0) / 450);
      count.textContent = Math.round(old + (n - old) * k).toLocaleString();
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
    setTimeout(() => { if (token === orbCountToken) count.textContent = n.toLocaleString(); }, 600);
  } else {
    count.textContent = n.toLocaleString();
  }
  if (n !== old) {
    pill.classList.remove('orb-gain', 'orb-spend');
    void pill.offsetWidth;                       // restart the animation
    pill.classList.add(n > old ? 'orb-gain' : 'orb-spend');
    floatOrb((n > old ? '+' : '−') + Math.abs(n - old).toLocaleString(), n > old);
    setTimeout(() => pill.classList.remove('orb-gain', 'orb-spend'), 700);
  }
  if (state.chat.type === 'shop') renderShop();
}

// ---------- Earning: 2 Orbs per minute while the tab is visible ----------
let orbTimer = 0;
function startEarning() {
  stopEarning();
  orbTimer = setInterval(() => orbBeat(true), 15000);
  orbBeat(true);
}
function stopEarning() { clearInterval(orbTimer); orbTimer = 0; }

/** Tells the server "I am here" (or "I am leaving"). The server does all the counting. */
async function orbBeat(active) {
  const s = state;
  if (!s.user || !s.shop || s.shop.error) return;
  if (active && document.visibilityState !== 'visible') return;   // hidden tab = no Orbs
  const { data, error } = await db.rpc('shop_heartbeat', { p_active: active });
  if (error || !data || state !== s || state.shop !== s.shop) return;
  const bal = Number(data.balance);
  if (Number.isFinite(bal) && bal !== state.shop.balance) setBalance(bal);
}

// ---------- Buying and equipping ----------
function friendlyShopError(error) {
  const msg = (error && error.message) || '';
  if (/not enough orbs|already own|buy this item first|does not fit|does not exist|sign in again/i.test(msg)) return msg;
  if (/schema cache|could not find the function|does not exist/i.test(msg)) return 'The Shop needs a one-time database update. Run supabase-shop.sql in Supabase (see README.md).';
  return 'Something went wrong. Please try again.';
}

async function buyItem(id) {
  const s = state.shop, it = itemById(id);
  if (!s || !it || s.owned.has(id)) return;
  if (s.balance < it.price) {
    toast('Not enough Orbs yet: you need ' + (it.price - s.balance).toLocaleString() + ' more. You earn 2 every minute.', 'error');
    return;
  }
  if (!confirm('Buy "' + it.name + '" for ' + it.price.toLocaleString() + ' Orbs?')) return;
  const { data, error } = await db.rpc('buy_item', { p_item: id });
  if (error) { toast(friendlyShopError(error), 'error'); return; }
  s.owned.add(id);
  toast('You bought ' + it.name + '! 🎉', 'success');
  setBalance(Number(data.balance));
}

async function equipItem(slot, id) {            // id = null means "take it off"
  const s = state.shop;
  if (!s) return;
  const { data, error } = await db.rpc('equip_item', { p_slot: slot, p_item: id });
  if (error) { toast(friendlyShopError(error), 'error'); return; }
  s.equipped = pickCos(data);
  delete s.preview[slot];
  state.cosmetics.set(state.user.id, { ...s.equipped });
  applyTheme();
  toast(id ? itemName(id) + ' equipped.' : 'Removed.', 'success');
  refreshCosmeticViews();
}

// ---------- The Shop page ----------
function swatchFor(it) {
  const p = state.profile;
  const box = el('div', { class: 'shop-swatch' });
  if (it.slot === 'frame') box.append(frameAvatar(p, '', it.id));
  else if (it.slot === 'background') { box.classList.add('is-bg'); box.append(el('div', { class: cosClass(it.id) })); }
  else if (it.slot === 'decoration') { const a = makeAvatar({ ...p, id: null }, ''); box.append(withDeco(a, it.id)); }
  else if (it.slot === 'theme') { box.classList.add('is-theme'); box.append(el('div', { class: 'theme-mini ' + cosClass(it.id) }, el('i'), el('i'))); }
  else if (it.slot === 'style') box.append(el('div', { class: 'msg-body ' + styleClass(it.id), style: { textAlign: 'left' } }, el('div', { class: 'msg-text', text: 'Hello there! 👋' })));
  else if (it.slot === 'name_effect') box.append(el('b', { style: { fontSize: '17px' } }, fxSpan(nameOf(p), it.id)));
  else if (it.slot === 'tag') box.append(el('span', { style: { transform: 'scale(1.5)' } }, tagEl(it.id)));
  return box;
}

function buildPreview(eff) {
  const p = state.profile;
  const stage = el('div', { class: 'sp-stage ' + (validCos(eff.theme, 'theme_') ? cosClass(eff.theme) : '') });
  const card = el('div', { class: 'sp-card ' + bgClass(eff.background) },
    withDeco(frameAvatar(p, 'xl', eff.frame), eff.decoration),
    el('div', {},
      el('div', { class: 'sp-name' }, fxSpan(nameOf(p), eff.name_effect), tagEl(eff.tag)),
      el('small', { text: '@' + p.username })));
  const chat = el('div', { class: 'sp-chat' },
    el('span', { class: 'msg-avatar' }, frameAvatar(p, '', eff.frame)),
    el('div', { class: 'msg-body ' + styleClass(eff.style) },
      el('div', { class: 'msg-head' }, fxSpan(nameOf(p), eff.name_effect), tagEl(eff.tag), el('span', { class: 'msg-time', text: 'now' })),
      el('div', { class: 'msg-text', text: 'This is how your messages look ✨' })));
  stage.append(card, chat);
  return stage;
}

function renderShop() {
  if (state.chat.type !== 'shop') return;
  const page = $('#shop-page');
  const keep = page.scrollTop;
  page.replaceChildren();
  const s = state.shop;
  if (!s) { page.append(el('div', { class: 'shop-note', text: 'Loading the Shop…' })); return; }
  if (s.error) {
    page.append(el('div', { class: 'shop-note' },
      el('p', { text: 'The Shop needs a one-time database update.' }),
      el('p', { text: 'Run supabase-shop.sql in Supabase (see README.md), then refresh this page.' }),
      el('p', { class: 'muted', text: '[Details: ' + s.error + ']' }),
      el('p', { class: 'muted', text: 'This site is connected to the Supabase project: ' + (SUPABASE_URL.trim().replace(/^https?:\/\//, '').split('.')[0]) })));
    return;
  }

  const eff = { ...s.equipped, ...s.preview };
  const previewing = Object.keys(s.preview);

  page.append(el('div', { class: 'shop-top' },
    el('div', { class: 'shop-balance' },
      el('div', { class: 'big' }, el('span', { class: 'orb' }), el('span', { text: s.balance.toLocaleString() })),
      el('small', { text: 'Your Orbs. You earn 2 every minute while ChatWorld is open and visible.' })),
    el('div', { class: 'shop-preview' },
      el('div', { class: 'sp-title' }, 'Preview',
        previewing.length ? el('button', { attrs: { type: 'button' }, text: 'Clear preview', on: { click: () => { s.preview = {}; renderShop(); } } }) : null),
      buildPreview(eff))));

  page.append(el('div', { class: 'shop-tabs', attrs: { role: 'tablist' } },
    ...COSMETIC_SLOTS.map((t) => el('button', {
      class: 'shop-tab' + (s.tab === t.slot ? ' active' : ''), text: t.label, attrs: { type: 'button', role: 'tab' },
      on: { click: () => { s.tab = t.slot; renderShop(); page.scrollTop = 0; } },
    }))));

  const items = s.catalog.filter((i) => i.slot === s.tab && COSMETIC_IDS.has(i.id));
  const grid = el('div', { class: 'shop-grid' });
  if (!items.length) grid.append(el('div', { class: 'shop-note', text: 'Nothing here yet.' }));
  for (const it of items) {
    const owned = s.owned.has(it.id);
    const equipped = s.equipped[it.slot] === it.id;
    const isPrev = s.preview[it.slot] === it.id;
    const actions = el('div', { class: 'shop-actions' },
      el('button', {
        attrs: { type: 'button' }, text: isPrev ? 'Stop preview' : 'Preview',
        on: { click: () => { if (isPrev) delete s.preview[it.slot]; else s.preview[it.slot] = it.id; renderShop(); } },
      }));
    if (!owned) {
      const afford = s.balance >= it.price;
      actions.append(el('button', {
        class: 'buy' + (afford ? '' : ' poor'), text: 'Buy',
        attrs: { type: 'button', title: afford ? 'Buy for ' + it.price + ' Orbs' : 'You need ' + (it.price - s.balance) + ' more Orbs' },
        on: { click: () => buyItem(it.id) },
      }));
    } else if (equipped) {
      actions.append(el('button', { class: 'unequip', attrs: { type: 'button' }, text: 'Unequip', on: { click: () => equipItem(it.slot, null) } }));
    } else {
      actions.append(el('button', { class: 'equip', attrs: { type: 'button' }, text: 'Equip', on: { click: () => equipItem(it.slot, it.id) } }));
    }
    grid.append(el('div', { class: 'shop-card' + (equipped ? ' equipped' : '') + (isPrev ? ' previewing' : '') },
      swatchFor(it),
      el('div', { class: 'shop-name' }, el('span', { text: it.name }),
        owned
          ? el('span', { class: 'shop-owned', text: equipped ? 'Equipped' : 'Owned' })
          : el('span', { class: 'shop-price' }, el('span', { class: 'orb' }), String(it.price.toLocaleString()))),
      actions));
  }
  page.append(grid);
  page.scrollTop = keep;
}

const GROUP_COLORS = ['#5865f2', '#8b5cf6', '#ec4899', '#f97316', '#14b8a6', '#0ea5e9', '#22c55e', '#eab308'];

function groupColor(id) {
  let h = 0;
  for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return GROUP_COLORS[h % GROUP_COLORS.length];
}

/** The group picture: two little people on a coloured circle. */
function groupIcon(id, size = '') {
  const icon = el('span', { class: 'group-icon ' + size, style: { background: groupColor(id) }, attrs: { 'aria-hidden': 'true' } });
  icon.innerHTML =
    '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' +
    '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/>' +
    '<circle cx="17" cy="9" r="2.4"/><path d="M17.5 14.6c2.3.2 3.9 1.9 3.9 4.4"/></svg>';
  return icon;
}

const groupList = () => [...state.groups.values()].sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
const memberIds = (gid) => [...(state.members.get(gid) || new Map()).keys()];
const iAmOwner = (gid) => { const m = state.members.get(gid); return !!(m && m.get(state.user.id) && m.get(state.user.id).role === 'owner'); };

function friendlyGroupError(error) {
  const msg = (error && error.message) || '';
  if (/relation .*group|function .*group|schema cache|could not find the function/i.test(msg)) {
    return 'Groups need a one-time database update. Run supabase-groups.sql in Supabase (see README.md).';
  }
  return msg || 'Something went wrong. Please try again.';
}

async function loadGroups() {
  const g = await db.from('groups').select('id, name, created_by, created_at');
  if (g.error) { state.groupsReady = false; state.groupsError = friendlyGroupError(g.error); renderUsers(); return; }
  const m = await db.from('group_members').select('group_id, user_id, role, joined_at');
  if (m.error) { state.groupsReady = false; state.groupsError = friendlyGroupError(m.error); renderUsers(); return; }

  state.groupsReady = true;
  state.groupsError = '';
  state.groups = new Map((g.data || []).map((row) => [row.id, row]));
  state.members = new Map();
  (m.data || []).forEach((row) => {
    if (!state.members.has(row.group_id)) state.members.set(row.group_id, new Map());
    state.members.get(row.group_id).set(row.user_id, row);
  });
  await ensureProfiles((m.data || []).map((row) => row.user_id));

  // If the group I am looking at is gone (I left, was removed, or it was deleted), go back to Global Chat.
  if (state.chat.type === 'group' && !state.groups.has(state.chat.id)) {
    toast('You are no longer in that group.');
    closeModal();
    openChat('global');
    return;
  }
  renderUsers();
  if (state.chat.type === 'group') { renderHeader(); }
  if ($('#modal') && !$('#modal').hidden && state.openGroupInfo) openGroupInfo(state.openGroupInfo);
}

let groupRefreshTimer = null;
function scheduleGroupsRefresh() {
  clearTimeout(groupRefreshTimer);
  groupRefreshTimer = setTimeout(loadGroups, 300);
}

/** A separate live channel for groups, so a problem here can never affect normal chatting. */
function subscribeGroupsRealtime() {
  const channel = db.channel('chatworld-groups');
  channel
    .on('postgres_changes', { event: '*', schema: 'public', table: 'groups' }, scheduleGroupsRefresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'group_members' }, scheduleGroupsRefresh)
    .subscribe();
  state.groupsChannel = channel;
}

/** A searchable list of people with tick boxes. Returns { node, selected }. */
function peoplePicker(candidates) {
  const selected = new Set();
  const count = el('span', { class: 'field-note', text: 'No one selected yet.' });
  const search = el('input', { attrs: { type: 'search', placeholder: 'Search people…', autocomplete: 'off' } });
  const box = el('div', { class: 'picker-list' });

  const draw = () => {
    const term = search.value.trim().toLowerCase();
    box.replaceChildren();
    const shown = candidates.filter((p) => !term || p.username.toLowerCase().includes(term) || nameOf(p).toLowerCase().includes(term));
    if (!shown.length) box.append(el('div', { class: 'empty-note', text: candidates.length ? 'No one found.' : 'There is no one to add.' }));
    shown.forEach((p) => {
      const cb = el('input', { attrs: { type: 'checkbox' } });
      cb.checked = selected.has(p.id);
      cb.addEventListener('change', () => {
        cb.checked ? selected.add(p.id) : selected.delete(p.id);
        count.textContent = selected.size ? selected.size + ' selected.' : 'No one selected yet.';
      });
      box.append(el('label', { class: 'picker-row' }, cb, makeAvatar(p, 'sm'),
        el('span', { class: 'picker-name', text: nameOf(p) }),
        p.display_name ? el('span', { class: 'msg-handle', text: '@' + p.username }) : null));
    });
  };
  search.addEventListener('input', draw);
  draw();
  return { node: el('div', { class: 'picker' }, search, box, count), selected };
}

const otherPeople = (excludeIds = []) => [...state.profiles.values()]
  .filter((p) => p.id !== state.user.id && !excludeIds.includes(p.id)).sort(byName);

function openCreateGroup() {
  if (!state.groupsReady) { toast(state.groupsError || 'Groups are not ready yet.', 'error'); return; }
  state.openGroupInfo = null;
  const card = $('#modal-card');
  const nameInput = el('input', { attrs: { type: 'text', maxlength: '40', placeholder: 'Group name', autocomplete: 'off', id: 'group-name' } });
  const picker = peoplePicker(otherPeople());
  const err = el('div', { class: 'form-error' });
  const create = el('button', { class: 'btn btn-primary', text: 'Create group', attrs: { type: 'submit' } });
  const form = el('form', { class: 'form' },
    el('label', { text: 'Group name' }), nameInput,
    el('label', { text: 'Add people' }), picker.node, err, create);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    const name = nameInput.value.trim();
    if (!name) { err.textContent = 'Please give the group a name.'; return; }
    create.disabled = true; create.textContent = 'Creating…';
    const { data, error } = await db.rpc('create_group', { group_name: name, member_ids: [...picker.selected] });
    create.disabled = false; create.textContent = 'Create group';
    if (error) { err.textContent = friendlyGroupError(error); return; }
    closeModal();
    await loadGroups();
    openChat('group', data);
  });

  card.replaceChildren(
    el('button', { class: 'icon-btn modal-close', text: '✕', attrs: { type: 'button', 'aria-label': 'Close' }, on: { click: closeModal } }),
    el('h3', { text: 'New group' }),
    el('p', { class: 'muted', text: 'Pick a name and the people you want to talk with.' }),
    form);
  $('#modal').hidden = false;
  nameInput.focus();
}

function openGroupInfo(gid) {
  const group = state.groups.get(gid);
  if (!group) return;
  state.openGroupInfo = gid;
  const owner = iAmOwner(gid);
  const card = $('#modal-card');
  const ids = memberIds(gid);
  const err = el('div', { class: 'form-error' });

  const run = async (promise, okText) => {
    err.textContent = '';
    const { error } = await promise;
    if (error) { err.textContent = friendlyGroupError(error); return false; }
    if (okText) toast(okText, 'success');
    return true;
  };

  // Members
  const rows = ids.map((id) => {
    const p = profileOf(id);
    const role = (state.members.get(gid).get(id) || {}).role;
    return el('div', { class: 'member-row' },
      makeAvatar(p, 'sm'),
      el('span', { class: 'member-name', text: nameOf(p) + (id === state.user.id ? ' (you)' : '') }),
      role === 'owner' ? el('span', { class: 'owner-tag', text: 'owner' }) : null,

        class: 'btn btn-ghost small', text: 'Remove', attrs: { type: 'button' },
        on: { click: async () => {
          if (!confirm('Remove ' + nameOf(p) + ' from this group?')) return;

        } },

  // Rename (owner)

  if (owner) {
    const input = el('input', { attrs: { type: 'text', maxlength: '40', autocomplete: 'off' } });

    renameBox = el('div', { class: 'inline-form' }, input, el('button', {
      class: 'btn btn-ghost small', text: 'Rename', attrs: { type: 'button' },
      on: { click: async () => {
        const n = input.value.trim();
        if (!n || n === group.name) return;
        if (await run(db.rpc('rename_group', { gid, new_name: n }), 'Group renamed.')) await loadGroups();
      } },
    }));
  }

  // Add people (any member)
  const picker = peoplePicker(otherPeople(ids));
  const addBtn = el('button', {
    class: 'btn btn-primary small', text: 'Add selected people', attrs: { type: 'button' },
    on: { click: async () => {
      if (!picker.selected.size) { err.textContent = 'Tick the people you want to add first.'; return; }
      if (await run(db.rpc('add_group_members', { gid, member_ids: [...picker.selected] }), 'People added.')) await loadGroups();
    } },
  });

  const actions = el('div', { class: 'call-actions' },
    el('button', {
      class: 'btn btn-leave', text: 'Leave group', attrs: { type: 'button' },
      on: { click: async () => {
        if (!confirm('Leave "' + group.name + '"? You will not see its messages any more.')) return;
        if (await run(db.rpc('leave_group', { gid }))) { state.openGroupInfo = null; closeModal(); await loadGroups(); }
      } },
    }),
    owner ? el('button', {
      class: 'btn btn-ghost', text: 'Delete group', attrs: { type: 'button' },
      on: { click: async () => {
        if (!confirm('Delete "' + group.name + '" for everyone? All its messages will be lost.')) return;
        if (await run(db.rpc('delete_group', { gid }))) { state.openGroupInfo = null; closeModal(); await loadGroups(); }
      } },
    }) : null);

  card.replaceChildren(
    el('button', { class: 'icon-btn modal-close', text: '✕', attrs: { type: 'button', 'aria-label': 'Close' }, on: { click: () => { state.openGroupInfo = null; closeModal(); } } }),
    groupIcon(gid, 'xl'),
    el('h3', { text: group.name }),
    el('p', { class: 'muted', text: ids.length + (ids.length === 1 ? ' member' : ' members') }),
    renameBox,
    el('div', { class: 'form' },
      el('label', { text: 'Members' }), el('div', { class: 'member-list' }, rows),
