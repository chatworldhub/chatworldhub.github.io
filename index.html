/* =====================================================================
   ChatWorld - style.css
   Dark, modern look inspired by Discord and ChatGPT.
   Tip: change the colours in the ":root" block below to re-theme the site.
   ===================================================================== */

:root {
  --bg-0: #121317;
  --bg-1: #17181c;
  --bg-2: #1e1f25;
  --bg-3: #272932;
  --bg-4: #323543;
  --line: rgba(255, 255, 255, 0.07);

  --text: #e8eaee;
  --muted: #9aa1ad;

  --accent: #5865f2;
  --accent-2: #8b5cf6;
  --accent-grad: linear-gradient(135deg, #5865f2 0%, #8b5cf6 100%);

  --green: #23a55a;
  --red: #f23f43;
  --amber: #f0b232;

  --radius: 14px;
  --sidebar-w: 300px;

  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
    "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  color-scheme: dark;
}

*,
*::before,
*::after { box-sizing: border-box; }

[hidden] { display: none !important; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg-1);
  color: var(--text);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }

::selection { background: rgba(88, 101, 242, 0.45); }

/* nice thin scroll bars */
* { scrollbar-width: thin; scrollbar-color: var(--bg-4) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 8px; }

/* ---------- Splash ---------- */
.splash {
  position: fixed; inset: 0; z-index: 50;
  display: grid; place-items: center;
  background: var(--bg-1);
  font-size: 56px;
}
.spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--bg-4); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.12); opacity: 1; } }

/* ---------- Buttons & inputs ---------- */
.btn {
  border: 0; border-radius: 10px;
  padding: 11px 16px; font-weight: 600;
  transition: transform .06s ease, filter .15s ease, background .15s ease;
}
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .6; cursor: not-allowed; }
.btn-primary { background: var(--accent-grad); color: #fff; }
.btn-primary:hover:not(:disabled) { filter: brightness(1.1); }
.btn-ghost { background: var(--bg-3); }
.btn-ghost:hover:not(:disabled) { background: var(--bg-4); }

.icon-btn {
  display: inline-grid; place-items: center;
  width: 38px; height: 38px; flex: none;
  border: 0; border-radius: 10px;
  background: transparent; color: var(--muted);
  transition: background .15s, color .15s;
}
.icon-btn:hover { background: var(--bg-3); color: var(--text); }

input[type="text"], input[type="email"], input[type="password"], input[type="search"], textarea {
  width: 100%;
  background: var(--bg-0);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 13px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.25);
}
::placeholder { color: #6b7280; }

/* ---------- Show / hide password (eye button) ---------- */
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 48px; }
.pw-toggle {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 36px; height: 36px; display: grid; place-items: center;
  border: 0; border-radius: 8px; background: transparent; color: var(--muted);
}
.pw-toggle:hover { color: var(--text); background: var(--bg-3); }

.logo-img { display: block; background: var(--logo) center / contain no-repeat; aspect-ratio: 1394 / 1239; flex: none; }
.logo-lg { width: min(230px, 62%); margin: 0 auto 6px; }
.logo-sm { height: 54px; }
.auth-card .brand { justify-content: center; }
.auth-tagline { text-align: center; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Brand ---------- */
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font-size: 26px; letter-spacing: -0.02em; }
.brand-logo { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-grad); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 22px; flex: none; }
.brand-sm h1 { font-size: 18px; }
.brand-sm .brand-logo { width: 30px; height: 30px; border-radius: 9px; font-size: 16px; }

/* ---------- Login / sign-up ---------- */
.auth-screen {
  min-height: 100dvh;
  display: grid; place-items: center;
  padding: 20px;
  background:
    radial-gradient(900px 500px at 15% 10%, rgba(88, 101, 242, 0.28), transparent 60%),
    radial-gradient(800px 500px at 90% 90%, rgba(139, 92, 246, 0.22), transparent 60%),
    var(--bg-0);
}
.auth-card {
  width: 100%; max-width: 420px;
  background: rgba(30, 31, 37, 0.85);
  backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 30px 26px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
}
.auth-tagline { color: var(--muted); margin: 8px 0 20px; }

.tabs {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
  background: var(--bg-0); padding: 4px; border-radius: 12px; margin-bottom: 18px;
}
.tab {
  border: 0; background: transparent; color: var(--muted);
  padding: 9px; border-radius: 9px; font-weight: 600;
}
.tab.active { background: var(--bg-3); color: var(--text); }

.form { display: flex; flex-direction: column; gap: 8px; }
.form label { font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 6px; }
.form .btn { margin-top: 14px; }
.form-error { color: #ff7b7e; font-size: 13px; min-height: 0; }
.form-error:empty { display: none; }
.form-error:not(:empty) { margin-top: 6px; }

.notice { border-radius: 10px; padding: 11px 13px; font-size: 14px; margin-bottom: 14px; }
.notice-warn { background: rgba(240, 178, 50, 0.12); border: 1px solid rgba(240, 178, 50, 0.4); color: #ffd98a; }
.notice-ok { background: rgba(35, 165, 90, 0.12); border: 1px solid rgba(35, 165, 90, 0.4); color: #7ee2a8; margin: 8px 0 0; }

/* spam-bot trap: kept off-screen, not display:none (bots notice that) */
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

/* ---------- App layout ---------- */
.app { display: flex; height: 100dvh; width: 100%; overflow: hidden; }

.sidebar {
  width: var(--sidebar-w); flex: none;
  display: flex; flex-direction: column;
  background: var(--bg-2);
  border-right: 1px solid var(--line);
  min-height: 0;
}
.sidebar-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 16px 10px;
}
.search-wrap { padding: 4px 14px 10px; }
.search-wrap input { background: var(--bg-0); padding: 9px 12px; }

.user-list { flex: 1; overflow-y: auto; padding: 4px 8px 10px; min-height: 0; }

.section-label {
  font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); padding: 14px 10px 6px;
}
.empty-note { color: var(--muted); font-size: 13px; padding: 8px 10px; }

.chat-item {
  display: flex; align-items: center; gap: 11px;
  width: 100%; padding: 8px 10px; margin: 1px 0;
  border: 0; border-radius: 10px; background: transparent; text-align: left;
  color: var(--muted);
  transition: background .12s, color .12s;
}
.chat-item:hover { background: var(--bg-3); color: var(--text); }
.chat-item.active { background: var(--bg-4); color: #fff; }
.chat-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.chat-item.offline .avatar { opacity: .55; }

.hash-icon {
  width: 36px; height: 36px; flex: none; border-radius: 50%;
  display: grid; place-items: center; font-size: 18px; font-weight: 700;
  background: var(--accent-grad); color: #fff;
}

.badge {
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
  background: var(--red); color: #fff; font-size: 12px; font-weight: 700;
  display: grid; place-items: center;
}

/* Avatars */
.avatar-wrap { position: relative; flex: none; display: inline-block; }
.avatar {
  width: 36px; height: 36px; flex: none; border-radius: 50%;
  display: inline-grid; place-items: center;
  font-weight: 700; color: #fff; user-select: none;
}
.avatar.sm { width: 34px; height: 34px; font-size: 14px; }
.avatar.xl { width: 84px; height: 84px; font-size: 36px; }
.status-dot {
  position: absolute; right: -1px; bottom: -1px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--green); border: 3px solid var(--bg-2);
  box-sizing: content-box; width: 9px; height: 9px;
}
.chat-item:hover .status-dot { border-color: var(--bg-3); }
.chat-item.active .status-dot { border-color: var(--bg-4); }

/* "Me" box at the bottom of the sidebar */
.me {
  display: flex; align-items: center; gap: 6px;
  padding: 10px; border-top: 1px solid var(--line);
  background: var(--bg-1);
  padding-bottom: max(10px, env(safe-area-inset-bottom));
}
.me-info {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;
  border: 0; background: transparent; text-align: left; padding: 6px; border-radius: 10px;
}
.me-info:hover { background: var(--bg-3); }
.me-text { display: flex; flex-direction: column; min-width: 0; }
.me-text strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-text small { color: var(--muted); }

/* ---------- Main chat area ---------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-1); }

.chat-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; min-height: 62px;
  border-bottom: 1px solid var(--line);
  background: rgba(23, 24, 28, 0.9); backdrop-filter: blur(8px);
}
.chat-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
.chat-title.clickable { cursor: pointer; }
.title-text { min-width: 0; }
.title-text h2 { font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.title-text p { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.pill {
  display: inline-flex; align-items: center; gap: 7px; flex: none;
  padding: 6px 12px; border-radius: 999px;
  background: var(--bg-3); font-size: 13px; color: var(--muted);
}
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }

/* Messages */
.messages {
  flex: 1; overflow-y: auto; min-height: 0;
  padding: 18px max(14px, calc((100% - 920px) / 2)) 10px;
  overscroll-behavior: contain;
}
.load-more {
  display: block; margin: 0 auto 14px;
  border: 1px solid var(--line); background: var(--bg-2); color: var(--muted);
  padding: 7px 14px; border-radius: 999px; font-size: 13px;
}
.load-more:hover { color: var(--text); background: var(--bg-3); }

.day-divider {
  display: flex; align-items: center; gap: 12px;
  color: var(--muted); font-size: 12px; font-weight: 600; margin: 18px 0 8px;
}
.day-divider::before, .day-divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.msg {
  display: flex; gap: 12px;
  padding: 4px 10px; margin: 0 -10px; border-radius: 10px;
  animation: pop .18s ease-out;
}
.msg:hover { background: rgba(255, 255, 255, 0.03); }
.msg:not(.grouped) { margin-top: 12px; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.msg-avatar { flex: none; width: 38px; border: 0; background: none; padding: 0; height: 38px; }
.msg-avatar .avatar { width: 38px; height: 38px; }
.msg-gutter { flex: none; width: 38px; font-size: 10px; color: transparent; text-align: center; padding-top: 5px; }
.msg:hover .msg-gutter { color: var(--muted); }

.msg-body { min-width: 0; flex: 1; }

.composer {

.composer-box {

.composer-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.2); }
.composer-box textarea {
  flex: 1; border: 0; background: transparent; resize: none; padding: 8px 0;
  max-height: 160px; box-shadow: none !important; border-radius: 0;
}
.send-btn {
  flex: none; width: 40px; height: 40px; border: 0; border-radius: 12px;
  display: grid; place-items: center;
  background: var(--accent-grad); color: #fff;
  transition: filter .15s, opacity .15s;
}
.send-btn:hover:not(:disabled) { filter: brightness(1.12); }
.send-btn:disabled { opacity: .45; cursor: not-allowed; }
.composer-meta { height: 16px; text-align: right; font-size: 11px; color: var(--muted); padding: 3px 6px 0; }
.composer-meta .warn { color: var(--amber); }

/* ---------- Minicons animated emoticons ---------- */
.composer { position: relative; }
.emoji-btn {
  flex: none; width: 40px; height: 40px; border: 0; border-radius: 12px;
  display: grid; place-items: center; background: transparent; color: var(--muted);
  transition: background .15s, color .15s;
}
.emoji-btn:hover, .emoji-btn.open { background: var(--bg-4); color: var(--text); }
.emoji-panel {
  position: absolute; z-index: 20; left: max(14px, calc((100% - 920px) / 2)); bottom: 100%;
  width: min(430px, calc(100% - 28px)); max-height: min(320px, 50dvh); overflow-y: auto;
  background: var(--bg-2); border: 1px solid var(--line); border-radius: 16px;
  padding: 10px; margin-bottom: 4px; box-shadow: 0 20px 60px rgba(0, 0, 0, .55);
  animation: pop .15s ease-out;
}
.emoji-title { font-size: 12px; color: var(--muted); padding: 2px 6px 8px; }
.emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 4px; }
.emoji-item { border: 0; border-radius: 10px; background: transparent; padding: 5px; display: grid; place-items: center; }

.emoji-item img { width: 40px; height: 40px; display: block; }
.mc { width: 28px; height: 28px; vertical-align: middle; margin: 0 1px; }
.mc-big { width: 64px; height: 64px; margin: 2px 0; }

/* ---------- Photos: profile pictures + shared images ---------- */
.avatar { position: relative; overflow: hidden; }
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

.attach-preview {
  display: flex; align-items: center; gap: 12px; margin: 0 0 8px;
  padding: 8px 10px; border-radius: 14px; background: var(--bg-3); border: 1px solid var(--line);
  font-size: 13px; color: var(--muted);
}
.attach-preview img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex: none; }
.attach-preview span { flex: 1; min-width: 0; }

.msg-img {
  display: block; max-width: min(340px, 100%); max-height: 340px; width: auto; height: auto;
  margin-top: 4px; border-radius: 12px; background: var(--bg-3); cursor: zoom-in;
}
.msg-img.loading { width: 220px; height: 150px; animation: shimmer 1.2s ease-in-out infinite; }
@keyframes shimmer { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
.msg-img-fail { margin-top: 4px; color: var(--muted); font-size: 13px; }

.lightbox {
  position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px;
  background: rgba(0, 0, 0, .86); cursor: zoom-out;
}
.lightbox img { max-width: 94vw; max-height: 92dvh; border-radius: 10px; }

.photo-actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 4px 0 6px; }
.modal-card .photo-actions .btn { width: auto; padding: 8px 14px; font-size: 14px; }

/* ---------- Display names ---------- */
.msg-handle { color: var(--muted); font-size: 12px; font-weight: 400; }
.field-note { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
.field-note.lock { color: var(--amber); }
input:disabled { opacity: .6; cursor: not-allowed; }

/* ---------- Modal (profile window) ---------- */
.modal {
  position: fixed; inset: 0; z-index: 40;
  display: grid; place-items: center; padding: 18px;
  background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);

.modal-card {

.modal-card h3 { font-size: 20px; }
.modal-card .muted { color: var(--muted); font-size: 14px; }
.modal-card .bio { margin: 6px 0 10px; max-width: 320px; overflow-wrap: anywhere; }
.modal-card .form { width: 100%; text-align: left; }
.modal-card .btn { width: 100%; }

.swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.swatch {
  width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; padding: 0;
}
.swatch.selected { border-color: #fff; }

/* ---------- Toasts ---------- */
.toasts {
  position: fixed; z-index: 60; top: 14px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; gap: 8px; width: min(92vw, 420px); pointer-events: none;
}
.toast {
  background: var(--bg-4); border: 1px solid var(--line); border-radius: 12px;
  padding: 11px 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
  animation: pop .2s ease-out; transition: opacity .4s;

.toast.error { border-color: rgba(242, 63, 67, .6); }
.toast.success { border-color: rgba(35, 165, 90, .6); }
.toast.out { opacity: 0; }

.overlay { display: none; }
.only-mobile { display: none; }

/** Build an HTML element safely. Text is always inserted as plain text (no HTML injection). */
function el(tag, opts = {}, ...kids) {
  const node = document.createElement(tag);
  if (opts.class) node.className = opts.class;
  if (opts.id) node.id = opts.id;
  if (opts.text !== undefined) node.textContent = opts.text;
  if (opts.style) Object.assign(node.style, opts.style);
  if (opts.attrs) for (const [k, v] of Object.entries(opts.attrs)) node.setAttribute(k, v);
  if (opts.on) for (const [k, v] of Object.entries(opts.on)) node.addEventListener(k, v);
  kids.flat().forEach((kid) => { if (kid) node.append(kid); });
  return node;
}

// ---------- Photos: resizing, uploading and private links ----------
/** Shrinks a picture from the person's device and turns it into a JPEG (this also removes hidden location data). */
async function prepareImage(file, { square = false, maxSide = CHAT_IMG_MAX } = {}) {
  if (!ALLOWED_IMG.includes(file.type)) throw new Error('Please choose a JPG, PNG, WebP or GIF picture.');
  if (file.size > MAX_INPUT_BYTES) throw new Error('That picture is too big. The limit is 15 MB.');

  let source;
  try {
    source = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch (e1) {
    try {
      const tmpUrl = URL.createObjectURL(file);
      source = new Image();
      source.src = tmpUrl;
      await source.decode();
      URL.revokeObjectURL(tmpUrl);
    } catch (e2) { throw new Error('That picture could not be opened. Try a different one.'); }
  }
  const sw = source.width, sh = source.height;
  if (!sw || !sh) throw new Error('That picture could not be opened. Try a different one.');

  const draw = (limit, quality) => new Promise((resolve, reject) => {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    if (square) {
      const side = Math.min(sw, sh);
      canvas.width = canvas.height = AVATAR_PX;
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, AVATAR_PX, AVATAR_PX);
      ctx.drawImage(source, (sw - side) / 2, (sh - side) / 2, side, side, 0, 0, AVATAR_PX, AVATAR_PX);
    } else {
      const scale = Math.min(1, limit / Math.max(sw, sh));
      canvas.width = Math.max(1, Math.round(sw * scale));
      canvas.height = Math.max(1, Math.round(sh * scale));
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
    }
    canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('That picture could not be prepared.'))), 'image/jpeg', quality);
  });

  let blob = await draw(maxSide, 0.86);
  if (blob.size > 4.5 * 1024 * 1024) blob = await draw(Math.min(maxSide, 1280), 0.65); // keep under the 5 MB storage limit
  if (source.close) source.close();
  return { blob, url: URL.createObjectURL(blob) };
}

// Photos sent in chats are PRIVATE. We ask Supabase for a temporary link (valid 1 hour) for each one.
const signedLinks = new Map();   // photo path -> { url, until }
const pendingLinks = new Map();  // photo path -> request already in progress

function getChatImageUrl(path) {
  const hit = signedLinks.get(path);
  if (hit && hit.until > Date.now()) return Promise.resolve(hit.url);
  if (pendingLinks.has(path)) return pendingLinks.get(path);
  const request = db.storage.from('chat-images').createSignedUrl(path, 3600)
    .then(({ data, error }) => {
      if (error || !data) throw error || new Error('no link');
      signedLinks.set(path, { url: data.signedUrl, until: Date.now() + 50 * 60 * 1000 });
      return data.signedUrl;
    })
    .finally(() => pendingLinks.delete(path));
  pendingLinks.set(path, request);
  return request;
}

function openLightbox(src) {

/** A photo inside a message. Shows a placeholder until the private link arrives and the picture loads. */
function renderImage(path) {
  const img = el('img', { class: 'msg-img loading', attrs: { alt: 'Photo', draggable: 'false' } });
  const failed = () => img.replaceWith(el('div', { class: 'msg-img-fail', text: '📷 Photo unavailable' }));
  let retried = false;
  img.addEventListener('load', () => {
    img.classList.remove('loading');
    if (state.stick) scrollToBottom();      // keep the newest message in view as the picture appears
  });
  img.addEventListener('error', () => {
    if (retried) { failed(); return; }
    retried = true;                          // the link may have expired: ask for a fresh one once
    signedLinks.delete(path);
    getChatImageUrl(path).then((url) => { img.src = url; }).catch(failed);
  });
  img.addEventListener('click', () => openLightbox(img.currentSrc || img.src));
  getChatImageUrl(path).then((url) => { img.src = url; }).catch(failed);
  return img;
}

  if (/display_name|username_changed_at/.test(message || '')) {

  return message;
}

/** Turns message text into text + animated emoticon images. Only known emoticon names are accepted. */
function renderContent(content) {
  const box = el('div', { class: 'msg-text' });
  const leftover = content.replace(MINICON_TOKEN, (all, id) => (MINICON_NAMES.has(id) ? '' : all)).trim();
  const onlyEmoticons = leftover === '';
  let last = 0;
  for (const match of content.matchAll(MINICON_TOKEN)) {
    const id = match[1];
    if (!MINICON_NAMES.has(id)) continue;
    if (match.index > last) box.append(document.createTextNode(content.slice(last, match.index)));
    box.append(el('img', {
      class: 'mc' + (onlyEmoticons ? ' mc-big' : ''),
      attrs: { src: MINICONS_BASE + id + '.svg', alt: MINICON_NAMES.get(id), title: MINICON_NAMES.get(id), loading: 'lazy', draggable: 'false' },
    }));
    last = match.index + match[0].length;
  }
  if (last < content.length) box.append(document.createTextNode(content.slice(last)));
  return box;
}

function dayKey(d) { return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
function formatDay(d) {

}

function keyLooksSecret(key) {

  try {

      const json = JSON.parse(atob(part.replace(/-/g, '+').replace(/_/g, '/')));
      return json.role === 'service_role';
    }
  } catch (e) { /* not a JWT-style key, that is fine */ }
  return false;
}

// ---------- Friendly error messages ----------
function friendlyAuthError(error) {
  const msg = (error && error.message) || '';
  if (/invalid login credentials/i.test(msg)) return 'Wrong username or password.';
  if (/email not confirmed/i.test(msg)) return 'Your account still needs confirming. The site owner must turn off "Confirm email" in Supabase (Authentication, Sign In / Providers, Email).';
  if (/already registered|already been registered/i.test(msg)) return 'That username is taken. Please pick another one.';
  if (/rate limit|too many/i.test(msg)) return 'Too many attempts. Please wait a few minutes and try again.';
  if (/password/i.test(msg) && /(short|least|weak)/i.test(msg)) return 'Please choose a longer, stronger password (8+ characters).';
  if (/invalid.*email|email.*invalid|not authorized/i.test(msg)) return 'Supabase did not accept the sign-up address. Tell the site owner: change LOGIN_DOMAIN in index.html. (' + msg + ')';
  if (/network|fetch/i.test(msg)) return 'Could not reach the server. Check your internet connection.';
  return msg || 'Something went wrong. Please try again.';
}

function friendlySendError(error) {
  const msg = (error && error.message) || '';
  if (/slow down|limit reached|repeat the same|invalid photo/i.test(msg)) return msg;
  if (/row-level security/i.test(msg)) return 'You are not allowed to send that message.';
  if (/content_length/i.test(msg)) return 'Messages must be between 1 and ' + MAX_LEN + ' characters.';
  return 'Message not sent. Please try again.';
}

function setBusy(form, busy, busyText = 'Please wait…') {

  else if (btn.dataset.label) { btn.textContent = btn.dataset.label; }
  btn.disabled = busy;
}

/** Removes unwanted characters while the person types or pastes (bad = a pattern of forbidden characters). */
function restrictInput(input, bad) {
  const clean = () => {
    const cleaned = input.value.replace(bad, '');
    if (cleaned === input.value) return;
    let pos = null;
    try { pos = input.selectionStart; } catch (e) { /* some input types do not allow this */ }
    const removed = input.value.length - cleaned.length;
    input.value = cleaned;
    if (pos !== null) {
      try { input.setSelectionRange(Math.max(pos - removed, 0), Math.max(pos - removed, 0)); } catch (e) { /* ignore */ }
    }
  };
  input.addEventListener('input', (e) => { if (!e.isComposing) clean(); });
  input.addEventListener('compositionend', clean);
}

async function handleLogin(e) {
  e.preventDefault();
  const form = e.currentTarget;
  const err = $('#login-error');
  err.textContent = '';

  const wait = Math.ceil((state.lockUntil - Date.now()) / 1000);
  if (wait > 0) { err.textContent = 'Too many tries. Please wait ' + wait + ' seconds.'; return; }

  const username = $('#login-username').value.trim();
  const password = $('#login-password').value;
  if (!username || !password) { err.textContent = 'Please enter your username and password.'; return; }
  if (!USERNAME_RE.test(username)) { err.textContent = 'Wrong username or password.'; return; }

  setBusy(form, true, 'Logging in…');
  // Find the private sign-in address for this username (it keeps working even after a username change).
  let loginEmail = toLoginEmail(username);
  try {
    const found = await db.rpc('login_email', { check_name: username });
    if (found && typeof found.data === 'string' && found.data) loginEmail = found.data;
  } catch (e) { /* if the lookup is not available, fall back to the original address */ }
  const { error } = await db.auth.signInWithPassword({ email: loginEmail, password });
  setBusy(form, false);

  if (error) {
    state.failCount += 1;
    if (state.failCount >= 5) { state.lockUntil = Date.now() + 30000; state.failCount = 0; }
    err.textContent = friendlyAuthError(error);
    return;
  }
  state.failCount = 0;
  form.reset();
  // The onAuthStateChange listener below starts the app.
}

async function handleSignup(e) {
  e.preventDefault();
  const form = e.currentTarget;
  const err = $('#signup-error');
  const info = $('#signup-info');
  err.textContent = '';
  info.hidden = true;

  // Bot trap: real people never fill this hidden box.
  if ($('#signup-website').value) return;

  const username = $('#signup-username').value.trim();
  const display = $('#signup-display').value.trim().slice(0, 30);
  const password = $('#signup-password').value;

  if (!USERNAME_RE.test(username)) {
    err.textContent = 'Username must be 3-20 characters: letters, numbers and _ only.'; return;
  }
  if (password.length < 8) { err.textContent = 'Password must be at least 8 characters.'; return; }

  setBusy(form, true, 'Creating account…');

  const check = await db.rpc('username_available', { check_name: username });
  if (check.error) {
    setBusy(form, false);
    err.textContent = 'Could not check the username. Did you run supabase.sql? (' + check.error.message + ')';
    return;
  }
  if (check.data === false) {
    setBusy(form, false);
    err.textContent = 'That username is taken. Please pick another one.';
    return;
  }

  const { data, error } = await db.auth.signUp({
    email: toLoginEmail(username),
    password,
    options: { data: display ? { username, display_name: display } : { username } },
  });
  setBusy(form, false);

  if (error) { err.textContent = friendlyAuthError(error); return; }

  // Supabase returns a user with no identities when the account already exists.
  if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
    err.textContent = 'That username is taken. Please pick another one.';
    return;
  }

  if (!data.session) {
    info.hidden = false;
    info.textContent = '✅ Account created! You can log in now.';
    form.reset();
  } else {
    form.reset(); // logged in straight away -> listener starts the app
  }
}

async function fetchOwnProfile(userId) {
  // The profile is created by a database trigger a moment after sign-up, so retry briefly.
  for (let i = 0; i < 6; i++) {
    const { data } = await db.from('profiles').select('*').eq('id', userId).maybeSingle();
    if (data) return data;
    await new Promise((r) => setTimeout(r, 450));
  }
  return null;
}

async function startApp(user) {
  if (state.user && state.user.id === user.id) return;
  state = freshState();
  state.user = user;
  showApp();

  const profile = await fetchOwnProfile(user.id);
  if (!profile) {
    toast('Could not load your profile. Did you run supabase.sql?', 'error');
    await db.auth.signOut();
    return;
  }
  state.profile = profile;
  state.profiles.set(profile.id, profile);
  renderMe();

  await loadUsers();
  subscribeRealtime();
  joinPresence();
  joinCallChannel();
  await openChat('global');
}

function stopApp() {
  leaveCall(true);
  if (db) {
    if (callChannel) db.removeChannel(callChannel);
    callChannel = null;
    callPeople = new Map();
    if (state.dbChannel) db.removeChannel(state.dbChannel);
    if (state.presenceChannel) db.removeChannel(state.presenceChannel);
  }
  clearPendingImage();
  signedLinks.clear();
  state = freshState();
  $('#messages').replaceChildren();
  $('#user-list').replaceChildren();
  $('#app').classList.remove('sidebar-open');
  closeModal();
  document.title = 'ChatWorld';
}

async function logout() {
  await db.auth.signOut();
  stopApp();
  showAuth();
}

    .from('profiles')
    .select('id, username, display_name, bio, avatar_color, avatar_path')
    .order('username', { ascending: true })
    .limit(1000);
  if (error) { toast('Could not load people: ' + withPhotoHint(error.message), 'error'); return; }
  data.forEach((p) => state.profiles.set(p.id, p));
  renderUsers();
}

  }, avatar, el('span', { class: 'name', text: name }), badge ? el('span', { class: 'badge', text: badge > 99 ? '99+' : String(badge) }) : null);
  return item;
}

function renderUsers() {
  const list = $('#user-list');
  const keepScroll = list.scrollTop;
  list.replaceChildren();

  // Global chat
  list.append(el('div', { class: 'section-label', text: 'Public' }));
  list.append(chatItem({
    key: 'global',
    avatar: globeIcon(),
    name: 'Global Chat',
    badge: state.unread.get('global') || 0,
    onClick: () => openChat('global'),
  }));

  // Global Call (voice) sits right under Global Chat
  const callCount = callPeople.size;
  list.append(el('button', {
    class: 'chat-item' + (call ? ' in-call' : ''),
    attrs: { type: 'button' },
    on: { click: () => {
      closeSidebar();
      if (call) toast('You are already in the call. Use the Leave button on the call window.');
      else openCallConfirm();
    } },
  }, phoneIcon(), el('span', { class: 'name', text: 'Global Call' }),
  callCount ? el('span', { class: 'call-count', text: callCount + ' in call' }) : null));

  const term = state.search.trim().toLowerCase();
  const others = [...state.profiles.values()]
    .filter((p) => p.id !== state.user.id && (!term || p.username.toLowerCase().includes(term) || nameOf(p).toLowerCase().includes(term)));
  const on = others.filter((p) => state.online.has(p.id)).sort(byName);
  const off = others.filter((p) => !state.online.has(p.id)).sort(byName);

  const personItem = (p, isOnline) => {
    const wrap = el('span', { class: 'avatar-wrap' }, makeAvatar(p), isOnline ? el('span', { class: 'status-dot' }) : null);
    return chatItem({
      key: p.id, avatar: wrap, name: nameOf(p), online: isOnline,
      badge: state.unread.get(p.id) || 0,
      onClick: () => openChat('dm', p.id),
    });
  };

  list.append(el('div', { class: 'section-label', text: 'Online — ' + on.length }));
  if (on.length) on.forEach((p) => list.append(personItem(p, true)));
  else list.append(el('div', { class: 'empty-note', text: term ? 'No one found.' : 'No one else is online right now.' }));

  list.append(el('div', { class: 'section-label', text: 'Offline — ' + off.length }));
  off.forEach((p) => list.append(personItem(p, false)));

  list.scrollTop = keepScroll;
}

// =====================================================================
//  PRESENCE  (who is online right now)
// =====================================================================
function joinPresence() {
  const channel = db.channel('chatworld-presence', {
    config: { presence: { key: state.user.id } },
  });

  channel
    .on('presence', { event: 'sync' }, () => {
      state.online = new Set(Object.keys(channel.presenceState()));
      state.online.add(state.user.id);
      renderUsers();
      updateHeaderSub();
    })
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        await channel.track({ username: state.profile.username, at: new Date().toISOString() });
      }
    });

  state.presenceChannel = channel;
}

// =====================================================================
//  REAL-TIME DATABASE EVENTS  (new messages, new people, profile changes)
// =====================================================================
function subscribeRealtime() {
  const channel = db.channel('chatworld-db');

  channel
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' },
      (payload) => onNewMessage(payload.new))
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'profiles' },
      (payload) => { state.profiles.set(payload.new.id, payload.new); renderUsers(); })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles' },
      (payload) => {
        state.profiles.set(payload.new.id, payload.new);
        if (payload.new.id === state.user.id) { state.profile = payload.new; renderMe(); }
        renderUsers(); renderHeader(); renderMessages();
      })
    .subscribe((status) => {
      if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
        state.rtWasDown = true;
        toast('Live connection lost. Reconnecting…', 'error');
      } else if (status === 'SUBSCRIBED' && state.rtWasDown) {
        state.rtWasDown = false;
        toast('Back online.', 'success');
        loadMessages(); // catch up on anything we missed
      }
    });

  state.dbChannel = channel;
}

function onNewMessage(m) {
  const key = messageKey(m);
  if (!key) return;
  const mine = m.sender_id === state.user.id;

  if (key === chatKey()) {
    addMessage(m);
    if (document.hidden && !mine) { state.awayCount += 1; updateTitle(); }
  } else if (!mine) {
    state.unread.set(key, (state.unread.get(key) || 0) + 1);
    renderUsers();
    updateTitle();
  }
}

function updateTitle() {
  let total = state.awayCount;
  state.unread.forEach((n) => { total += n; });
  document.title = (total > 0 ? '(' + total + ') ' : '') + 'ChatWorld';
}

// =====================================================================
//  OPENING A CHAT + MESSAGE HISTORY
// =====================================================================
async function openChat(type, id = null) {
  state.chat = { type, id };
  clearPendingImage();   // a photo chosen for one chat is not carried over to another
  state.stick = true;
  state.unread.delete(type === 'global' ? 'global' : id);
  state.messages = [];
  state.seen = new Set();
  state.hasMore = false;
  closeSidebar();
  renderHeader();
  renderUsers();
  updateTitle();

  const name = type === 'global' ? 'Global Chat' : nameOf(profileOf(id));
  $('#message-input').placeholder = 'Message ' + name;

  $('#messages').replaceChildren(el('div', { class: 'empty' }, el('span', { class: 'big', text: '⏳' }), el('span', { text: 'Loading messages…' })));
  await loadMessages();

  if (window.matchMedia('(pointer: fine)').matches) $('#message-input').focus();
}

function fetchMessages(before = null) {
  let q = db.from('messages')
    .select('id, sender_id, recipient_id, content, image_path, created_at')
    .order('created_at', { ascending: false })
    .limit(PAGE_SIZE);
  if (before) q = q.lt('created_at', before);

  if (state.chat.type === 'global') {
    q = q.is('recipient_id', null);
  } else {
    const me = state.user.id;
    const other = state.chat.id;
    q = q.or(`and(sender_id.eq.${me},recipient_id.eq.${other}),and(sender_id.eq.${other},recipient_id.eq.${me})`);
  }
  return q;
}

async function loadMessages() {
  const token = ++state.loadToken;
  const { data, error } = await fetchMessages();
  if (token !== state.loadToken) return; // the user already opened another chat

  if (error) {
    $('#messages').replaceChildren(el('div', { class: 'empty' }, el('span', { class: 'big', text: '⚠️' }),
      el('span', { text: 'Could not load messages: ' + withPhotoHint(error.message) })));
    return;
  }

  await ensureProfiles(data.map((m) => m.sender_id));
  if (token !== state.loadToken) return;

  state.messages = data.slice().reverse();
  state.seen = new Set(state.messages.map((m) => m.id));
  state.hasMore = data.length === PAGE_SIZE;
  renderMessages();
  scrollToBottom();
}

async function loadOlder() {
  const oldest = state.messages[0];
  if (!oldest) return;
  const token = state.loadToken;
  const { data, error } = await fetchMessages(oldest.created_at);
  if (token !== state.loadToken) return;
  if (error) { toast('Could not load older messages.', 'error'); return; }

  await ensureProfiles(data.map((m) => m.sender_id));
  const box = $('#messages');
  const oldHeight = box.scrollHeight;
  const oldTop = box.scrollTop;

  const older = data.slice().reverse().filter((m) => !state.seen.has(m.id));
  older.forEach((m) => state.seen.add(m.id));
  state.messages = [...older, ...state.messages];
  state.hasMore = data.length === PAGE_SIZE;
  renderMessages();
  box.scrollTop = box.scrollHeight - oldHeight + oldTop;
}

function renderHeader() {
  const box = $('#chat-title');
  box.replaceChildren();
  box.classList.remove('clickable');
  box.onclick = null;

  if (state.chat.type === 'global') {
    box.append(
      globeIcon(),
      el('div', { class: 'title-text' }, el('h2', { text: 'Global Chat' }), el('p', { id: 'chat-sub' })),
    );
  } else {
    const p = profileOf(state.chat.id);
    box.append(
      makeAvatar(p, 'sm'),
      el('div', { class: 'title-text' }, el('h2', { text: nameOf(p) }), el('p', { id: 'chat-sub' })),
    );
    box.classList.add('clickable');
    box.onclick = () => openProfile(p.id);
  }
  updateHeaderSub();
}

function updateHeaderSub() {
  const count = Math.max(state.online.size, 1);
  $('#online-count').textContent = count + ' online';
  const sub = $('#chat-sub');
  if (!sub) return;
  if (state.chat.type === 'global') {
    sub.textContent = 'Public room · everyone can read and write here';
  } else {
    const p = profileOf(state.chat.id);
    const status = state.online.has(p.id) ? '🟢 Online' : '⚪ Offline';
    const handle = '@' + p.username;
    sub.textContent = p.bio ? status + ' · ' + handle + ' · ' + p.bio : status + ' · ' + handle + ' · Private conversation';
  }
}

function emptyState() {
  const isGlobal = state.chat.type === 'global';
  return el('div', { class: 'empty' },
    el('span', { class: 'big', text: isGlobal ? '💬' : '👋' }),
    el('strong', { text: isGlobal ? 'Welcome to ChatWorld!' : 'Say hello to ' + nameOf(profileOf(state.chat.id)) }),
    el('span', { text: isGlobal ? 'Be the first to say something to the world.' : 'This is the start of your private conversation.' }),
  );
}

function buildMessageNodes(m, prev) {
  const nodes = [];
  const when = new Date(m.created_at);

  const newDay = !prev || dayKey(new Date(prev.created_at)) !== dayKey(when);
  if (newDay) nodes.push(el('div', { class: 'day-divider', text: formatDay(when) }));

  const grouped = !newDay && prev && prev.sender_id === m.sender_id &&
    (when - new Date(prev.created_at)) < 5 * 60 * 1000;

  const p = profileOf(m.sender_id);
  const mine = m.sender_id === state.user.id;
  const row = el('div', { class: 'msg' + (grouped ? ' grouped' : '') + (mine ? ' mine' : '') });

  if (grouped) {
    row.append(el('span', { class: 'msg-gutter', text: formatTime(m.created_at) }));
  } else {
    row.append(el('button', {
      class: 'msg-avatar', attrs: { type: 'button', 'aria-label': 'View profile of ' + nameOf(p) },
      on: { click: () => openProfile(p.id) },
    }, makeAvatar(p)));
  }

  const body = el('div', { class: 'msg-body' });
  if (!grouped) {
    body.append(el('div', { class: 'msg-head' },
      el('button', { class: 'msg-author', text: nameOf(p), attrs: { type: 'button' }, on: { click: () => openProfile(p.id) } }),
      p.display_name ? el('span', { class: 'msg-handle', text: '@' + p.username }) : null,
      el('span', { class: 'msg-time', text: formatTime(m.created_at) }),
    ));
  }
  if (m.content) body.append(renderContent(m.content)); // text is added as plain text => safe from HTML injection
  if (m.image_path) body.append(renderImage(m.image_path));
  row.append(body);

  nodes.push(row);
  return nodes;
}

function renderMessages() {
  const box = $('#messages');
  box.replaceChildren();

  if (state.hasMore) {
    box.append(el('button', { class: 'load-more', text: 'Load older messages', attrs: { type: 'button' }, on: { click: loadOlder } }));
  }
  if (!state.messages.length) { box.append(emptyState()); return; }

  let prev = null;
  for (const m of state.messages) {
    box.append(...buildMessageNodes(m, prev));
    prev = m;
  }
}

function scrollToBottom() {
  const box = $('#messages');
  box.scrollTop = box.scrollHeight;
}

async function addMessage(m) {
  if (state.seen.has(m.id)) return;
  await ensureProfiles([m.sender_id]);
  if (state.seen.has(m.id)) return;            // may have arrived while we waited
  if (messageKey(m) !== chatKey()) return;     // user switched chats meanwhile
  state.seen.add(m.id);

  const box = $('#messages');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  const prev = state.messages[state.messages.length - 1] || null;
  state.messages.push(m);

  const empty = box.querySelector('.empty');
  if (empty) empty.remove();
  box.append(...buildMessageNodes(m, prev));

  if (nearBottom || m.sender_id === state.user.id) scrollToBottom();
}

// =====================================================================
//  SENDING MESSAGES
// =====================================================================
function clearPendingImage(keepUrl = false) {
  if (state.pendingImage && !keepUrl) URL.revokeObjectURL(state.pendingImage.url);
  state.pendingImage = null;
  $('#attach-preview').hidden = true;
  $('#attach-thumb').removeAttribute('src');
}

async function choosePhotoForChat(file) {
  if (!file) return;
  try {
    const prepared = await prepareImage(file, { maxSide: CHAT_IMG_MAX });
    clearPendingImage();
    state.pendingImage = prepared;
    $('#attach-thumb').src = prepared.url;
    $('#attach-preview').hidden = false;
    $('#message-input').focus();
  } catch (err) {
    toast(err.message || 'That picture could not be used.', 'error');
  }
}

function friendlyUploadError(error) {
  const msg = (error && error.message) || '';
  if (/row-level security|violates|unauthorized|not allowed/i.test(msg)) return 'Photo not sent. You may be sending too many photos. Wait a minute and try again.';
  if (/size|too large|exceed/i.test(msg)) return 'That photo is too big to send.';
  if (/bucket/i.test(msg)) return 'Photos are not set up yet. Run supabase-photos.sql in Supabase (see README.md).';
  return 'Photo upload failed. Please try again.';
}

async function sendMessage(textOverride) {
  const input = $('#message-input');
  const usingImage = typeof textOverride !== 'string' && state.pendingImage ? state.pendingImage : null;
  const text = (typeof textOverride === 'string' ? textOverride : input.value).trim();
  if ((!text && !usingImage) || state.sending) return;

  if (text.length > MAX_LEN) { toast('Messages can be up to ' + MAX_LEN + ' characters.', 'error'); return; }

  if (Date.now() - state.lastSendAt < MIN_SEND_GAP_MS) {
    toast('Easy there! Wait a moment before sending again.');
    return;
  }

  state.sending = true;
  $('#send-btn').disabled = true;

  // Remember where this message is going, in case the person switches chats while a photo uploads.
  const recipient = state.chat.type === 'dm' ? state.chat.id : null;

  let imagePath = null;
  if (usingImage) {
    const me = state.user.id;
    imagePath = (recipient ? 'dm/' + me + '/' + recipient : 'global/' + me) + '/' + randomFileName();
    const up = await db.storage.from('chat-images')
      .upload(imagePath, usingImage.blob, { contentType: 'image/jpeg', cacheControl: '3600', upsert: false });
    if (up.error) {
      state.sending = false;
      $('#send-btn').disabled = false;
      toast(friendlyUploadError(up.error), 'error');
      return;
    }
  }

  const row = {
    sender_id: state.user.id,
    recipient_id: recipient,
    content: text,
  };
  if (imagePath) row.image_path = imagePath;
  const { data, error } = await db.from('messages').insert(row).select().single();

  state.sending = false;
  $('#send-btn').disabled = false;

  if (error) { toast(friendlySendError(error), 'error'); return; }

  state.lastSendAt = Date.now();
  if (typeof textOverride !== 'string') { input.value = ''; autosize(); }
  if (usingImage) {
    // Show our own photo straight away from this device (no need to download it again).
    signedLinks.set(imagePath, { url: usingImage.url, until: Date.now() + 50 * 60 * 1000 });
    if (state.pendingImage === usingImage) clearPendingImage(true);
  }
  addMessage(data); // the real-time event for the same message is ignored (already seen)
}

function autosize() {
  const ta = $('#message-input');
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';

  const left = MAX_LEN - ta.value.length;
  const counter = $('#char-count');
  if (left <= 150) {
    counter.textContent = left + ' characters left';
    counter.className = left <= 30 ? 'warn' : '';
  } else {
    counter.textContent = '';
  }
}

// =====================================================================
//  PROFILE WINDOW
// =====================================================================
function openProfile(id) {
  const mine = id === state.user.id;
  const p = mine ? state.profile : state.profiles.get(id);
  if (!p) return;

  const card = $('#modal-card');
  card.replaceChildren();
  const closeBtn = el('button', {
    class: 'icon-btn modal-close', text: '✕',
    attrs: { type: 'button', 'aria-label': 'Close' }, on: { click: closeModal },
  });

  if (!mine) {
    card.append(
      closeBtn,
      makeAvatar(p, 'xl'),
      el('h3', { text: nameOf(p) }),
      el('p', { class: 'muted', text: '@' + p.username }),
      el('p', { class: 'muted', text: state.online.has(p.id) ? '🟢 Online now' : '⚪ Offline' }),
      el('p', { class: 'bio', text: p.bio || 'This person has not written a bio yet.' }),
      el('button', {
        class: 'btn btn-primary', text: 'Send a private message', attrs: { type: 'button' },
        on: { click: () => { closeModal(); openChat('dm', p.id); } },
      }),
    );
  } else {
    let chosen = safeColor(p.avatar_color);
    let newPhoto = null;        // a photo picked now, saved when "Save profile" is pressed
    let removePhoto = false;    // true = the person pressed "Remove photo"
    const hadPhoto = !!p.avatar_path;
    const shownProfile = () => ({
      username: (nameInput.value.trim() || p.username || '?'),
      display_name: displayInput.value.trim() || null,
      avatar_color: chosen,
      avatar_path: removePhoto ? null : p.avatar_path,
      avatar_preview: newPhoto ? newPhoto.url : null,
    });
    const preview = el('span', { id: 'edit-avatar-slot' }, makeAvatar({ username: p.username, display_name: p.display_name, avatar_color: chosen, avatar_path: p.avatar_path }, 'xl'));

    const nameInput = el('input', { attrs: { type: 'text', id: 'edit-username', maxlength: '20', autocomplete: 'off' } });
    nameInput.value = p.username;
    restrictInput(nameInput, NOT_USERNAME_CHAR);

    // Username can only be changed once every 5 days (the database enforces this too).
    const LOCK_MS = 5 * 24 * 60 * 60 * 1000;
    const lockUntil = p.username_changed_at ? new Date(p.username_changed_at).getTime() + LOCK_MS : 0;
    const usernameLocked = lockUntil > Date.now();
    if (usernameLocked) nameInput.disabled = true;
    const usernameNote = el('p', {
      class: 'field-note' + (usernameLocked ? ' lock' : ''),
      text: usernameLocked
        ? '🔒 You can change your username again on ' + new Date(lockUntil).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) + '.'
        : 'This is the name you log in with. You can change it once every 5 days.',
    });

    const displayInput = el('input', { attrs: { type: 'text', id: 'edit-display', maxlength: '30', autocomplete: 'off', placeholder: 'How your name appears in chat (optional)' } });
    displayInput.value = p.display_name || '';
    displayInput.addEventListener('input', () => refreshPreview());
    const bioInput = el('textarea', { attrs: { id: 'edit-bio', rows: '3', maxlength: '160', placeholder: 'Tell people about yourself (160 characters)' } });
    bioInput.value = p.bio || '';
    const errorP = el('p', { class: 'form-error', attrs: { role: 'alert' } });

    const photoInput = el('input', { attrs: { type: 'file', accept: 'image/jpeg,image/png,image/webp,image/gif', hidden: '' } });
    const photoBtn = el('button', { class: 'btn btn-ghost', attrs: { type: 'button' }, on: { click: () => photoInput.click() } });
    const removeBtn = el('button', { class: 'btn btn-ghost', text: 'Remove photo', attrs: { type: 'button' } });
    const refreshPreview = () => {
      preview.replaceChildren(makeAvatar(shownProfile(), 'xl'));
      const hasPhoto = !!newPhoto || (hadPhoto && !removePhoto);
      photoBtn.textContent = hasPhoto ? 'Change photo' : 'Upload photo';
      removeBtn.hidden = !hasPhoto;
    };
    photoInput.addEventListener('change', async () => {
      const file = photoInput.files[0];
      photoInput.value = '';
      if (!file) return;
      errorP.textContent = '';
      try {
        const prepared = await prepareImage(file, { square: true });
        if (newPhoto) URL.revokeObjectURL(newPhoto.url);
        newPhoto = prepared; removePhoto = false;
        refreshPreview();
      } catch (err) { errorP.textContent = err.message || 'That picture could not be used.'; }
    });
    removeBtn.addEventListener('click', () => {
      if (newPhoto) { URL.revokeObjectURL(newPhoto.url); newPhoto = null; }
      removePhoto = hadPhoto;
      refreshPreview();
    });
    nameInput.addEventListener('input', refreshPreview);

    const swatches = el('div', { class: 'swatches' });
    COLORS.forEach((c) => {
      const s = el('button', {
        class: 'swatch' + (c === chosen ? ' selected' : ''),
        style: { background: c }, attrs: { type: 'button', 'aria-label': 'Colour ' + c },
        on: {
          click: () => {
            chosen = c;
            swatches.querySelectorAll('.swatch').forEach((x) => x.classList.remove('selected'));
            s.classList.add('selected');
            refreshPreview();
          },
        },
      });
      swatches.append(s);
    });

    const saveBtn = el('button', { class: 'btn btn-primary', text: 'Save profile', attrs: { type: 'submit' } });
    const form = el('form', { class: 'form', attrs: { novalidate: '' } },
      el('label', { text: 'Profile photo' }),
      el('div', { class: 'photo-actions' }, photoBtn, removeBtn, photoInput),
      el('label', { text: 'Display name', attrs: { for: 'edit-display' } }), displayInput,
      el('p', { class: 'field-note', text: 'Shown in chat instead of your username. Change it any time.' }),
      el('label', { text: 'Username', attrs: { for: 'edit-username' } }), nameInput, usernameNote,
      el('label', { text: 'Bio', attrs: { for: 'edit-bio' } }), bioInput,
      el('label', { text: 'Avatar colour' }), swatches,
      errorP, saveBtn,
    );

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorP.textContent = '';
      const username = nameInput.value.trim();
      const display = displayInput.value.trim();
      const bio = bioInput.value.trim();
      const usernameChanged = !usernameLocked && username !== p.username;

      if (!USERNAME_RE.test(username)) {
        errorP.textContent = 'Username must be 3-20 characters: letters, numbers and _ only.'; return;
      }
      if (display.length > 30) { errorP.textContent = 'Display name can be up to 30 characters.'; return; }

      if (usernameChanged) {
        const sure = window.confirm('Change your username to "' + username + '"?\n\nThis is the name you log in with. ' +
          'You will not be able to change it again for 5 days.');
        if (!sure) return;
      }
      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';

      if (usernameChanged && username.toLowerCase() !== p.username.toLowerCase()) {
        const check = await db.rpc('username_available', { check_name: username });
        if (check.data === false) {
          errorP.textContent = 'That username is taken.';
          saveBtn.disabled = false; saveBtn.textContent = 'Save profile';
          return;
        }
      }

      // Only send what actually changed (this also keeps the 5-day rule from being triggered by accident).
      const changes = { bio, avatar_color: chosen };
      if (usernameChanged) changes.username = username;
      if (display !== (p.display_name || '')) changes.display_name = display || null;
      let uploadedPath = null;
      if (newPhoto) {
        uploadedPath = state.user.id + '/avatar-' + randomFileName();
        const up = await db.storage.from('avatars')
          .upload(uploadedPath, newPhoto.blob, { contentType: 'image/jpeg', cacheControl: '31536000', upsert: false });
        if (up.error) {
          errorP.textContent = /bucket/i.test(up.error.message || '')
            ? 'Photos are not set up yet. Run supabase-photos.sql in Supabase (see README.md).'
            : 'Could not upload the photo. Please try again.';
          saveBtn.disabled = false; saveBtn.textContent = 'Save profile';
          return;
        }
        changes.avatar_path = uploadedPath;
      } else if (removePhoto) {
        changes.avatar_path = null;
      }

      const { data, error } = await db.from('profiles')
        .update(changes)
        .eq('id', state.user.id).select().single();

      saveBtn.disabled = false; saveBtn.textContent = 'Save profile';
      if (error) {
        if (uploadedPath) db.storage.from('avatars').remove([uploadedPath]);   // tidy up the unused upload
        errorP.textContent = error.code === '23505' ? 'That username is taken.'
          : /once every 5 days/i.test(error.message || '') ? error.message
          : /display_name_format/i.test(error.message || '') ? 'Display name must be 1-30 characters with no special control characters.'
          : 'Could not save: ' + withPhotoHint(error.message);
        return;
      }
      // The old photo is no longer used: delete its file (if this fails it does not matter).
      if (p.avatar_path && p.avatar_path !== data.avatar_path) db.storage.from('avatars').remove([p.avatar_path]);

      state.profile = data;
      state.profiles.set(data.id, data);
      renderMe(); renderUsers(); renderHeader(); renderMessages();
      closeModal();
      toast('Profile saved!', 'success');
    });

    refreshPreview();
    card.append(closeBtn, preview, el('h3', { text: 'Your profile' }), form);
  }

  $('#modal').hidden = false;
}

function closeModal() {
  $('#modal').hidden = true;
  $('#modal-card').replaceChildren();
}

// =====================================================================
//  GLOBAL CALL  (group voice call: WebRTC for the audio, Supabase Realtime for signalling)
//  Everyone who joins talks directly to everyone else (peer to peer), so no server
//  handles your voice. Supabase only passes the small "hello, here is how to reach me"
//  notes that let the browsers find each other.
// =====================================================================
const CALL_MAX = 8;   // everyone connects to everyone, so keep the group small
const ICE_SERVERS = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }];
let callChannel = null;          // the Supabase channel used for call notes + "who is in the call"
let call = null;                 // filled in only while I am in the call
let callPeople = new Map();      // everyone in the call right now (id -> info)

function phoneSvg(size) {
  return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>';
}
/** The Global Call icon: a white phone on a purple circle. */
function phoneIcon(size = 20) {
  const icon = el('span', { class: 'phone-icon', attrs: { 'aria-hidden': 'true' } });
  icon.innerHTML = phoneSvg(size);
  return icon;
}

function joinCallChannel() {
  callChannel = db.channel('chatworld-call', { config: { presence: { key: state.user.id } } });
  callChannel
    .on('presence', { event: 'sync' }, onCallPresence)
    .on('broadcast', { event: 'signal' }, ({ payload }) => onCallSignal(payload))
    .subscribe();
}

function onCallPresence() {
  if (!callChannel || !state.user) return;
  callPeople = new Map(Object.entries(callChannel.presenceState()).map(([id, metas]) => [id, metas[0] || {}]));
  renderUsers();
  if (call) { syncPeers(); renderCallPanel(); }
}

const callMeta = () => ({ username: state.profile.username, muted: !!(call && call.muted) });

function sendSignal(to, kind, data) {
  if (!callChannel) return;
  callChannel.send({ type: 'broadcast', event: 'signal', payload: { from: state.user.id, to, kind, data } });
}

// ----- Opening / leaving -----
function openCallConfirm() {
  const n = callPeople.size;
  const card = $('#modal-card');
  card.replaceChildren(
    phoneIcon(26),
    el('h3', { text: 'Start Global Call?' }),
    el('p', { class: 'muted', text: n
      ? n + (n === 1 ? ' person is' : ' people are') + ' in the call right now. Starting joins you to it.'
      : 'A voice call that anyone on ChatWorld can join. Your browser will ask to use your microphone.' }),
    el('div', { class: 'call-actions' },
      el('button', { class: 'btn btn-ghost', text: 'Cancel', attrs: { type: 'button' }, on: { click: closeModal } }),
      el('button', { class: 'btn btn-call', text: 'Start Call', attrs: { type: 'button' }, on: { click: () => { closeModal(); joinCall(); } } }),
    ),
  );
  card.querySelector('.phone-icon').classList.add('big');
  $('#modal').hidden = false;
}

async function joinCall() {
  if (call || !callChannel) return;
  if (callPeople.size >= CALL_MAX) { toast('The call is full (' + CALL_MAX + ' people). Try again soon.', 'error'); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.RTCPeerConnection) {
    toast('This browser cannot do voice calls. Try Chrome, Edge, Firefox or Safari.', 'error'); return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false });
  } catch (e) {
    toast(e && e.name === 'NotAllowedError'
      ? 'Microphone is blocked. Allow the microphone for this site in your browser, then try again.'
      : 'Could not use a microphone. Is one plugged in?', 'error');
    return;
  }
  call = { stream, peers: new Map(), early: new Map(), muted: false, ctx: null, meters: new Map(), speaking: new Set(), timer: null };
  watchSpeaking(state.user.id, stream);
  call.timer = setInterval(checkSpeaking, 200);
  try { await callChannel.track(callMeta()); } catch (e) { /* the sync event will still arrive */ }
  renderCallPanel();
  renderUsers();
  toast('You joined the Global Call.');
}

async function leaveCall(quiet) {
  if (!call) return;
  const c = call;
  call = null;
  clearInterval(c.timer);
  for (const id of [...c.peers.keys()]) closePeer(id, c);
  c.meters.forEach((m) => { try { m.src.disconnect(); } catch (e) { /* ignore */ } });
  c.stream.getTracks().forEach((t) => t.stop());
  if (c.ctx) c.ctx.close().catch(() => {});
  const panel = $('#call-panel'); if (panel) panel.remove();
  if (callChannel) { try { await callChannel.untrack(); } catch (e) { /* ignore */ } }
  if (state.user) renderUsers();
  if (!quiet) toast('You left the Global Call.');
}

function toggleMute() {
  if (!call) return;
  call.muted = !call.muted;
  call.stream.getAudioTracks().forEach((t) => { t.enabled = !call.muted; });
  if (call.muted) call.speaking.delete(state.user.id);
  if (callChannel) callChannel.track(callMeta()).catch(() => {});
  renderCallPanel();
}

// ----- Connecting to the other people (peer to peer) -----
function syncPeers() {
  if (!call) return;
  for (const id of callPeople.keys()) {
    if (id === state.user.id || call.peers.has(id)) continue;
    // To avoid two people calling each other at the same moment, the smaller id always makes the first call.
    if (state.user.id < id) startPeer(id, true);
  }
  for (const id of [...call.peers.keys()]) if (!callPeople.has(id)) closePeer(id);
}

function startPeer(id, initiator) {
  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  const peer = { pc, queue: call.early.get(id) || [], hasRemote: false, audio: null, state: 'connecting' };
  call.early.delete(id);
  call.peers.set(id, peer);
  call.stream.getTracks().forEach((t) => pc.addTrack(t, call.stream));

  pc.onicecandidate = (e) => { if (e.candidate) sendSignal(id, 'ice', e.candidate.toJSON()); };
  pc.ontrack = (e) => {
    if (!peer.audio) { peer.audio = new Audio(); peer.audio.autoplay = true; }
    peer.audio.srcObject = e.streams[0];
    peer.audio.play().catch(() => {});
    watchSpeaking(id, e.streams[0]);
  };
  pc.onconnectionstatechange = () => {
    peer.state = pc.connectionState;
    if (pc.connectionState === 'failed' && call && call.peers.get(id) === peer) {
      closePeer(id);
      toast('Lost connection to someone in the call. Trying again…', 'error');
      setTimeout(syncPeers, 1500);
    }
    renderCallPanel();
  };

  if (initiator) {
    pc.createOffer()
      .then((o) => pc.setLocalDescription(o))
      .then(() => sendSignal(id, 'offer', pc.localDescription.toJSON()))
      .catch((e) => console.warn('Call offer failed', e));
  }
  return peer;
}

function closePeer(id, c = call) {
  const peer = c && c.peers.get(id);
  if (!peer) return;
  c.peers.delete(id);
  try { peer.pc.onconnectionstatechange = null; peer.pc.close(); } catch (e) { /* ignore */ }
  if (peer.audio) { peer.audio.srcObject = null; peer.audio = null; }
  const m = c.meters.get(id);
  if (m) { try { m.src.disconnect(); } catch (e) { /* ignore */ } c.meters.delete(id); }
  c.speaking.delete(id);
  if (c === call) renderCallPanel();
}

async function flushIce(peer) {
  const waiting = peer.queue.splice(0);
  for (const cand of waiting) { try { await peer.pc.addIceCandidate(cand); } catch (e) { /* ignore */ } }
}

async function onCallSignal(m) {
  if (!call || !m || m.to !== state.user.id || typeof m.from !== 'string' || m.from === state.user.id) return;
  if (!/^[0-9a-f-]{36}$/.test(m.from) || !m.data || typeof m.data !== 'object') return;
  const from = m.from;
  try {
    if (m.kind === 'offer') {
      if (call.peers.has(from)) closePeer(from);
      const peer = startPeer(from, false);
      await peer.pc.setRemoteDescription(m.data);
      peer.hasRemote = true;
      await flushIce(peer);
      const answer = await peer.pc.createAnswer();
      await peer.pc.setLocalDescription(answer);
      sendSignal(from, 'answer', peer.pc.localDescription.toJSON());
    } else if (m.kind === 'answer') {
      const peer = call.peers.get(from);
      if (!peer || peer.hasRemote) return;
      await peer.pc.setRemoteDescription(m.data);
      peer.hasRemote = true;
      await flushIce(peer);
    } else if (m.kind === 'ice') {
      const peer = call.peers.get(from);
      if (!peer) {                                   // arrived before the offer: keep it for later
        const list = call.early.get(from) || [];
        if (list.length < 50) { list.push(m.data); call.early.set(from, list); }
      } else if (peer.hasRemote) {
        await peer.pc.addIceCandidate(m.data).catch(() => {});
      } else {
        peer.queue.push(m.data);
      }
    }
  } catch (e) {
    console.warn('Call signal problem', e);
  }
}

// ----- Who is talking (green ring) -----
function watchSpeaking(id, stream) {
  if (!call) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    call.ctx = call.ctx || new Ctx();
    if (call.ctx.state === 'suspended') call.ctx.resume().catch(() => {});
    if (call.meters.has(id)) { try { call.meters.get(id).src.disconnect(); } catch (e) { /* ignore */ } }
    const src = call.ctx.createMediaStreamSource(stream);
    const an = call.ctx.createAnalyser();
    an.fftSize = 512;
    src.connect(an);
    call.meters.set(id, { src, an, data: new Uint8Array(an.fftSize) });
  } catch (e) { /* the call still works without the green rings */ }
}

function checkSpeaking() {
  if (!call) return;
  let changed = false;
  call.meters.forEach((m, id) => {
    m.an.getByteTimeDomainData(m.data);
    let peak = 0;
    for (let i = 0; i < m.data.length; i++) peak = Math.max(peak, Math.abs(m.data[i] - 128));
    const talking = peak > 14 && !(id === state.user.id && call.muted);
    if (talking !== call.speaking.has(id)) { talking ? call.speaking.add(id) : call.speaking.delete(id); changed = true; }
  });
  if (changed) document.querySelectorAll('#call-panel .call-row').forEach((row) => {
    row.classList.toggle('speaking', call.speaking.has(row.dataset.id));
  });
}

// ----- The call window -----
function renderCallPanel() {
  if (!call) return;
  let panel = $('#call-panel');
  if (!panel) { panel = el('div', { id: 'call-panel', class: 'call-panel', attrs: { role: 'region', 'aria-label': 'Global Call' } }); document.body.append(panel); }

  const ids = [...callPeople.keys()].filter((id) => id !== state.user.id).sort();
  ids.unshift(state.user.id);
  const rows = ids.map((id) => {
    const meta = callPeople.get(id) || {};
    const isMe = id === state.user.id;
    const p = state.profiles.get(id) || (isMe ? state.profile : { username: meta.username || '?' });
    const peer = call.peers.get(id);
    const status = isMe ? '' : (peer && peer.state === 'connected' ? '' : ' · connecting…');
    return el('div', { class: 'call-row' + (call.speaking.has(id) ? ' speaking' : ''), attrs: { 'data-id': id } },
      makeAvatar(p, 'sm'),
      el('span', { class: 'call-name', text: nameOf(p) + (isMe ? ' (you)' : '') + status }),
      (isMe ? call.muted : meta.muted) ? el('span', { class: 'call-muted', text: '🔇', attrs: { title: 'Muted' } }) : null,
    );
  });

  panel.replaceChildren(
    el('div', { class: 'call-head' }, phoneIcon(16),
      el('strong', { text: 'Global Call' }),
      el('span', { class: 'muted', text: ids.length + (ids.length === 1 ? ' person' : ' people') })),
    el('div', { class: 'call-list' }, rows),
    el('div', { class: 'call-actions' },
      el('button', { class: 'btn btn-ghost', text: call.muted ? 'Unmute' : 'Mute', attrs: { type: 'button' }, on: { click: toggleMute } }),
      el('button', { class: 'btn btn-leave', text: 'Leave', attrs: { type: 'button' }, on: { click: () => leaveCall() } }),
    ),
  );
}

// =====================================================================
//  MOBILE SIDEBAR
// =====================================================================
function openSidebar() { $('#app').classList.add('sidebar-open'); }
function closeSidebar() { $('#app').classList.remove('sidebar-open'); }

// =====================================================================
//  WIRING EVERYTHING UP
// =====================================================================
function bindUI() {
  // Photos in chat
  $('#attach-btn').addEventListener('click', () => $('#image-input').click());
  $('#image-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    choosePhotoForChat(file);
  });
  $('#attach-remove').addEventListener('click', () => clearPendingImage());
  $('#messages').addEventListener('scroll', (e) => {
    const box = e.currentTarget;
    state.stick = box.scrollHeight - box.scrollTop - box.clientHeight < 160;
  }, { passive: true });
  $('#emoji-btn').addEventListener('click', (e) => { e.stopPropagation(); toggleEmojiPanel(); });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#emoji-panel') && !e.target.closest('#emoji-btn')) closeEmojiPanel();
  });

  // Typing rules: usernames = letters, numbers and _ only. No spaces in emails or passwords.
  restrictInput($('#signup-username'), NOT_USERNAME_CHAR);
  restrictInput($('#login-username'), NOT_USERNAME_CHAR);
  restrictInput($('#signup-password'), ANY_SPACE);
  restrictInput($('#login-password'), ANY_SPACE);

  document.querySelectorAll('.pw-toggle').forEach((btn) => {
    btn.addEventListener('click', () => {
      const input = btn.parentElement.querySelector('input');
      setPwVisible(btn, input.type === 'password');
      input.focus();
    });
  });

  $('#tab-login').addEventListener('click', () => switchTab('login'));
  $('#tab-signup').addEventListener('click', () => switchTab('signup'));

  if (db) {
    $('#login-form').addEventListener('submit', handleLogin);
    $('#signup-form').addEventListener('submit', handleSignup);
  } else {
    $('#login-form').addEventListener('submit', (e) => e.preventDefault());
    $('#signup-form').addEventListener('submit', (e) => e.preventDefault());
  }

  $('#logout-btn').addEventListener('click', logout);
  $('#me-btn').addEventListener('click', () => { if (state.user) openProfile(state.user.id); });
  $('#menu-btn').addEventListener('click', openSidebar);
  $('#sidebar-close').addEventListener('click', closeSidebar);
  $('#overlay').addEventListener('click', closeSidebar);

  $('#user-search').addEventListener('input', (e) => {
    state.search = e.target.value;
    if (state.user) renderUsers();
  });

  // Composer
  const input = $('#message-input');
  $('#composer').addEventListener('submit', (e) => { e.preventDefault(); sendMessage(); });
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', (e) => {
    const isTouch = window.matchMedia('(pointer: coarse)').matches;
    // Enter sends on computers (Shift+Enter = new line). On phones Enter = new line.
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !isTouch) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Modal
  $('#modal').addEventListener('mousedown', (e) => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeModal(); closeSidebar(); closeEmojiPanel();
      document.querySelectorAll('.lightbox').forEach((x) => x.remove());
    }
  });

  // Catch up on messages after the tab was hidden for a while
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { state.hiddenAt = Date.now(); return; }
    state.awayCount = 0;
    updateTitle();
    if (state.user && state.profile && state.hiddenAt && Date.now() - state.hiddenAt > 30000) {
      loadMessages();
    }
  });
}

async function init() {
  bindUI();

  if (!db) {
    showAuth();
    showConfigProblem();
    return;
  }

  // Fallback: if the first auth event is slow or missing, check the session directly.
  setTimeout(async () => {
    if (!$('#splash').hidden) {
      const { data } = await db.auth.getSession();
      if (data && data.session) startApp(data.session.user);
      else showAuth();
    }
  }, 2500);

  // Runs whenever someone logs in or out (also when the page first opens).
  db.auth.onAuthStateChange((event, session) => {
    // setTimeout avoids a known Supabase deadlock when calling the database from inside this callback.
    setTimeout(() => {
      if (session && session.user) {
        startApp(session.user);
      } else if (event === 'SIGNED_OUT' || event === 'INITIAL_SESSION') {
        stopApp();
        showAuth();
      }
    }, 0);
  });
}

init();

</script>

<!-- Safety net: if the app has not started after 4 seconds, explain why -->
<script>
  setTimeout(function () {
    var s = document.getElementById('splash');
    if (s && !s.hidden) {
      s.innerHTML = '<div style="text-align:center;padding:24px;max-width:430px;line-height:1.55">' +
        '<p style="font-size:18px;font-weight:700;margin:10px 0">ChatWorld could not start</p>' +
        '<p style="color:#9aa1ad;font-size:15px">Most likely the two Supabase lines near the top of the code in <b>index.html</b> were edited incorrectly ' +
        '(the quote marks and the ; must stay). ' +
        'Press <b>F12</b>, open the <b>Console</b> tab and look for the red error message.</p></div>';
    }
  }, 4000);
</script>
