<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dice 20 · ChatWorld</title>
<style>
:root {
  --bg-0: #121317; --bg-1: #17181c; --bg-2: #1e1f25; --bg-3: #272932; --bg-4: #323543;
  --line: rgba(255, 255, 255, 0.07); --text: #e8eaee; --muted: #9aa1ad;
  --accent: #5865f2; --accent-2: #8b5cf6; --accent-grad: linear-gradient(135deg, #5865f2 0%, #8b5cf6 100%);
  --green: #23a55a; --red: #ef4444; --gold: #ffc247;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg-0); color: var(--text); }
body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; overflow-x: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }

.top { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line); background: var(--bg-1); }
.top h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.top h1 small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.x-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-3); color: var(--muted); font-size: 16px; }
.x-btn:hover { background: var(--bg-4); color: var(--text); }

main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 18px 16px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
.center { text-align: center; }
h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.01em; }
p { margin: 0; color: var(--muted); line-height: 1.55; }
.rules { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; text-align: left; }
.rules li { display: flex; gap: 12px; align-items: flex-start; color: var(--muted); line-height: 1.45; }
.rules b { color: var(--text); }
.rules .n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-grad); color: #fff; font-weight: 800; font-size: 13px; display: grid; place-items: center; }

label.field { display: block; text-align: left; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.field input { display: block; width: 100%; margin-top: 6px; height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-3); color: var(--text); font: inherit; font-size: 16px; }
.field input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.names { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; margin-top: 16px; }
@media (max-width: 420px) { .names { grid-template-columns: 1fr; } }

.btn { height: 50px; padding: 0 22px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg-3); font-weight: 700; font-size: 16px; }
.btn:hover:not(:disabled) { background: var(--bg-4); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent-grad); border: 0; color: #fff; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.1); background: var(--accent-grad); }
.btn.go { background: linear-gradient(135deg, #23a55a, #16a34a); border: 0; color: #fff; }
.btn.go:hover:not(:disabled) { filter: brightness(1.1); background: linear-gradient(135deg, #23a55a, #16a34a); }
.btn.block { width: 100%; }
.row { display: flex; gap: 10px; }
.row .btn { flex: 1; }

/* cover screen (so the other player cannot see) */
.cover { padding: 34px 20px; }
.cover .big { font-size: 56px; line-height: 1; margin-bottom: 12px; }
.cover h2 { font-size: 24px; }
.cover .btn { margin-top: 22px; }

/* playing screen */
.turn { display: flex; align-items: center; gap: 10px; }
.turn .who { flex: 1; font-weight: 800; font-size: 18px; }
.turn .lock { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--bg-3); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; }
.stage {
  position: relative; height: 270px; border-radius: 20px; border: 1px solid var(--line); overflow: hidden;
  background: radial-gradient(120% 100% at 50% 0%, #2b2f55 0%, #1a1b25 55%, #15161c 100%);
  display: grid; place-items: center; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab;
  perspective: 800px;
}
.stage:active { cursor: grabbing; }
.stage:focus-visible { outline: 2px solid var(--accent); }
.tilt { transform: rotateX(-20deg) rotateY(-24deg); transform-style: preserve-3d; }
.cube { --s: 96px; position: relative; width: var(--s); height: var(--s); transform-style: preserve-3d; transition: transform 1s cubic-bezier(.15, .75, .2, 1); }
.cube.drag { transition: none; }
.face {
  position: absolute; inset: 0; border-radius: 16px; padding: 12px; backface-visibility: hidden;
  background: linear-gradient(145deg, #ffffff 0%, #e8eaf6 100%); box-shadow: inset 0 0 0 2px rgba(88, 101, 242, .18), inset 0 -8px 16px rgba(88, 101, 242, .12);
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); place-items: center;
}
.face i { width: 17px; height: 17px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #5b6bff, #2a2f9c); }
.face.f1 i { width: 22px; height: 22px; background: radial-gradient(circle at 35% 30%, #ff7a8a, #d1213b); }
.face.f1 { transform: translateZ(48px); }
.face.f2 { transform: rotateY(90deg) translateZ(48px); }
.face.f3 { transform: rotateX(-90deg) translateZ(48px); }
.face.f4 { transform: rotateX(90deg) translateZ(48px); }
.face.f5 { transform: rotateY(-90deg) translateZ(48px); }
.face.f6 { transform: rotateY(180deg) translateZ(48px); }
.shadow { position: absolute; bottom: 34px; left: 50%; width: 110px; height: 18px; margin-left: -55px; border-radius: 50%; background: rgba(0, 0, 0, .45); filter: blur(8px); pointer-events: none; }
.swipe-hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 13px; font-weight: 600; color: var(--muted); pointer-events: none; }
.swipe-hint .arrow { display: inline-block; animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: translateX(-4px); } 50% { transform: translateX(6px); } }
.last { position: absolute; top: 12px; right: 12px; min-width: 40px; height: 40px; padding: 0 10px; border-radius: 12px; background: var(--bg-3); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 800; font-size: 20px; }

.scorebox { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.total { font-size: 54px; font-weight: 800; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.total small { font-size: 16px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.away { text-align: right; font-weight: 700; color: var(--muted); line-height: 1.3; }
.away b { display: block; font-size: 22px; color: var(--text); }
.away.over b { color: var(--red); }
.away.exact b { color: var(--green); }
.meter { position: relative; height: 10px; border-radius: 99px; background: var(--bg-4); margin-top: 26px; overflow: visible; }
.meter .fill { height: 100%; width: 0; border-radius: 99px; background: var(--accent-grad); transition: width .5s ease, background .3s; }
.meter .fill.over { background: linear-gradient(90deg, #f59e0b, #ef4444); }
.meter .mark { position: absolute; right: 0; top: -5px; width: 3px; height: 20px; border-radius: 2px; background: var(--gold); }
.meter .mark::after { content: '20'; position: absolute; top: -17px; right: -6px; font-size: 11px; font-weight: 800; color: var(--gold); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 36px; margin-top: 14px; }
.chip { min-width: 34px; height: 34px; padding: 0 10px; border-radius: 10px; background: var(--bg-3); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 800; font-variant-numeric: tabular-nums; animation: pop .25s ease-out; }
.chips .empty { color: var(--muted); font-size: 14px; align-self: center; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* reveal */
.reveal { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
@media (max-width: 420px) { .reveal { grid-template-columns: 1fr; } }
.pcard { position: relative; background: var(--bg-2); border: 1px solid var(--line); border-radius: 18px; padding: 16px; text-align: center; animation: flip .6s ease-out both; }
.pcard:nth-child(2) { animation-delay: .9s; }
@keyframes flip { from { opacity: 0; transform: rotateX(70deg) translateY(10px); } to { opacity: 1; transform: none; } }
.pcard .nm { font-weight: 800; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .tot { font-size: 52px; font-weight: 800; line-height: 1.1; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.pcard .dist { font-weight: 700; color: var(--muted); }
.pcard .chips { justify-content: center; margin-top: 10px; }
.pcard.win { border-color: rgba(255, 194, 71, .8); box-shadow: 0 0 0 1px rgba(255, 194, 71, .5), 0 10px 40px rgba(255, 170, 40, .25); }
.pcard.win .nm::before { content: '🏆 '; }
.pcard.lose { opacity: .8; }
.verdict { text-align: center; padding: 22px 16px; border-radius: 18px; background: var(--bg-2); border: 1px solid var(--line); animation: flip .6s 1.9s ease-out both; }
.verdict h2 { font-size: 26px; margin-bottom: 4px; }
.verdict.win h2 { color: var(--gold); }
.foot { text-align: center; font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .cube { transition-duration: .01s; } .pcard, .verdict, .chip { animation: none; } .swipe-hint .arrow { animation: none; } }
</style>
</head>
<body>
  <div class="top">
    <h1>🎲 Dice 20 <small>Closest to 20 wins</small></h1>
    <button id="close" class="x-btn" type="button" aria-label="Close game" title="Close" hidden>✕</button>
  </div>
  <main id="screen" aria-live="polite"></main>

<script>
'use strict';
const params = new URLSearchParams(location.search);
const EMBED = params.get('embed') === '1';
const TARGET = 20;

const S = {
  names: [(params.get('p1') || 'Player 1').slice(0, 20), (params.get('p2') || 'Player 2').slice(0, 20)],
  rolls: [[], []],
  cur: 0,
  rolling: false,
};

const $ = (s, r = document) => r.querySelector(s);
function h(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'on') for (const [e, f] of Object.entries(v)) n.addEventListener(e, f);
    else if (k === 'attrs') for (const [a, b] of Object.entries(v)) n.setAttribute(a, b);
    else n[k] = v;
  }
  for (const c of kids.flat()) if (c != null) n.append(c);
  return n;
}
const sum = (a) => a.reduce((x, y) => x + y, 0);
const dist = (t) => Math.abs(TARGET - t);

/** Fair 6-sided die: uses the browser's secure random numbers (no bias). */
function rollDie() {
  const buf = new Uint8Array(1);
  for (;;) {
    crypto.getRandomValues(buf);
    if (buf[0] < 252) return (buf[0] % 6) + 1;   // 252 = 6 * 42, so every face is equally likely
  }
}

// ---------------------------------------------------------------- screens
const screen = $('#screen');
function show(...nodes) { screen.replaceChildren(...nodes); window.scrollTo(0, 0); }

function introScreen() {
  const n1 = h('input', { type: 'text', maxLength: 20, value: S.names[0], id: 'n1', autocomplete: 'off' });
  const n2 = h('input', { type: 'text', maxLength: 20, value: S.names[1], id: 'n2', autocomplete: 'off' });
  show(
    h('div', { class: 'card' },
      h('h2', { text: 'Get as close to 20 as you can' }),
      h('p', { text: 'Two players, one secret dice game.' }),
      h('ul', { class: 'rules' },
        h('li', {}, h('span', { class: 'n', text: '1' }), h('span', {}, h('b', { text: 'Swipe the dice' }), ' to roll it. Roll as many times as you like. Every roll is added to your total.')),
        h('li', {}, h('span', { class: 'n', text: '2' }), h('span', {}, 'Your rolls stay ', h('b', { text: 'secret' }), '. Press ', h('b', { text: 'Ready' }), ' when you are happy with your total.')),
        h('li', {}, h('span', { class: 'n', text: '3' }), h('span', {}, 'When ', h('b', { text: 'both players are ready' }), ', the scores are revealed. ', h('b', { text: 'Closest to 20 wins' }), ' (going over counts too: 22 is as far away as 18).')),
      ),
      h('div', { class: 'names' },
        h('label', { class: 'field' }, 'Player 1', n1),
        h('label', { class: 'field' }, 'Player 2', n2),
      ),
    ),
    h('button', { class: 'btn primary block', type: 'button', text: 'Start game', on: { click: () => {
      S.names = [n1.value.trim() || 'Player 1', n2.value.trim() || 'Player 2'];
      S.rolls = [[], []]; S.cur = 0;
      coverScreen();
    } } }),
  );
}

function coverScreen() {
  const name = S.names[S.cur];
  show(h('div', { class: 'card center cover' },
    h('div', { class: 'big', text: S.cur === 0 ? '🎲' : '🔄' }),
    h('h2', { text: S.cur === 0 ? name + ', you are up' : 'Pass it to ' + name },),
    h('p', { text: S.cur === 0 ? 'Make sure ' + S.names[1] + ' is not looking. Your rolls are secret.' : 'Hand over the screen. ' + S.names[0] + '\'s score is hidden until you are both ready.' }),
    h('button', { class: 'btn primary', type: 'button', text: "I'm " + name + ' · Start rolling', on: { click: playScreen } }),
  ));
}

const FACE_PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
// rotation (x, y) that brings each number to the front
const SHOW = { 1: [0, 0], 2: [0, -90], 3: [90, 0], 4: [-90, 0], 5: [0, 90], 6: [0, 180] };

function buildCube() {
  const cube = h('div', { class: 'cube' });
  for (let v = 1; v <= 6; v++) {
    const f = h('div', { class: 'face f' + v });
    for (let c = 0; c < 9; c++) f.append(FACE_PIPS[v].includes(c) ? h('i') : h('span'));
    cube.append(f);
  }
  return cube;
}
const spinTo = (cur, target, sign, turns) => {
  if (sign >= 0) return cur + ((((target - cur) % 360) + 360) % 360) + 360 * turns;
  return cur - ((((cur - target) % 360) + 360) % 360) - 360 * turns;
};

function playScreen() {
  const p = S.cur;
  const rolls = S.rolls[p];
  let ax = -14, ay = 18;                     // current cube angles
  S.rolling = false;

  const cube = buildCube();
  const last = h('div', { class: 'last', hidden: true });
  const stage = h('div', { class: 'stage', tabIndex: 0, attrs: { role: 'button', 'aria-label': 'Dice. Swipe, or press Space or Enter to roll.' } },
    h('div', { class: 'shadow' }),
    h('div', { class: 'tilt' }, cube),
    last,
    h('div', { class: 'swipe-hint' }, h('span', { class: 'arrow', text: '👆' }), ' Swipe the dice to roll'),
  );
  const chips = h('div', { class: 'chips', attrs: { 'aria-label': 'Your rolls' } });
  const totalEl = h('div', { class: 'total' });
  const awayEl = h('div', { class: 'away' });
  const fill = h('div', { class: 'fill' });
  const meter = h('div', { class: 'meter' }, fill, h('div', { class: 'mark' }));
  const readyBtn = h('button', { class: 'btn go', type: 'button', text: '✓ Ready', on: { click: () => {
    if (S.rolling || !rolls.length) return;
    if (p === 0) { S.cur = 1; coverScreen(); } else revealScreen();
  } } });
  const rollBtn = h('button', { class: 'btn', type: 'button', text: '🎲 Roll', on: { click: () => doRoll(0, -1) } });

  function paint() {
    const t = sum(rolls), d = dist(t);
    totalEl.replaceChildren(String(t), h('small', { text: '/ ' + TARGET }));
    awayEl.className = 'away' + (t > TARGET ? ' over' : t === TARGET ? ' exact' : '');
    awayEl.replaceChildren(h('b', { text: t === TARGET ? 'Exactly 20!' : String(d) }), t === TARGET ? '' : (t > TARGET ? 'over 20' : 'away from 20'));
    fill.style.width = Math.min(100, (t / TARGET) * 100) + '%';
    fill.classList.toggle('over', t > TARGET);
    chips.replaceChildren(...(rolls.length ? rolls.map((v) => h('span', { class: 'chip', text: String(v) })) : [h('span', { class: 'empty', text: 'No rolls yet. Swipe the dice!' })]));
    readyBtn.disabled = !rolls.length || S.rolling;
  }

  function doRoll(dx, dy) {
    if (S.rolling) return;
    S.rolling = true; readyBtn.disabled = true; rollBtn.disabled = true;
    const v = rollDie();
    const [tx, ty] = SHOW[v];
    const horizontal = Math.abs(dx) >= Math.abs(dy);
    const sx = horizontal ? (dx >= 0 ? 1 : -1) : -(dy >= 0 ? 1 : -1);   // spin direction
    const nx = spinTo(ax, tx, horizontal ? 1 : sx, horizontal ? 1 : 3);
    const ny = spinTo(ay, ty, horizontal ? sx : 1, horizontal ? 3 : 1);
    cube.classList.remove('drag');
    void cube.offsetWidth;
    cube.style.transform = 'rotateX(' + nx + 'deg) rotateY(' + ny + 'deg)';
    ax = nx; ay = ny;
    if (navigator.vibrate) { try { navigator.vibrate(20); } catch (e) { /* not supported */ } }
    last.hidden = true;
    setTimeout(() => {
      rolls.push(v);
      S.rolling = false; rollBtn.disabled = false;
      last.textContent = String(v); last.hidden = false;
      paint();
    }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 50 : 1050);
  }

  // swipe handling (works with mouse, finger and pen)
  let down = null;
  stage.addEventListener('pointerdown', (e) => {
    if (S.rolling) return;
    down = { x: e.clientX, y: e.clientY, ax, ay };
    stage.setPointerCapture(e.pointerId);
    cube.classList.add('drag');
  });
  stage.addEventListener('pointermove', (e) => {
    if (!down) return;
    cube.style.transform = 'rotateX(' + (down.ax - (e.clientY - down.y) * 0.5) + 'deg) rotateY(' + (down.ay + (e.clientX - down.x) * 0.5) + 'deg)';
  });
  const end = (e) => {
    if (!down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y, d = down;
    down = null;
    if (Math.hypot(dx, dy) >= 36) {
      ax = d.ax - dy * 0.5; ay = d.ay + dx * 0.5;     // continue from where the finger left it
      doRoll(dx, dy);
    } else {
      cube.classList.remove('drag'); void cube.offsetWidth;
      cube.style.transform = 'rotateX(' + ax + 'deg) rotateY(' + ay + 'deg)';
    }
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', () => { if (down) { cube.classList.remove('drag'); cube.style.transform = 'rotateX(' + ax + 'deg) rotateY(' + ay + 'deg)'; down = null; } });
  stage.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); doRoll(1, 0); } });

  cube.style.transform = 'rotateX(' + ax + 'deg) rotateY(' + ay + 'deg)';
  show(
    h('div', { class: 'turn' }, h('div', { class: 'who', text: S.names[p] + "'s turn" }), h('span', { class: 'lock', text: '🔒 Secret' })),
    stage,
    h('div', { class: 'card' },
      h('div', { class: 'scorebox' }, totalEl, awayEl),
      meter,
      chips,
    ),
    h('div', { class: 'row' }, rollBtn, readyBtn),
    h('div', { class: 'foot', text: 'Roll as many times as you want. Press Ready when you are done.' }),
  );
  paint();
}

function revealScreen() {
  const t = [sum(S.rolls[0]), sum(S.rolls[1])], d = [dist(t[0]), dist(t[1])];
  const win = d[0] === d[1] ? -1 : d[0] < d[1] ? 0 : 1;
  const card = (i) => h('div', { class: 'pcard' + (win === i ? ' win' : win === -1 ? '' : ' lose') },
    h('div', { class: 'nm', text: S.names[i] }),
    h('div', { class: 'tot', text: String(t[i]) }),
    h('div', { class: 'dist', text: t[i] === TARGET ? 'Exactly 20!' : d[i] + (t[i] > TARGET ? ' over' : ' under') }),
    h('div', { class: 'chips' }, S.rolls[i].map((v) => h('span', { class: 'chip', text: String(v) }))),
  );
  let title, sub;
  if (win === -1) { title = "It's a draw!"; sub = 'Both players are ' + d[0] + ' away from 20.'; }
  else { title = '🏆 ' + S.names[win] + ' wins!'; sub = S.names[win] + ' is ' + d[win] + ' away from 20, ' + S.names[1 - win] + ' is ' + d[1 - win] + ' away.'; }
  show(
    h('div', { class: 'center' }, h('h2', { text: 'Both players are ready' }), h('p', { text: 'Revealing the scores…' })),
    h('div', { class: 'reveal' }, card(0), card(1)),
    h('div', { class: 'verdict' + (win === -1 ? '' : ' win') }, h('h2', { text: title }), h('p', { text: sub })),
    h('div', { class: 'row' },
      h('button', { class: 'btn primary', type: 'button', text: 'Play again', on: { click: () => { S.rolls = [[], []]; S.cur = 0; coverScreen(); } } }),
      EMBED ? h('button', { class: 'btn', type: 'button', text: 'Back to chat', on: { click: closeGame } }) : h('button', { class: 'btn', type: 'button', text: 'Change names', on: { click: introScreen } }),
    ),
  );
}

function closeGame() { try { parent.postMessage({ type: 'dice-close' }, '*'); } catch (e) { /* ignore */ } }

if (EMBED) { const x = $('#close'); x.hidden = false; x.addEventListener('click', closeGame); }

if (params.get('p1') && params.get('p2')) { S.rolls = [[], []]; coverScreen(); } else introScreen();
